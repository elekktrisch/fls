
version: 1
hibernate_pin: "7.x"
tenant_id_type: "UUID"

overrides:


  Persons:
    kind: cross-tenant
    target_entity: Person
    rationale_ref: tenant-catalog.md#persons
    pii_columns:
      - firstname
      - lastname
      - midname
      - company_name
      - address_line1
      - address_line2
      - zip
      - city
      - region
      - private_phone
      - mobile_phone
      - business_phone
      - fax_number
      - email_private
      - email_business
      - birthday
      - licence_number
      - spot_link

  PersonClub:
    kind: tenant-scoped
    target_entity: PersonClub
    rationale_ref: tenant-catalog.md#personclub
    pii_columns:
      - member_number


  Users:
    kind: principal
    target_entity: User
    rationale_ref: tenant-catalog.md#users
    pii_columns:
      - username
      - notification_email
      - phone_number
      - remarks


  Countries:
    kind: reference
    target_entity: Country
    rationale_ref: tenant-catalog.md#reference-data
  LanguageTranslations:
    kind: reference
    target_entity: LanguageTranslation
    rationale_ref: tenant-catalog.md#reference-data
  Languages:
    kind: reference
    target_entity: Language
    rationale_ref: tenant-catalog.md#reference-data
  AircraftTypes:
