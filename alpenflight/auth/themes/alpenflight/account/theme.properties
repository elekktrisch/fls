# S-171 — AlpenFlight account console theme.
#
# Parent is keycloak.v3 — the Quarkus/React account console shipped as
# the default in Keycloak 26.x. The v2 account console (which still
# exists in keycloak-themes-26.5.7.jar at theme/keycloak/account/) is
# legacy and will be removed in a future major.
#
# v3 takes assets via resources/img and the standard v3 entrypoints
# (logo.svg, favicon.svg) — no styles= list (the React app bundles its
# own CSS).

parent=keycloak.v3

locales=de,en,fr,it
