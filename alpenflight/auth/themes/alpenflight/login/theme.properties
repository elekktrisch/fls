# S-171 — AlpenFlight login theme.
#
# Bridges the Keycloak login page (Keycloak v26's React-rebuilt v2 track)
# to the AlpenFlight visual system (ADR 0024): slate chrome, brand-blue
# accents, sharp corners, Roboto.
#
# Parent must stay keycloak.v2 — the legacy `keycloak` login theme is EOL
# in Keycloak 27. import=common/keycloak pulls in PatternFly v5 vendor
# assets the v2 theme expects.
#
# styles= lists the parent stylesheet FIRST then the override. Keycloak
# does NOT auto-merge parent + child styles entries; omitting the parent
# CSS renders the form unstyled and listing the override before the
# parent breaks the cascade. Read /opt/keycloak/themes/keycloak.v2/login/
# theme.properties inside the running image if the parent list needs
# updating after a Keycloak version bump.

parent=keycloak.v2
import=common/keycloak

styles=css/styles.css css/login.css

locales=de,en,fr,it
