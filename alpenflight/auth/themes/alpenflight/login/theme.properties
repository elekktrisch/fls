# keycloak.v2 is the supported v26 React login track; legacy `keycloak`
# is EOL in K27. import=common/keycloak pulls in PatternFly v5 vendor
# assets the v2 theme expects.
#
# styles= lists the parent stylesheet FIRST then the override — Keycloak
# does NOT auto-merge parent + child entries. Read the parent list from
# /opt/keycloak/themes/keycloak.v2/login/theme.properties inside the
# running image after a Keycloak version bump.

parent=keycloak.v2
import=common/keycloak

styles=css/styles.css css/login.css

# Pin the favicon path so the parent template's ${properties.favIcon!...}
# lookup resolves to our shipped asset rather than the default.
favIcon=img/favicon.ico

locales=de,en,fr,it
