# Shorter locale labels. Keycloak's default falls back to JDK's
# Locale.getDisplayName() (e.g. "German (Deutsch)") which wraps the
# narrow locale-selector column. Override to native-name-only.
#
# Special chars use \uXXXX escapes — Java .properties files default to
# ISO-8859-1 and modern Keycloak readers honor UTF-8, but the escape
# form is portable across both regardless of file encoding.
locale_de=Deutsch
locale_en=English
locale_fr=Français
locale_it=Italiano

# Shorter page title — default "Sign in to your account" wraps to two
# lines in narrower locales (notably French). Sentence-case verb-form
# fits all four locales in a single line + matches ADR 0024 voice.
loginAccountTitle=Sign in

# Custom key used by alpenflight/login/footer.ftl
backToLanding=Back to Start
