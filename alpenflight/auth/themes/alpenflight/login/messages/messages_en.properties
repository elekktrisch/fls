# Shorter locale labels — Keycloak's default resolves `locale_xx` via the
# JDK's Locale.getDisplayName(), which yields "German (Deutsch)" etc. and
# wraps in the narrow locale-selector column. Override to native-name-only.
locale_de=Deutsch
locale_en=English
locale_fr=Français
locale_it=Italiano

# Custom keys used by alpenflight/login/footer.ftl
backToLanding=Back to AlpenFlight
