# Email has never been re-platformed — `keycloak` is the only parent
# shipped (no keycloak.v2 / v3 email tracks exist). The visual jump to
# AlpenFlight branding inside email bodies would need a FreeMarker
# override, deliberately out of scope.
#
# `locales=` is intentionally NOT declared here: the override would flag
# this theme as the locale-bundle authority for the listed locales, but
# the theme ships no `email/messages/` directory to back the claim.
# Parent inheritance covers the full locale set; declaring nothing keeps
# the stock email bundles in play.

parent=keycloak
