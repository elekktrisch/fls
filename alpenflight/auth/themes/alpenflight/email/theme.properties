# Email has never been re-platformed — `keycloak` is the only parent
# shipped (no keycloak.v2 / v3 email tracks exist). The visual jump to
# AlpenFlight branding inside email bodies would need a FreeMarker
# override, deliberately out of scope.
#
# `locales=` is intentionally NOT declared here: declaring it flagged
# this theme as the locale-bundle authority for the listed locales, but
# the theme ships no `email/messages/` directory, which broke the
# verify-email FreeMarker template on Keycloak 26.5 ("SEND_VERIFY_EMAIL_ERROR
# / Failed to template email"). Inheriting the parent's full locale set
# keeps the stock email bundles in play.

parent=keycloak
