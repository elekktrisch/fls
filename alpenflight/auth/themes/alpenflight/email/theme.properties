# S-171 — AlpenFlight email theme.
#
# The email theme has never been re-platformed — `keycloak` is the only
# parent shipped for emails (no keycloak.v2 / v3 email tracks exist).
# Stock parent templates render with the realm display name and the
# Keycloak chrome; the visual jump to AlpenFlight branding inside email
# bodies would need a FreeMarker override, which is out of scope per the
# story's "no FTL rewrites" cap (refinement Security plan).

parent=keycloak

locales=de,en,fr,it
