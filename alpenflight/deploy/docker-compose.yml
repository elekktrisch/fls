services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: alpenflight
      POSTGRES_USER: alpenflight
      POSTGRES_PASSWORD: alpenflight
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alpenflight -d alpenflight"]
      interval: 5s
      timeout: 5s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.2
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./keycloak/realm-alpenflight.json:/opt/keycloak/data/import/realm-alpenflight.json:ro
    ports:
      - "8081:8080"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -c 'exec 3<>/dev/tcp/localhost/9000 && printf \"GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3 && cat <&3 | grep -qE \"\\\"status\\\":[[:space:]]*\\\"UP\\\"\"'",
        ]
      interval: 5s
      timeout: 5s
      retries: 30

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: alpenflight
      DB_OWNER_USER: alpenflight
      DB_OWNER_PASSWORD: alpenflight
      DB_APP_USER: app_user
      DB_APP_PASSWORD: app_user
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -c 'exec 3<>/dev/tcp/localhost/8080 && printf \"GET /api/v1/system/status HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3 && cat <&3 | grep -q \"\\\"status\\\":\\\"UP\\\"\"'",
        ]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  postgres-data:
