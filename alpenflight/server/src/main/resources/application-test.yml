server:
  port: 0

spring:
  datasource:
    hikari:
      maximum-pool-size: 4
      minimum-idle: 0
      idle-timeout: 10000
  jpa:
    properties:
      hibernate:
        generate_statistics: true
  flyway:
    connect-retries: 5
    connect-retries-interval: 2s
    placeholders:
      alpenflight.operator.keycloak_sub: ${ALPENFLIGHT_OPERATOR_KEYCLOAK_SUB:00000000-0000-0000-0000-0000000000ff}
      app_role_password: alpenflight_app
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://test-issuer
          jwk-set-uri: http://test-issuer/jwks

alpenflight:
  mail:
    enabled: true
  migration:
    master-keyset:
      source: EPHEMERAL
    ingest:
      global-permits: 100
