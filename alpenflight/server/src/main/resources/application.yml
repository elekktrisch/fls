spring:
  application:
    name: alpenflight-server
  profiles:
    default: dev
  datasource:
    # Env-driven; application-dev.yml provides loopback defaults for local dev,
    # application-prod.yml documents the production env-var contract.
    url: ${DATASOURCE_URL}
    username: ${DATASOURCE_USER}
    password: ${DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  flyway:
    # Every property pinned explicitly so future BOM bumps surface as
    # visible config changes (per S-009 security plan).
    enabled: true
    locations: classpath:db/migration
    out-of-order: false           # strict ordering
    validate-on-migrate: true
    baseline-on-migrate: false    # S-016 cutover overrides via its own profile
    clean-disabled: true          # non-negotiable; protects against `flyway clean` on prod
    schemas: public
    default-schema: public
    table: flyway_schema_history
  jpa:
    # No JPA starter on the classpath yet — this is a no-op until S-012, but
    # locks the invariant so Hibernate session boundaries are correct when JPA
    # arrives. open-in-view=true is the OSIV footgun that hides N+1 in dev.
    open-in-view: false
  jackson:
    datatype:
      datetime:
        # Jackson 3 moved WRITE_DATES_AS_TIMESTAMPS out of SerializationFeature
        # into DateTimeFeature. ISO-8601 strings, not unix-millis.
        write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: true
    mapper:
      # Strict matching at the DTO boundary: a field named `clubId` does NOT
      # accept payload key `ClubId`. Catches API contract drift loudly.
      accept-case-insensitive-properties: false
    default-property-inclusion: non_null
    time-zone: UTC
  threads:
    virtual:
      # JEP 491 (Java 25) eliminated `synchronized` pinning. Re-audit when
      # S-018 ShedLock + S-022 @TenantId ThreadLocal propagation land.
      enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          # Split-port topology: JWKS discovery (Spring → Keycloak inside the
          # compose network) and `iss` validation (against the host URL baked
          # into every token) need different URLs. The programmatic JwtDecoder
          # in JwtDecoderConfig consumes both; auto-config backs off when the
          # bean is present. See alpenflight/auth/README.md §Gotcha for S-020. Both
          # values env-overridable for the prod hosted-IdP swap.
          issuer-uri: ${ALPENFLIGHT_OIDC_ISSUER_URI:http://localhost:8090/realms/alpenflight}
          jwk-set-uri: ${ALPENFLIGHT_OIDC_JWK_SET_URI:http://keycloak:8080/realms/alpenflight/protocol/openid-connect/certs}

# S-027: default-deny audit serialization. Entries here whitelist fields that
# may land verbatim in `mutation_audit_event.before_state` / `after_state`;
# everything else is replaced by the `[redacted]` sentinel. `deny-all` is the
# central kill-switch for known-PII entities — Person stays out of the trail
# entirely until a GDPR/FADP-reviewed allow-list lands.
audit:
  redaction:
    deny-all:
      - Person
    entities:
      # Names below are the entity field names (what reflection sees), NOT
      # the JSON-serialized property names — the redactor walks @Entity
      # fields directly. Coverage is enforced by AuditRedactionCoverageTest;
      # a new field that's neither here nor @AuditRedact-annotated fails CI.
      Club:
        # `name` matches the ClubResponse DTO field; `clubname` matches the
        # Club entity field. Service-layer callers may pass either shape;
        # both are safe to log.
        allow:
          - id
          - name
          - clubname
          - slug
          - clubKey
          - countryId
          - clubStateId
          - publicRegistrationEnabled
          - deletedOn
      Location:
        # Lists both DTO field names and entity field names — see Club above.
        allow:
          - id
          - clubId
          - locationName
          - locationShortName
          - countryId
          - locationTypeId
          - icaoCode
          - latitude
          - longitude
          - elevation
          - elevationUnitTypeId
          - runwayDirection
          - runwayLength
          - runwayLengthUnitTypeId
          - airportFrequency
          - description
          - sortIndicator
          - isInboundRouteRequired
          - isOutboundRouteRequired
          - isFastEntryRecord
          - inboundRouteRequired
          - outboundRouteRequired
          - fastEntryRecord
          - inOutboundPoints
          - deletedOn
          - deletedByUserId
      InOutboundPoint:
        allow:
          - id
          - location
          - pointName
          - pointType
          - direction
          - description
      InOutboundPointResponse:
        # Nested under LocationDetail.inOutboundPoints. The redactor recurses
        # into nested aggregates under the runtime type's simple name; this
        # mirrors InOutboundPoint, minus the back-reference to Location.
        allow:
          - id
          - pointName
          - pointType
          - direction
          - description
      MemberState:
        allow:
          - id
          - clubId
          - name
      PersonClub:
        # Aggregate-internal child of the cross-tenant Person root. Member
        # number is identity-bearing but not PII (legacy parity: club-issued
        # ID, not a national identifier); role flags and notification prefs
        # are operational booleans. The back-reference field `person` is
        # intentionally omitted from the allow-list — Person is in deny-all,
        # so even if the redactor recursed it would redact, but keeping
        # `person` off the list defends against a future allow-list relax
        # on Person.
        allow:
          - id
          - clubId
          - memberNumber
          - memberStateId
          - motorPilot
          - towPilot
          - gliderInstructor
          - gliderPilot
          - gliderTrainee
          - passenger
          - winchOperator
          - motorInstructor
          - receiveFlightReports
          - receiveAircraftReservationNotifications
          - receivePlanningDayRoleReminder
          - active
          - deletedOn
          - deletedByUserId
      LookupAuditPayload:
        # Lookup-audit payload (PersonsService.lookup → LOOKUP_HIT/MISS).
        # Three forensic primitives, all non-PII: tenant uuid + byEmail flag
        # + match count. Whitelist so the redactor doesn't scrub the
        # diagnostic value out of the audit row.
        allow:
          - tenant
          - byEmail
          - matchCount
      Aircraft:
        # Lists both DTO field names (`isXxx`-prefixed by Jackson convention)
        # and entity field names. Service-layer callers may pass either.
        allow:
          - id
          - managingClubId
          - ownerClubId
          - aircraftTypeId
          - immatriculation
          - manufacturerName
          - aircraftModel
          - competitionSign
          - flarmId
          - aircraftSerialNumber
          - yearOfManufacture
          - noiseClass
          - noiseLevel
          - mtom
          - nrOfSeats
          - aircraftOwnerPersonId
          - flightOperatingCounterUnitTypeId
          - engineOperatingCounterUnitTypeId
          - homebaseId
          - spotLink
          - isTowingOrWinchRequired
          - isTowingStartAllowed
          - isWinchStartAllowed
          - isTowingAircraft
          - isFastEntryRecord
          - towingOrWinchRequired
          - towingStartAllowed
          - winchStartAllowed
          - towingAircraft
          - fastEntryRecord
          - comment
          - daecIndex
          - currentState
          - latestCounter
          - deletedOn
          - deletedByUserId
          - stateHistory
          - operatingCounters
      AircraftStateHistoryEntry:
        # `noticedByPersonId` + `remarks` carry @AuditRedact on the field
        # (PII-adjacent / free text); reflection redacts them regardless of
        # this list. Keeping the rest explicit means coverage gaps surface.
        allow:
          - id
          - aircraft
          - aircraftStateId
          - validFrom
          - validTo
          - deletedOn
          - deletedByUserId
      AircraftStateHistoryEntryResponse:
        # Nested under AircraftDetail.currentState. PII-adjacent fields
        # noticedByPersonId / remarks are NOT in the allow list — they
        # default-deny to "[redacted]" on the recursed walk. (The entity
        # mirror already has @AuditRedact on the same fields, which gates
        # the entity-path too.)
        allow:
          - id
          - aircraftStateId
          - validFrom
          - validTo
      AircraftOperatingCounter:
        allow:
          - id
          - aircraft
          - atDateTime
          - totalTowedGliderStarts
          - totalWinchLaunchStarts
          - totalSelfStarts
          - flightOperatingCounterInSeconds
          - engineOperatingCounterInSeconds
          - nextMaintenanceAtFlightOperatingCounterInSeconds
          - nextMaintenanceAtEngineOperatingCounterInSeconds
          - deletedOn
          - deletedByUserId
      AircraftOperatingCounterResponse:
        # Nested under AircraftDetail.latestCounter.
        allow:
          - id
          - atDateTime
          - totalTowedGliderStarts
          - totalWinchLaunchStarts
          - totalSelfStarts
          - flightOperatingCounterInSeconds
          - engineOperatingCounterInSeconds
          - nextMaintenanceAtFlightOperatingCounterInSeconds
          - nextMaintenanceAtEngineOperatingCounterInSeconds

server:
  port: 8080
  http2:
    enabled: true
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/plain,text/css,application/javascript
    min-response-size: 1024
  error:
    include-stacktrace: never
    include-message: never
    include-exception: false
    include-binding-errors: never
  shutdown: graceful
  tomcat:
    max-http-form-post-size: 1MB
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

management:
  endpoints:
    web:
      exposure:
        include: health,info
        exclude: env,heapdump,threaddump,loggers,configprops,beans,shutdown
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized

# OpenAPI spec publication. Off by default — profiles flip it on (see
# application-dev.yml + application-test.yml). prod stays off so a stray
# SPRINGDOC_* env var cannot expose the API shape on a production install;
# OpenApiOffByDefaultIT regression-locks the prod 404.
springdoc:
  api-docs:
    enabled: false
    version: openapi_3_1   # default is openapi_3_0; codegen wants 3.1
  swagger-ui:
    enabled: false
  show-actuator: false     # keep /actuator/* out of the codegen surface
