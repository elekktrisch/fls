alpenflight:
  mail:
    enabled: ${ALPENFLIGHT_MAIL_ENABLED:false}
    from: ${ALPENFLIGHT_MAIL_FROM:noreply@alpenflight.ch}
  ogn:
    ddb-url: ${ALPENFLIGHT_OGN_DDB_URL:http://ddb.glidernet.org/download?j=1}
  scheduling:
    lock:
      enabled: false
  migration:
    master-keyset:
      source: ${ALPENFLIGHT_MIGRATION_MASTER_KEYSET_SOURCE:INLINE}
      value: ${ALPENFLIGHT_MIGRATION_MASTER_KEYSET:}
    bundle-timeout: PT15M
    ingest:
      global-permits: 1

server:
  port: 8080
  http2:
    enabled: true
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/plain,text/css,application/javascript
    min-response-size: 1024
  error:
    include-stacktrace: never
    include-message: never
    include-exception: false
    include-binding-errors: never
  shutdown: graceful
  tomcat:
    max-http-form-post-size: 1MB
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

management:
  endpoints:
    web:
      exposure:
        include: health,info
        exclude: env,heapdump,threaddump,loggers,configprops,beans,shutdown
  health:
    mail:
      enabled: false
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized

springdoc:
  api-docs:
    enabled: false
    version: openapi_3_1
  swagger-ui:
    enabled: false
  show-actuator: false
