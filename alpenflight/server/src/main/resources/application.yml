spring:
  application:
    name: alpenflight-server
  profiles:
    default: dev
  datasource:
    url: ${DATASOURCE_URL}
    username: ${DATASOURCE_USER}
    password: ${DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    url: ${MIGRATOR_DB_URL:${DATASOURCE_URL}}
    user: ${MIGRATOR_DB_USER:alpenflight}
    password: ${MIGRATOR_DB_PASSWORD:alpenflight}
    locations: classpath:db/migration
    out-of-order: false
    validate-on-migrate: true
    baseline-on-migrate: false
    clean-disabled: true
    schemas: public
    default-schema: public
    table: flyway_schema_history
    placeholders:
      alpenflight.operator.keycloak_sub: ${ALPENFLIGHT_OPERATOR_KEYCLOAK_SUB}
      app_role_password: ${APP_DB_PASSWORD:alpenflight_app}
  jpa:
    open-in-view: false
  jackson:
    datatype:
      datetime:
        write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: true
    mapper:
      accept-case-insensitive-properties: false
    default-property-inclusion: non_null
    time-zone: UTC
  threads:
    virtual:
      enabled: true
  mail:
    host: ${ALPENFLIGHT_MAIL_HOST:localhost}
    port: ${ALPENFLIGHT_MAIL_PORT:1025}
    username: ${ALPENFLIGHT_MAIL_USERNAME:}
    password: ${ALPENFLIGHT_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${ALPENFLIGHT_MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${ALPENFLIGHT_MAIL_SMTP_STARTTLS:false}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${ALPENFLIGHT_OIDC_ISSUER_URI:http://localhost:8090/realms/alpenflight}
          jwk-set-uri: ${ALPENFLIGHT_OIDC_JWK_SET_URI:http://keycloak:8080/realms/alpenflight/protocol/openid-connect/certs}

demo:
  pool-size: ${ALPENFLIGHT_DEMO_POOL_SIZE:10}
  max-live-seats-per-address: ${ALPENFLIGHT_DEMO_MAX_LIVE_SEATS_PER_ADDRESS:1}
  lease-idle-period: ${ALPENFLIGHT_DEMO_LEASE_IDLE_PERIOD:PT30M}

keycloak:
  admin:
    base-url: ${ALPENFLIGHT_KC_ADMIN_BASE_URL:http://keycloak:8080}
    realm: ${ALPENFLIGHT_KC_ADMIN_REALM:alpenflight}
    client-id: ${ALPENFLIGHT_KC_ADMIN_CLIENT_ID:alpenflight-backend-admin}
    client-secret: ${ALPENFLIGHT_KC_ADMIN_CLIENT_SECRET:alpenflight-backend-admin-dev-secret}
    refresh-skew-seconds: ${ALPENFLIGHT_KC_ADMIN_REFRESH_SKEW_SECONDS:30}

