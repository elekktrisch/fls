spring:
  application:
    name: alpenflight-server
  profiles:
    default: dev
  datasource:
    # Env-driven; application-dev.yml provides loopback defaults for local dev,
    # application-prod.yml documents the production env-var contract.
    url: ${DATASOURCE_URL}
    username: ${DATASOURCE_USER}
    password: ${DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  flyway:
    # Every property pinned explicitly so future BOM bumps surface as
    # visible config changes (per S-009 security plan).
    enabled: true
    locations: classpath:db/migration
    out-of-order: false           # strict ordering
    validate-on-migrate: true
    baseline-on-migrate: false    # S-016 cutover overrides via its own profile
    clean-disabled: true          # non-negotiable; protects against `flyway clean` on prod
    schemas: public
    default-schema: public
    table: flyway_schema_history
    placeholders:
      # S-137 V14 backfill: the operator Deployment owns every pre-existing
      # Club. Prod must set ALPENFLIGHT_OPERATOR_KEYCLOAK_SUB; the migration
      # fails loud if unset. application-dev.yml + application-test.yml
      # carry a sentinel default so local dev + CI tests don't need the env.
      alpenflight.operator.keycloak_sub: ${ALPENFLIGHT_OPERATOR_KEYCLOAK_SUB}
  jpa:
    # No JPA starter on the classpath yet — this is a no-op until S-012, but
    # locks the invariant so Hibernate session boundaries are correct when JPA
    # arrives. open-in-view=true is the OSIV footgun that hides N+1 in dev.
    open-in-view: false
  jackson:
    datatype:
      datetime:
        # Jackson 3 moved WRITE_DATES_AS_TIMESTAMPS out of SerializationFeature
        # into DateTimeFeature. ISO-8601 strings, not unix-millis.
        write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: true
    mapper:
      # Strict matching at the DTO boundary: a field named `clubId` does NOT
      # accept payload key `ClubId`. Catches API contract drift loudly.
      accept-case-insensitive-properties: false
    default-property-inclusion: non_null
    time-zone: UTC
  threads:
    virtual:
      # JEP 491 (Java 25) eliminated `synchronized` pinning. Re-audit when
      # S-018 ShedLock + S-022 @TenantId ThreadLocal propagation land.
      enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          # Split-port topology: JWKS discovery (Spring → Keycloak inside the
          # compose network) and `iss` validation (against the host URL baked
          # into every token) need different URLs. The programmatic JwtDecoder
          # in JwtDecoderConfig consumes both; auto-config backs off when the
          # bean is present. See alpenflight/auth/README.md §Gotcha for S-020. Both
          # values env-overridable for the prod hosted-IdP swap.
          issuer-uri: ${ALPENFLIGHT_OIDC_ISSUER_URI:http://localhost:8090/realms/alpenflight}
          jwk-set-uri: ${ALPENFLIGHT_OIDC_JWK_SET_URI:http://keycloak:8080/realms/alpenflight/protocol/openid-connect/certs}

# Backend → Keycloak admin-REST machine client (alpenflight-backend-admin).
# Service-account scope set is pinned by alpenflight/auth/scripts/check-realm-
# shape.sh: manage-groups + manage-realm + manage-users + query-users +
# view-users (the deployment-provisioning adapter needs the first two on top
# of the user-directory adapter's baseline).
keycloak:
  admin:
    base-url: ${ALPENFLIGHT_KC_ADMIN_BASE_URL:http://keycloak:8080}
    realm: ${ALPENFLIGHT_KC_ADMIN_REALM:alpenflight}
    client-id: ${ALPENFLIGHT_KC_ADMIN_CLIENT_ID:alpenflight-backend-admin}
    # Dev placeholder matches the committed realm-export; production overrides via env.
    client-secret: ${ALPENFLIGHT_KC_ADMIN_CLIENT_SECRET:alpenflight-backend-admin-dev-secret}
    refresh-skew-seconds: ${ALPENFLIGHT_KC_ADMIN_REFRESH_SKEW_SECONDS:30}

# S-027: default-deny audit serialization. Entries here whitelist fields that
# may land verbatim in `mutation_audit_event.before_state` / `after_state`;
# everything else is replaced by the `[redacted]` sentinel. `deny-all` is the
# central kill-switch for known-PII entities — Person stays out of the trail
# entirely until a GDPR/FADP-reviewed allow-list lands.
audit:
  redaction:
    deny-all:
      - Person
      # S-058 — Flight + FlightCrew carry PII-laden columns (comment,
      # incidentComment, validationErrors, outbound/inboundRoute). Default-
      # deny here defers the allow-list to a follow-up security-engineer
      # story; the mutation_audit_event still records action + tenant +
      # actor + entity id so the trail is observable for forensics.
      - Flight
      - FlightCrew
    entities:
      # Names below are the entity field names (what reflection sees), NOT
      # the JSON-serialized property names — the redactor walks @Entity
      # fields directly. Coverage is enforced by AuditRedactionCoverageTest;
      # a new field that's neither here nor @AuditRedact-annotated fails CI.
      Club:
        # `name` matches the ClubResponse DTO field; `clubname` matches the
        # Club entity field. Service-layer callers may pass either shape;
        # both are safe to log.
        allow:
          - id
          - name
          - clubname
          - slug
          - clubKey
          - countryId
          - clubStateId
          - deploymentId
          - publicRegistrationEnabled
          - deletedOn
      Deployment:
        # S-137 lifecycle audit emission. The before/after snapshot is a
        # LifecycleSnapshot record (lifecycleState only) — the policy is
        # keyed by entityType="Deployment" and the redactor walks the
        # snapshot's field names. The Deployment @Entity itself never
        # serialises into an audit row directly; the @AuditRedact-annotated
        # fields (name, ownerKeycloakSub, idempotencyKey, billingCustomerId,
        # billingSubscriptionId) cover the AuditRedactionCoverageTest
        # ArchUnit scan that walks the @Entity's fields.
        allow:
          - id
          - lifecycleState
          - plan
          - trialStartedAt
          - createdOn
          - modifiedOn
          - version
          - pendingTransitions
          # S-138 — Phase B (Keycloak reconcile) state. Two values: PENDING
          # / READY. Operationally informative, never PII.
          - keycloakState
      Location:
        # Lists both DTO field names and entity field names — see Club above.
        allow:
          - id
          - clubId
          - locationName
          - locationShortName
          - countryId
          - locationTypeId
          - icaoCode
          - latitude
          - longitude
          - elevation
          - elevationUnitTypeId
          - runwayDirection
          - runwayLength
          - runwayLengthUnitTypeId
          - airportFrequency
          - description
          - sortIndicator
          - isInboundRouteRequired
          - isOutboundRouteRequired
          - isFastEntryRecord
          - inboundRouteRequired
          - outboundRouteRequired
          - fastEntryRecord
          - inOutboundPoints
          - deletedOn
          - deletedByUserId
      InOutboundPoint:
        allow:
          - id
          - location
          - pointName
          - pointType
          - direction
          - description
      InOutboundPointResponse:
        # Nested under LocationDetail.inOutboundPoints. The redactor recurses
        # into nested aggregates under the runtime type's simple name; this
        # mirrors InOutboundPoint, minus the back-reference to Location.
        allow:
          - id
          - pointName
          - pointType
          - direction
          - description
      MemberState:
        allow:
          - id
          - clubId
          - name
      PersonClub:
        # Aggregate-internal child of the cross-tenant Person root. Member
        # number is identity-bearing but not PII (legacy parity: club-issued
        # ID, not a national identifier); role flags and notification prefs
        # are operational booleans. The back-reference field `person` is
        # intentionally omitted from the allow-list — Person is in deny-all,
        # so even if the redactor recursed it would redact, but keeping
        # `person` off the list defends against a future allow-list relax
        # on Person.
        allow:
          - id
          - clubId
          - memberNumber
          - memberStateId
          - motorPilot
          - towPilot
          - gliderInstructor
          - gliderPilot
          - gliderTrainee
          - passenger
          - winchOperator
          - motorInstructor
          - receiveFlightReports
          - receiveAircraftReservationNotifications
          - receivePlanningDayRoleReminder
          - active
          - deletedOn
          - deletedByUserId
      PersonLicences:
        # J-4 T-08 (AC4) — the `person.licences_updated` self-edit audit. This
        # entity type is the SelfLicencesView snapshot, NOT the Person @Entity
        # (which stays in deny-all). The Pilot tab is FADP-sensitive, so the
        # journey requires a READABLE before/after diff for a sysadmin: the
        # licence flags + licence number + start-permission flags emit verbatim.
        # The medical-expiry dates ride verbatim too FOR NOW — the medical-field
        # PII-redaction policy (which dates emitted vs hashed) is explicitly
        # DEFERRED per S-182's open questions; revisit when that policy lands.
        allow:
          - hasMotorPilotLicence
          - hasTowPilotLicence
          - hasGliderInstructorLicence
          - hasGliderPilotLicence
          - hasGliderTraineeLicence
          - hasGliderPaxLicence
          - hasTmgLicence
          - hasWinchOperatorLicence
          - hasMotorInstructorLicence
          - hasPartMLicence
          - licenceNumber
          - medicalClass1ExpireDate
          - medicalClass2ExpireDate
          - medicalLaplExpireDate
          - gliderInstructorLicenceExpireDate
          - motorInstructorLicenceExpireDate
          - partMLicenceExpireDate
          - hasGliderTowingStartPermission
          - hasGliderSelfStartPermission
          - hasGliderWinchStartPermission
          - receiveOwnedAircraftStatisticReports
      User:
        # S-052 — Email + friendlyName + phone are PII and omitted; the audit
        # row carries them as `[redacted]`. The id-shaped + tenant-shaped
        # columns ride verbatim so a forensic timeline reads cleanly. Soft-
        # delete actor fields are allowed so DELETE rows show who flipped it.
        # `active` / `enabled` are intentionally absent — they're not entity
        # fields (active is derived from deletedOn at read-time; enabled is
        # a Keycloak-side concept that only appears on UserResponse).
        allow:
          - id
          - clubId
          - keycloakSub
          - personId
          - languageId
          - deletedOn
          - deletedByUserId
      UserResponse:
        # DTO mirror — same allow-list as User. The `roles` array is a wire
        # primitive (enum strings) and is fine to log; `username` is a login
        # identifier (not PII). `phoneNumber` + `remarks` intentionally
        # absent — PII; ride as `[redacted]`.
        allow:
          - id
          - clubId
          - username
          - languageId
          - personId
          - roles
          - enabled
          - invitePending
      UserRoleAuditPayload:
        # USER_ROLE_GRANTED / REVOKED / REJECT_GRANT payload. Tiny
        # diagnostic record (typed; matches the record's simple class name).
        # No PII.
        allow:
          - action
          - targetRole
      LookupAuditPayload:
        # Lookup-audit payload (PersonsService.lookup → LOOKUP_HIT/MISS).
        # Three forensic primitives, all non-PII: tenant uuid + byEmail flag
        # + match count. Whitelist so the redactor doesn't scrub the
        # diagnostic value out of the audit row.
        allow:
          - tenant
          - byEmail
          - matchCount
      Aircraft:
        # Lists both DTO field names (`isXxx`-prefixed by Jackson convention)
        # and entity field names. Service-layer callers may pass either.
        allow:
          - id
          - managingClubId
          - ownerClubId
          - aircraftTypeId
          - immatriculation
          - manufacturerName
          - aircraftModel
          - competitionSign
          - flarmId
          - aircraftSerialNumber
          - yearOfManufacture
          - noiseClass
          - noiseLevel
          - mtom
          - nrOfSeats
          - aircraftOwnerPersonId
          - flightOperatingCounterUnitTypeId
          - engineOperatingCounterUnitTypeId
          - homebaseId
          - spotLink
          - isTowingOrWinchRequired
          - isTowingStartAllowed
          - isWinchStartAllowed
          - isTowingAircraft
          - isFastEntryRecord
          - towingOrWinchRequired
          - towingStartAllowed
          - winchStartAllowed
          - towingAircraft
          - fastEntryRecord
          - comment
          - daecIndex
          - currentState
          - latestCounter
          - deletedOn
          - deletedByUserId
          - stateHistory
          - operatingCounters
      AircraftStateHistoryEntry:
        # `noticedByPersonId` + `remarks` carry @AuditRedact on the field
        # (PII-adjacent / free text); reflection redacts them regardless of
        # this list. Keeping the rest explicit means coverage gaps surface.
        allow:
          - id
          - aircraft
          - aircraftStateId
          - validFrom
          - validTo
          - deletedOn
          - deletedByUserId
      AircraftStateHistoryEntryResponse:
        # Nested under AircraftDetail.currentState. PII-adjacent fields
        # noticedByPersonId / remarks are NOT in the allow list — they
        # default-deny to "[redacted]" on the recursed walk. (The entity
        # mirror already has @AuditRedact on the same fields, which gates
        # the entity-path too.)
        allow:
          - id
          - aircraftStateId
          - validFrom
          - validTo
      AircraftOperatingCounter:
        allow:
          - id
          - aircraft
          - atDateTime
          - totalTowedGliderStarts
          - totalWinchLaunchStarts
          - totalSelfStarts
          - flightOperatingCounterInSeconds
          - engineOperatingCounterInSeconds
          - nextMaintenanceAtFlightOperatingCounterInSeconds
          - nextMaintenanceAtEngineOperatingCounterInSeconds
          - deletedOn
          - deletedByUserId
      AircraftOperatingCounterResponse:
        # Nested under AircraftDetail.latestCounter.
        allow:
          - id
          - atDateTime
          - totalTowedGliderStarts
          - totalWinchLaunchStarts
          - totalSelfStarts
          - flightOperatingCounterInSeconds
          - engineOperatingCounterInSeconds
          - nextMaintenanceAtFlightOperatingCounterInSeconds
          - nextMaintenanceAtEngineOperatingCounterInSeconds
      FlightType:
        # No PII; per-club masterdata. Allow-list lists DTO field names + entity
        # field names so both audit-paths (service-layer DTO snapshot, entity
        # mirror) round-trip cleanly.
        allow:
          - id
          - operatingClubId
          - flightTypeName
          - flightCode
          - isInstructorRequired
          - isObserverPilotOrInstructorRequired
          - isCheckFlight
          - isPassengerFlight
          - isSoloFlight
          - isForGliderFlights
          - isForTowFlights
          - isForMotorFlights
          - isFlightCostBalanceSelectable
          - isCouponNumberRequired
          - isForAircraftReservationType
          - instructorRequired
          - observerPilotOrInstructorRequired
          - checkFlight
          - passengerFlight
          - soloFlight
          - forGliderFlights
          - forTowFlights
          - forMotorFlights
          - flightCostBalanceSelectable
          - couponNumberRequired
          - forAircraftReservationType
          - minNrOfAircraftSeatsRequired
          - deletedOn
          - deletedByUserId
      FlightCostBalanceType:
        # System-global reference (no tenant), code-driven, no PII. Admin-CRUD
        # is deferred per S-053 but the allow-list lands now so a future
        # admin route lands clean.
        allow:
          - id
          - code
          - legacyIntId
          - description
          - personForInvoiceRequired
          - isPersonForInvoiceRequired
          - forGlider
          - forTow
          - forMotor
          - isForGlider
          - isForTow
          - isForMotor
      FlightCostBalanceTypeResponse:
        # DTO mirror of the FCBT entity above. Mirrors the
        # AircraftOperatingCounterResponse / InOutboundPointResponse precedent
        # of listing both entity + response DTO so the deferred admin route
        # ships into a clean audit allow-list.
        allow:
          - id
          - code
          - description
          - isPersonForInvoiceRequired
          - isForGlider
          - isForTow
          - isForMotor
      MigrationUpload:
        # S-140 — entity-path allow-list. privateKeyCiphertext is
        # @AuditRedact on the field; the application-layer emitter passes
        # a MigrationUploadAuditSnapshot snapshot, not the entity, so the
        # entity walk only happens if a future code path mistakenly hands
        # the entity to the redactor — in which case state/userId/expiresAt
        # land and the ciphertext stays "[redacted]".
        allow:
          - id
          - userId
          - state
          - publicKeyPem
          - createdAt
          - updatedAt
          - expiresAt
          - consumedAt
      MigrationUploadAuditSnapshot:
        # S-140 — snapshot record emitted on
        # MIGRATION_HANDSHAKE_ISSUED / SUPERSEDED / EXPIRED. Tiny by design;
        # privateKeyCiphertextSummary is the byte-length placeholder
        # (`<bytes:NNN>`), never the raw ciphertext.
        allow:
          - uploadId
          - state
          - expiresAt
          - privateKeyCiphertextSummary
      MigrationRun:
        # S-141 — t_migration_run entity allow-list. error_detail + warnings
        # are @AuditRedact on the field (may capture failing-row PII); the
        # application-layer audit emitter uses MigrationIngestAuditSnapshot
        # which doesn't carry either column. This entity-walk allow-list
        # exists for defense-in-depth if a future code path hands the entity
        # straight to the redactor.
        allow:
          - id
          - uploadId
          - state
          - currentEntity
          - currentClubId
          - startedAt
          - completedAt
          - deploymentId
          - errorCode
      MigrationIngestAuditSnapshot:
        # S-141 — snapshot record emitted on MIGRATION_INGEST_STARTED /
        # COMPLETED / FAILED. ids + ints + bounded enum codes only — never
        # display names, never PII from the bundle.
        allow:
          - uploadId
          - deploymentId
          - clubCount
          - errorCode
          - phase

# S-140 — Tink master keyset for migration-upload private-key wrapping.
# Env-driven. Prod MUST supply ALPENFLIGHT_MIGRATION_MASTER_KEYSET (base64
# of a Tink AES_256_GCM keyset JSON). Dev + test profiles seed a
# deterministic keyset so local bootstrap + CI tests pass without
# operator intervention.
alpenflight:
  migration:
    master-keyset:
      source: ${ALPENFLIGHT_MIGRATION_MASTER_KEYSET_SOURCE:INLINE}
      value: ${ALPENFLIGHT_MIGRATION_MASTER_KEYSET:}
    # S-141b — wall-clock cap on a single bundle ingest. Sized so a 200 MB
    # typical FLS database (~3 min ingest) has 5x headroom; a 2 GB worst
    # case (~25 min CPU) is hard-capped and the client should split the
    # bundle rather than request more. Operator may override per-VPS.
    bundle-timeout: PT15M
    ingest:
      # Global concurrency gate — single-VPS heap cap. Production stays at
      # 1; the IT profile overrides to 100 so the per-upload row-lock 409
      # path (BUNDLE_INGEST_IN_PROGRESS) is testable without the global
      # gate short-circuiting to 429.
      global-permits: 1

server:
  port: 8080
  http2:
    enabled: true
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/plain,text/css,application/javascript
    min-response-size: 1024
  error:
    include-stacktrace: never
    include-message: never
    include-exception: false
    include-binding-errors: never
  shutdown: graceful
  tomcat:
    max-http-form-post-size: 1MB
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

management:
  endpoints:
    web:
      exposure:
        include: health,info
        exclude: env,heapdump,threaddump,loggers,configprops,beans,shutdown
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized

# OpenAPI spec publication. Off by default — profiles flip it on (see
# application-dev.yml + application-test.yml). prod stays off so a stray
# SPRINGDOC_* env var cannot expose the API shape on a production install;
# OpenApiOffByDefaultIT regression-locks the prod 404.
springdoc:
  api-docs:
    enabled: false
    version: openapi_3_1   # default is openapi_3_0; codegen wants 3.1
  swagger-ui:
    enabled: false
  show-actuator: false     # keep /actuator/* out of the codegen surface
