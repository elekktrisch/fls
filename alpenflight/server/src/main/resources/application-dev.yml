spring:
  datasource:
    url: ${DATASOURCE_URL:jdbc:postgresql://localhost:5432/alpenflight}
    username: ${DATASOURCE_USER:alpenflight_app}
    password: ${DATASOURCE_PASSWORD:alpenflight_app}
  flyway:
    url: ${MIGRATOR_DB_URL:${DATASOURCE_URL:jdbc:postgresql://localhost:5432/alpenflight}}
    user: ${MIGRATOR_DB_USER:alpenflight}
    password: ${MIGRATOR_DB_PASSWORD:alpenflight}
    placeholders:
      app_role_password: ${APP_DB_PASSWORD:alpenflight_app}
      alpenflight.operator.keycloak_sub: ${ALPENFLIGHT_OPERATOR_KEYCLOAK_SUB:00000000-0000-0000-0000-0000000000ff}
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${ALPENFLIGHT_OIDC_JWK_SET_URI:http://localhost:8090/realms/alpenflight/protocol/openid-connect/certs}

demo:
  max-live-seats-per-address: ${ALPENFLIGHT_DEMO_MAX_LIVE_SEATS_PER_ADDRESS:4}
  lease-idle-period: ${ALPENFLIGHT_DEMO_LEASE_IDLE_PERIOD:PT30S}

keycloak:
  admin:
    base-url: ${ALPENFLIGHT_KC_ADMIN_BASE_URL:http://localhost:8090}

server:
  error:
    include-message: always
    include-binding-errors: always
management:
  endpoint:
    health:
      show-details: always
logging:
  level:
    root: INFO
    ch.alpenflight: DEBUG

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

alpenflight:
  mail:
    enabled: true
  migration:
    master-keyset:
      source: EPHEMERAL
