spring:
  datasource:
    # Loopback defaults so `./gradlew bootRun` works against a compose-up
    # Postgres without setting env vars. CI + prod must set the real env.
    url: ${DATASOURCE_URL:jdbc:postgresql://localhost:5432/alpenflight}
    username: ${DATASOURCE_USER:alpenflight}
    password: ${DATASOURCE_PASSWORD:alpenflight}
  flyway:
    placeholders:
      # S-137 dev sentinel — local Flyway runs use this nil-suffixed UUID so
      # the operator-Deployment seed has a valid owner-sub. Distinct from
      # the SANDBOX owner-sub (all-zeros) so the partial UNIQUE invariant
      # has visible separation in dev.
      alpenflight.operator.keycloak_sub: ${ALPENFLIGHT_OPERATOR_KEYCLOAK_SUB:00000000-0000-0000-0000-0000000000ff}
  security:
    oauth2:
      resourceserver:
        jwt:
          # `./gradlew bootRun` runs on the host, not inside compose — the
          # network-side `http://keycloak:8080` resolves only between
          # containers. Override JWKS to the host-published port; the issuer
          # URL stays at the same `localhost:8090` value tokens carry.
          jwk-set-uri: ${ALPENFLIGHT_OIDC_JWK_SET_URI:http://localhost:8090/realms/alpenflight/protocol/openid-connect/certs}

server:
  error:
    include-message: always
    include-binding-errors: always
management:
  endpoint:
    health:
      # Full health details (db, disk, mail) are useful locally but constitute
      # info disclosure on any reachable network. Contract: the dev profile
      # MUST NOT be deployed beyond loopback. Prod uses `when_authorized`.
      show-details: always
logging:
  level:
    root: INFO
    ch.alpenflight: DEBUG

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

# S-140 — dev seeds a one-shot Tink keyset at startup (logged loudly).
# Operators wanting persistence across restarts override with the env-pinned
# inline keyset per the runbook (tinkey create-keyset ... | base64).
alpenflight:
  # J-6 T-10a (ADR 0013): dev sends to the compose `mailpit` side-car (SMTP
  # 1025; inbox UI on 8025). `bootRun` runs on the host, so the published
  # loopback port from the base profile's localhost:1025 default is correct.
  mail:
    enabled: true
  migration:
    master-keyset:
      source: EPHEMERAL
