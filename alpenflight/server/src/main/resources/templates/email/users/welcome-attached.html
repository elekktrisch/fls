<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
  <head>
    <meta charset="UTF-8" />
    <title th:text="${locale == 'de'} ? 'Willkommen bei AlpenFlight' : 'Welcome to AlpenFlight'">
      Welcome to AlpenFlight
    </title>
  </head>
  <body th:switch="${locale}">
    <div th:case="'de'">
      <h2>Willkommen bei AlpenFlight!</h2>
      <p>
        Hallo <strong th:text="${friendlyName}">Mitglied</strong>,
        ein Administrator von <strong th:text="${clubName}">deinem Verein</strong>
        hat dich dem Verein hinzugefügt.
      </p>
      <p>Melde dich bei AlpenFlight an, um loszulegen.</p>
    </div>
    <div th:case="*">
      <h2>Welcome to AlpenFlight!</h2>
      <p>
        Hello <strong th:text="${friendlyName}">member</strong>,
        an admin at <strong th:text="${clubName}">your club</strong>
        has added you to the club.
      </p>
      <p>Sign in to AlpenFlight to get started.</p>
    </div>
  </body>
</html>
