<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="de">
  <head>
    <meta charset="UTF-8" />
    <title>Beitrittsanfrage abgelehnt</title>
  </head>
  <body>
    <h2>Beitrittsanfrage abgelehnt</h2>
    <p>
      Hallo <strong th:text="${pilotName}">Pilotin / Pilot</strong>,
      deine Beitrittsanfrage wurde leider abgelehnt.
    </p>
    <p th:if="${decisionReason != null and !decisionReason.isBlank()}">
      Begründung: <em th:text="${decisionReason}">Begründung</em>
    </p>
    <p>Du kannst es mit einem anderen Beitrittscode erneut versuchen.</p>
  </body>
</html>
