<!DOCTYPE html>

  <head>
    <meta charset="UTF-8" />
    <title>Neue Beitrittsanfrage</title>
  </head>
  <body>
    <h2>Neue Beitrittsanfrage</h2>

      <strong th:text="${pilotName}">Pilotin / Pilot</strong>
      (<span th:text="${pilotEmail}">pilot@example.com</span>)

  </body>
</html>
