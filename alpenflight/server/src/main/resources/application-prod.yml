spring:
  main:
    banner-mode: off
  application:
    name: alpenflight-server

# Defense-in-depth re-pin: base application.yml already disables both
# springdoc endpoints, but ops-readers should see the off-state in the prod
# config without inheriting through. To enable on a prod-like environment
# (debugging only, never customer-facing), set SPRINGDOC_API_DOCS_ENABLED=true
# AND fence /v3/api-docs + /swagger-ui/** behind an IP allowlist + bearer auth.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# J-6 T-10a (ADR 0013): production email stays DISABLED until the relay-choice
# follow-up ships (self-hosted Postal vs. Postmark/Resend/Brevo — deferred to
# deployment readiness). The base profile already defaults `alpenflight.mail.enabled`
# to false; this re-pin makes the prod off-state explicit for ops-readers and
# documents the env contract. To enable on a real install: set
# ALPENFLIGHT_MAIL_ENABLED=true plus ALPENFLIGHT_MAIL_HOST / _PORT / _USERNAME /
# _PASSWORD / _SMTP_AUTH / _SMTP_STARTTLS for the chosen relay. No relay is
# hardcoded here (no-secret-in-repo).
alpenflight:
  mail:
    enabled: ${ALPENFLIGHT_MAIL_ENABLED:false}
