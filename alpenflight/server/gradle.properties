# Test-wallclock mitigations (S-051 follow-up; see story `## Pickup notes`).
#
# `maxParallelForks = 2` on the `test` task is already configured in
# build.gradle.kts:288. These three project-level toggles add Gradle's
# task-graph + build-cache + configuration-cache layers on top:
#
#   - parallel=true        — runs independent tasks in parallel (project is
#                            single-module today, so the win lands on
#                            compile + processTestResources + test running
#                            alongside other targets when `check` is invoked).
#   - caching=true         — local + remote build cache (Spring Boot already
#                            ships JAR-task cacheable; ArchUnit + tests are
#                            classpath-derived so the cache hits on no-source
#                            re-runs).
#   - configuration-cache  — skips Gradle re-configuration on no-build-script
#                            change. Disabled today: Spring Boot 4 + Flyway
#                            plugins may not be fully configuration-cache
#                            compatible; flip on once they are (test:
#                            `./gradlew check --configuration-cache`).
org.gradle.parallel=true
org.gradle.caching=true
# org.gradle.configuration-cache=true
