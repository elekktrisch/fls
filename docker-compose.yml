# FLS / AlpenFlight dev-stack compose file
# ----------------------------------------------------------------------------
# Three compose projects share this one file:
#
#   - fls-e2e            (default profile)  → legacy DB (mssql).
#       Managed by e2e/scripts/dev-up.sh / dev-down.sh.
#   - alpenflight-infra  (profile=infra)    → Mailpit (shared mail sink).
#       Managed by alpenflight/ops/dev-up-infra.sh.
#   - alpenflight-dev    (profile=next)     → Postgres + pgAdmin + Keycloak.
#       Managed by alpenflight/ops/dev-up-alpenflight.sh.
#
# All three projects attach their services to the external network
# `alpenflight_shared`, so cross-project DNS works (e.g. Keycloak's
# `KEYCLOAK_SMTP_HOST=mailpit` resolves to the Mailpit container even
# though Mailpit lives in a different compose project).
#
# `external: true` means no compose project owns the network's lifecycle.
# Each dev-up-*.sh creates it idempotently (`docker network inspect ...
# || docker network create ...`). Operators remove it manually with
# `docker network rm alpenflight_shared` when retiring the dev stack.
#
# What is intentionally NOT in here:
#
#   - The FLS Web API (Mono + .NET 4.5 + OWIN self-host, console exe)
#   - The flsweb webpack-dev-server (Node 8 + webpack 1 + babel ES2015)
#
# Both are awkward to containerize cleanly: the server needs Mono 6.12
# plus a hand-built FLS.Server.Console.exe and a copy of
# EntityFramework.SqlServer.dll dropped next to it; the client needs
# Node 8 via nvm and a couple of case-sensitivity sed fixes against
# the legacy webpack-1 bundle. Until someone invests in proper images
# for them, dev-up.sh starts the legacy database via this file and
# TESTING.md (Milestones 2-3 and 5) covers building / running the
# two app processes locally.
#
# Bring up:
#
#   bash alpenflight/ops/dev-up-full.sh                   # everything
#   bash alpenflight/ops/dev-up-infra.sh                  # mailpit only
#   bash alpenflight/ops/dev-up-alpenflight.sh            # new stack only
#   bash e2e/scripts/dev-up.sh                            # legacy db only
#
# Tear-down order: alpenflight-dev → fls-e2e → alpenflight-infra.
# Reverse order leaves orphan containers attached to a removed network.
#
#   docker compose -p alpenflight-dev down [-v]
#   docker compose -p fls-e2e down [-v]                   # (e2e/scripts/dev-down.sh)
#   docker compose -p alpenflight-infra down [-v]
#   docker network rm alpenflight_shared                  # only when retiring entirely
# ----------------------------------------------------------------------------

# All ports bound to 127.0.0.1 so the dev stack is reachable only from the
# host machine, not from the LAN. Credentials here are weak-by-design ("dev"
# / "alpenflight/alpenflight" / "Demo#FLS#2026") for operator convenience — restricting the
# bind ensures a laptop on an untrusted network doesn't expose the DBs to
# a one-word-guess attack.

# Cross-project shared network. `external: true` means no compose project
# owns its lifecycle — every dev-up-*.sh creates it idempotently. Services
# in different compose projects (fls-e2e, alpenflight-infra, alpenflight-dev)
# all attach here so Keycloak in -p alpenflight-dev can resolve `mailpit`
# in -p alpenflight-infra by service DNS.
networks:
  alpenflight_shared:
    external: true

services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Demo#FLS#2026"
      MSSQL_PID: Developer
    ports:
      - "127.0.0.1:1433:1433"
    networks: [alpenflight_shared]
    healthcheck:
      test:
        - "CMD-SHELL"
        - "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Demo#FLS#2026' -C -Q 'SELECT 1' || exit 1"
      interval: 5s
      timeout: 5s
      retries: 30

  # ---------------------------------------------------------------------------
  # alpenflight-infra — Mailpit as a shared mail sink. Profile-gated so the
  # default `docker compose up` (under -p fls-e2e) does NOT bring Mailpit up
  # alongside mssql — that was the historical default and silently created
  # the cross-project DNS contract that S-172 makes explicit.
  #
  # Always brought up under its own project name:
  #
  #   docker compose -p alpenflight-infra --profile infra up -d --wait
  #
  # `--profile infra` MUST only be activated under `-p alpenflight-infra` —
  # using it under another project (e.g. `-p alpenflight-dev --profile infra`)
  # would pull Mailpit into that project and double-bind host ports
  # 1025 / 8025. See alpenflight/ops/README.md § Profile matrix.
  # ---------------------------------------------------------------------------
  mailpit:
    profiles: ["infra"]
    image: axllent/mailpit:v1.21
    ports:
      - "127.0.0.1:1025:1025"   # SMTP listener (FLS server + AlpenFlight backend -> here)
      - "127.0.0.1:8025:8025"   # HTTP API + Web UI (tests + dev inbox inspection -> here)
    environment:
      MP_MAX_MESSAGES: "5000"
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    networks: [alpenflight_shared]
    healthcheck:
      test:
        - "CMD"
        - "wget"
        - "-q"
        - "--spider"
        - "http://localhost:8025/api/v1/info"
      interval: 5s
      timeout: 3s
      retries: 10

  # ---------------------------------------------------------------------------
  # alpenflight-dev — target stack (Postgres + pgAdmin + Keycloak). Profile-gated
  # so the default `docker compose up` (under -p fls-e2e) only starts mssql.
  #
  # Bring up under its OWN compose project name so the three projects
  # (fls-e2e, alpenflight-infra, alpenflight-dev) teardown independently.
  # Name services explicitly rather than passing `--profile next` alone —
  # the latter would also pull mssql (default profile) into alpenflight-dev
  # and double-bind 1433.
  #
  #   docker compose -p alpenflight-dev up -d postgres pgadmin keycloak
  #
  # alpenflight/ops/dev-up-alpenflight.sh wraps the bring-up + Flyway migrate
  # in one command. pgAdmin loads alpenflight/ops/pgadmin/servers.json so the
  # target connection appears pre-wired on first login. Operator manual +
  # footguns live in alpenflight/ops/README.md. Mailpit lives in the separate
  # `alpenflight-infra` project; Keycloak reaches it via the `alpenflight_shared`
  # network (KEYCLOAK_SMTP_HOST=mailpit → service DNS to the Mailpit container).
  # ---------------------------------------------------------------------------

  postgres:
    profiles: ["next"]
    image: postgres:17.4-alpine
    environment:
      POSTGRES_DB: alpenflight
      POSTGRES_USER: alpenflight
      POSTGRES_PASSWORD: alpenflight
    ports:
      - "127.0.0.1:5432:5432"
    networks: [alpenflight_shared]
    # No volume — data is ephemeral. `docker compose down` wipes it; the
    # dev-up-full.sh script re-applies Flyway migrations after restart, so
    # the baseline state is reproducible without persistence. Add a named
    # volume here if you want survival across `down`.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alpenflight -d alpenflight"]
      interval: 3s
      timeout: 3s
      retries: 20

  # --- DEV ONLY -------------------------------------------------------------
  # The pgadmin service ships placeholder credentials (dev@example.com / dev)
  # for unattended first-login on a developer laptop. Never copy this block
  # into a staging / production compose — the credentials are weak by design.
  # Production pgAdmin (if ever) must run behind an IdP-fronted reverse proxy
  # with no embedded defaults.
  # --------------------------------------------------------------------------
  pgadmin:
    profiles: ["next"]
    # Custom image baked with alpenflight/ops/pgadmin/servers.json so the FLS Target
    # connection appears pre-wired on first login. Bind-mounting servers.json
    # is unreliable on Docker Desktop without file-sharing for the repo path;
    # baking it in is the portable route.
    build:
      context: ./alpenflight/ops/pgadmin
      dockerfile: Dockerfile
    image: alpenflight-pgadmin:local
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # `.local` is rejected by pgadmin's email validator (reserved TLD).
      # Use example.com for the placeholder dev login.
      PGADMIN_DEFAULT_EMAIL: dev@example.com
      PGADMIN_DEFAULT_PASSWORD: dev
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      PGADMIN_SERVER_JSON_FILE: /pgadmin4/servers.json
    ports:
      - "127.0.0.1:5050:80"
    networks: [alpenflight_shared]
    healthcheck:
      # pgAdmin's /misc/ping endpoint replies "PING" once the WSGI app is up.
      # gunicorn boot takes ~7s; pad start_period to 30s so the first probe
      # never lands before the listener is open.
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80/misc/ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Keycloak — OIDC IdP for the AlpenFlight stack. Runs in dev mode (H2,
  # bootstrap admin) with no realm imported yet — S-019 lands `alpenflight/auth/
  # realm-export.json` and amends this block to add `--import-realm` plus the
  # bind-mount. Until then, the AlpenFlight realm is created by hand via the
  # admin console (http://localhost:8090, admin / admin).
  #
  # Host port 8090 (NOT 8080) — the AlpenFlight server runs on 8080 by default,
  # so Keycloak's HTTP listener is exposed on 8090 to avoid collision. The
  # container still listens on 8080 internally, so backend code reaching
  # Keycloak via the compose network DNS (`http://keycloak:8080`) is
  # unaffected.
  #
  # KC_HOSTNAME_URL pins the issuer Keycloak emits in tokens to
  # http://localhost:8090 so the iss claim matches what the SPA + backend
  # both observe from the host.
  # ---------------------------------------------------------------------------
  keycloak:
    profiles: ["next"]
    # Custom image bakes alpenflight/auth/realm-export.json into the image rather
    # than bind-mounting it. Bind-mount works in principle but is unreliable
    # under Docker Desktop file-sharing on Windows hosts; baking mirrors the
    # same pattern alpenflight/ops/pgadmin/ already uses.
    build:
      context: ./alpenflight/auth
      dockerfile: Dockerfile
      args:
        # Substituted into realm-export.json at image build (Keycloak's
        # realm-import `${VAR}` substitution does NOT cover client.baseUrl
        # — URL validator runs before substitution). `:-` default keeps
        # fresh clones building. Rotation requires `rebuild-keycloak.sh`
        # (image rebuild + H2 wipe — same constraint as KEYCLOAK_GOOGLE_*).
        ALPENFLIGHT_WEB_BASE_URL: "${ALPENFLIGHT_WEB_BASE_URL:-http://localhost:4200/}"
    image: alpenflight-keycloak:local
    # --import-realm runs on every boot. Keycloak's default IGNORE_EXISTING
    # strategy preserves H2-resident edits; new entities from the JSON are
    # still added. To replay the committed realm cleanly:
    #   docker compose -p alpenflight-dev down -v keycloak && \
    #   docker compose -p alpenflight-dev build keycloak && \
    #   docker compose -p alpenflight-dev up -d keycloak
    command: ["start-dev", "--http-port=8080", "--import-realm"]
    # Defaults + per-laptop overrides for the realm-export `${VAR}`
    # substitutions (KEYCLOAK_GOOGLE_*, KEYCLOAK_SMTP_*) — see
    # alpenflight/auth/README.md § Substitution layers for the full story
    # on why the syntax is bare `${VAR}` and not `${env:VAR}`.
    #
    # Layering: `.env.example` is committed and provides sentinel defaults
    # (Google client_id falls back to "set-via-env-for-google-signup",
    # SMTP points at the compose `mailpit` service). `.env` is gitignored
    # and loaded second — operators override the lines they care about.
    # Docker compose 2.24+ env_file typed form: `required: false` keeps a
    # fresh clone booting before the operator copies the example.
    #
    # IMPORTANT: env-var defaults MUST live in `.env.example`, NOT in the
    # `environment:` block below — compose's `environment:` always
    # overrides `env_file`, so `${VAR:-default}` here would silently
    # clobber whatever the operator set in `.env`.
    env_file:
      - path: alpenflight/auth/.env.example
        required: true
      - path: alpenflight/auth/.env
        required: false
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: localhost
      KC_HOSTNAME_URL: http://localhost:8090
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_LOG_LEVEL: INFO
      # ALPENFLIGHT_WEB_BASE_URL is consumed at IMAGE BUILD time (see
      # build.args above), not as a container env var — Keycloak's
      # realm-import substitution doesn't reach client.baseUrl (URL
      # validator runs before substitution). Rotation workflow:
      # `rebuild-keycloak.sh` rebuilds the image with the new value baked
      # into realm-export.json. Documented in alpenflight/auth/README.md
      # § "Substitution layers".
    ports:
      - "127.0.0.1:8090:8080"
      - "127.0.0.1:9090:9000"   # management interface (/health/ready)
    networks: [alpenflight_shared]
    healthcheck:
      # Keycloak 25+ exposes /health/ready on the management port (9000) when
      # KC_HEALTH_ENABLED=true. The image ships no curl/wget, so probe via the
      # bundled Java HttpClient one-liner instead.
      test:
        - "CMD-SHELL"
        - "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '\"status\": \"UP\"' <&3"
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 30s
