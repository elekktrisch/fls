# Legacy end-to-end test infrastructure.
#
# Serves the Playwright suite under e2e/, which drives the legacy AngularJS SPA
# (flsweb) against the legacy Web API (flsserver). Start it with:
#   bash e2e/scripts/dev-up.sh
#
# The rewrite's own stack is not defined here. Attempt 1's services (postgres,
# pgadmin, keycloak) are archived in docs/attempt-1/. The new architecture
# decides its own stack.

networks:
  fls_e2e:
    driver: bridge

services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Demo#FLS#2026"
      MSSQL_PID: Developer
    ports:
      - "127.0.0.1:1433:1433"
    networks: [fls_e2e]
    healthcheck:
      test:
        - "CMD-SHELL"
        - "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Demo#FLS#2026' -C -Q 'SELECT 1' || exit 1"
      interval: 5s
      timeout: 5s
      retries: 30

  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    environment:
      MP_MAX_MESSAGES: "5000"
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    networks: [fls_e2e]
    healthcheck:
      test:
        - "CMD"
        - "wget"
        - "-q"
        - "--spider"
        - "http://localhost:8025/api/v1/info"
      interval: 5s
      timeout: 3s
      retries: 10
