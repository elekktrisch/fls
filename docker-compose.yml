

networks:
  alpenflight_shared:
    external: true

services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Demo#FLS#2026"
      MSSQL_PID: Developer
    ports:
      - "127.0.0.1:1433:1433"
    networks: [alpenflight_shared]
    healthcheck:
      test:
        - "CMD-SHELL"
        - "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Demo#FLS#2026' -C -Q 'SELECT 1' || exit 1"
      interval: 5s
      timeout: 5s
      retries: 30

  mailpit:
    profiles: ["infra"]
    image: axllent/mailpit:v1.21
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    environment:
      MP_MAX_MESSAGES: "5000"
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    networks: [alpenflight_shared]
    healthcheck:
      test:
        - "CMD"
        - "wget"
        - "-q"
        - "--spider"
        - "http://localhost:8025/api/v1/info"
      interval: 5s
      timeout: 3s
      retries: 10


  postgres:
    profiles: ["next"]
    image: postgres:17.4-alpine
    environment:
      POSTGRES_DB: alpenflight
      POSTGRES_USER: alpenflight
      POSTGRES_PASSWORD: alpenflight
    ports:
      - "127.0.0.1:5432:5432"
    networks: [alpenflight_shared]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alpenflight -d alpenflight"]
      interval: 3s
      timeout: 3s
      retries: 20

  pgadmin:
    profiles: ["next"]
    build:
      context: ./alpenflight/ops/pgadmin
      dockerfile: Dockerfile
    image: alpenflight-pgadmin:local
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: dev@example.com
      PGADMIN_DEFAULT_PASSWORD: dev
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      PGADMIN_SERVER_JSON_FILE: /pgadmin4/servers.json
    ports:
      - "127.0.0.1:5050:80"
    networks: [alpenflight_shared]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80/misc/ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 30s

  keycloak:
    profiles: ["next"]
    build:
      context: ./alpenflight/auth
      dockerfile: Dockerfile
      args:
        ALPENFLIGHT_WEB_BASE_URL: "${ALPENFLIGHT_WEB_BASE_URL:-http://localhost:4200/}"
    image: alpenflight-keycloak:local
    command: ["start-dev", "--http-port=8080", "--import-realm"]
    env_file:
      - path: alpenflight/auth/.env.example
        required: true
      - path: alpenflight/auth/.env
        required: false
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: localhost
      KC_HOSTNAME_URL: http://localhost:8090
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_LOG_LEVEL: INFO
    ports:
      - "127.0.0.1:8090:8080"
      - "127.0.0.1:9090:9000"
    networks: [alpenflight_shared]
    healthcheck:
      test:
        - "CMD-SHELL"
        - "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '\"status\": \"UP\"' <&3"
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 30s
