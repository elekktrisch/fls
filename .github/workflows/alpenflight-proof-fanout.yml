# (The fan-out harness was BUILT in J-0c; runs serve whatever journey the
# dispatched branch carries — the run-name shows the branch so the Actions
# list stops claiming every run is J-0c.)
name: alpenflight proof fan-out
run-name: fan-out proof — ${{ github.ref_name }}

# J-0c T-05 — the FULL legacy→migrate+Keycloak→AlpenFlight fan-out parity chain,
# end to end, on ONE runner. This is the dedicated proof workflow the journey
# carve asked for: the heavy legacy stack (Mono `flsserver` + Node8 `flsweb` +
# MSSQL) only runs in nightly today and blows the per-PR ~8-min budget, so the
# full chain is manual-dispatch + nightly tier and is NOT wired into ci.yml's
# `required` aggregator. J-0c's per-PR code gate (the CLUB-pgcopy fix T-01 +
# the Keycloak-provision slice T-02) stays unit/IT-level inside ci.yml; this
# workflow is the human-parity proof, publishing per-club AlpenFlight videos +
# the legacy create video to the gh-pages gallery.
#
# The chain on this runner (no port collisions: MSSQL 1433, legacy API 25567,
# flsweb 3000, Postgres 5432, Keycloak 8090, AlpenFlight backend 8080, AlpenFlight
# SPA 4201):
#   1. legacy stack up (MSSQL + seed FLSTest + Mono flsserver + flsweb webpack)
#   2. T-04 legacy spec: create a RANDOM-named Location referenced by 2 clubs
#      (the fan-out trigger) in the flsweb UI — records the legacy parity video.
#   3. AlpenFlight stack up (Postgres + Keycloak + Mailpit + backend + ng serve).
#   4. mint the migration handshake (SPA-driven; no direct-access grant) → file.
#   5. `alpenflight-export` reads the legacy MSSQL READ-ONLY → ALPF-encrypted
#      bundle sealed to that handshake.
#   6. T-03 parity spec in REAL-bundle mode (J0C_BUNDLE_SOURCE=real): POST the
#      real bundle to /api/v1/migrations/{id}/bundle → fan-out + Keycloak
#      provision (T-02) → club-A/club-B login, per-club view, edit-isolation,
#      cross-tenant 404 — records per-club AlpenFlight videos.
#   7. build + link-check the proof gallery; retain ALL videos; deploy on main.
#
# First-green caveat (J-0 / J-0b pattern): neither stack runs on the authoring
# box. This workflow is authored + structurally validated (YAML parses, job
# ordering + paths resolve, the spec/fixture typecheck + discover). Its FIRST
# LIVE green is this workflow's own first CI run.

on:
  schedule:
    # 05:00 UTC — after nightly.yml (04:00) and alpenflight-e2e-real-idp (03:00)
    # so a shared-runner-minute spike doesn't stack on the same instant.
    - cron: '0 5 * * *'
  workflow_dispatch:

concurrency:
  group: alpenflight-proof-fanout-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ===========================================================================
  # Legacy build jobs — inlined from nightly.yml (a workflow cannot `needs:` a
  # job defined in another workflow file). Kept byte-aligned with nightly.yml's
  # `legacy-server-build` / `legacy-web-build` so a fix there is mirrorable here.
  # ===========================================================================
  legacy-server-build:
    name: legacy server build
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Mono 6.12
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mono-complete

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: flsserver/src/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('flsserver/src/**/packages.config') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Install NuGet CLI
        run: sudo curl -sSL -o /usr/local/bin/nuget.exe https://dist.nuget.org/win-x86-commandline/latest/nuget.exe

      - name: Restore packages
        working-directory: flsserver/src
        run: |
          # Restore the whole solution: projects reference packages declared in
          # OTHER projects' packages.config (e.g. Console uses Microsoft.Owin.Hosting,
          # declared in FLS.Server.Tests), so a per-csproj restore misses them on a
          # cold cache (integration-branch dispatch) — only a warm cache hid it.
          mono /usr/local/bin/nuget.exe restore FLS.sln

      - name: xbuild projects (Debug)
        working-directory: flsserver/src
        run: |
          for proj in \
              FLS.Common/FLS.Common.csproj \
              FLS.Server.Interfaces/FLS.Server.Interfaces.csproj \
              FLS.Data.WebApi/FLS.Data.WebApi.csproj \
              Alpinely.TownCrier/Alpinely.TownCrier.csproj \
              FLS.Server.Data/FLS.Server.Data.csproj \
              FLS.Server.Service/FLS.Server.Service.csproj \
              FLS.Server.Web/FLS.Server.WebApi.csproj \
              FLS.Server.Console/FLS.Server.Console.csproj ; do
            xbuild "$proj" /p:Configuration=Debug
          done

      - name: Drop EF SqlServer DLL into bin
        working-directory: flsserver/src
        run: |
          cp packages/EntityFramework.6.2.0/lib/net45/EntityFramework.SqlServer.dll \
             FLS.Server.Console/bin/Debug/

      - name: Upload FLS.Server.Console bin artifact
        uses: actions/upload-artifact@v4
        with:
          name: flsserver-console-bin
          path: flsserver/src/FLS.Server.Console/bin/Debug
          retention-days: 1
          if-no-files-found: error

  legacy-web-build:
    name: legacy web build
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: 8 }

      - name: Cache flsweb node_modules
        id: flsweb-cache
        uses: actions/cache@v4
        with:
          path: flsweb-node_modules
          key: flsweb-node-modules-${{ runner.os }}-${{ hashFiles('flsweb/yarn.lock', 'flsweb/package.json') }}
          restore-keys: |
            flsweb-node-modules-${{ runner.os }}-

      - name: yarn install (if cache miss)
        if: steps.flsweb-cache.outputs.cache-hit != 'true'
        env:
          # phantomjs (transitive via highcharts@0.0.11) fails a cold yarn install:
          # its install.js path.joins process.env.npm_config_tmp (undefined) before
          # the valid fallback → "Path must be a string", and its default binary CDN
          # is dead. The webpack build never runs phantomjs; give it a temp dir + a
          # live mirror so the postinstall succeeds.
          npm_config_tmp: /tmp
          PHANTOMJS_CDNURL: https://github.com/Medium/phantomjs/releases/download/v1.9.19
        run: |
          rm -rf /tmp/flsweb-build
          cp -r flsweb /tmp/flsweb-build
          sed -i "s|'./TryflightController'|'./TryFlightController'|" /tmp/flsweb-build/src/tryflight/TryFlightModule.js
          sed -i "s|'./PassengerflightController'|'./PassengerFlightController'|" /tmp/flsweb-build/src/passengerflight/PassengerFlightModule.js
          sudo npm install --global yarn@1 -s
          cd /tmp/flsweb-build
          yarn install --network-timeout 600000
          cp -r /tmp/flsweb-build/node_modules ${GITHUB_WORKSPACE}/flsweb-node_modules

  # ===========================================================================
  # fanout-proof — the full chain on one runner.
  # ===========================================================================
  fanout-proof:
    name: fan-out parity (legacy → migrate+Keycloak → AlpenFlight)
    needs: [legacy-server-build, legacy-web-build]
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    permissions:
      # gh-pages publish of the branch-preview proof bookmark.
      contents: write
      pull-requests: write
    env:
      # Legacy stack
      FLS_LISTEN_URL: "http://*:25567/"
      FLS_MSSQL_SA_PASSWORD: "Demo#FLS#2026"
      # AlpenFlight real-idp SPA + the parity spec's real-bundle switch
      E2E_REAL_IDP: '1'
      # The single random Location name shared across the whole chain: created
      # in legacy (T-04 reads J0C_LOCATION_NAME), then asserted in AlpenFlight
      # (forwarded below as J0C_REAL_LOCATION_NAME). The actual value is stamped
      # at runtime into $GITHUB_ENV by the "Pin the random Location name" step.
    steps:
      - uses: actions/checkout@v4

      # --- shared random name (freshness guarantee) ---------------------------
      - name: Pin the random Location name (chain-wide)
        run: |
          RAND="$(tr -dc 'A-Z0-9' </dev/urandom | head -c 6)"
          echo "J0C_LOCATION_NAME=J0C-${RAND}" >> "$GITHUB_ENV"
          echo "Pinned chain Location name: J0C-${RAND}"

      # ========================================================================
      # 1. LEGACY STACK — MSSQL + seed + Mono flsserver + flsweb webpack.
      #    (reuses nightly.yml's bring-up shape + e2e/scripts/seed.sh)
      # ========================================================================
      - name: Install Mono 6.12 (background)
        run: |
          (sudo apt-get update -qq && sudo apt-get install -y -qq mono-complete && touch /tmp/.done-mono) > /tmp/mono.log 2>&1 &
          echo "mono install PID=$!"

      # The mssql service (and later the AlpenFlight-half services) attaches to
      # the `alpenflight_shared` network, declared `external: true` in
      # docker-compose.yml. An external network must already exist or the
      # compose `up` fails — and the MSSQL `up` below is backgrounded, so a
      # failure here would silently leave MSSQL down and the healthcheck wait
      # would spin to the job timeout. Create it idempotently BEFORE any
      # compose `up` (J-0c T-08).
      - name: Create alpenflight_shared network
        run: docker network inspect alpenflight_shared >/dev/null 2>&1 || docker network create alpenflight_shared --driver bridge

      # Backgrounded MSSQL bring-up pulls mcr.microsoft.com/mssql/server. The
      # bounded 3-attempt/15s-backoff retry lives INSIDE the subshell so
      # /tmp/.done-stack is touched only on a successful `up` (J-1 T-09); on a
      # persistent failure the marker is never written and the later "Wait for
      # MSSQL healthcheck" step times out red, which is correct.
      - name: Start MSSQL (fls-e2e compose, default profile)
        run: |
          (
            for i in 1 2 3; do
              docker compose -p fls-e2e up -d mssql && touch /tmp/.done-stack && break
              echo "MSSQL up attempt $i failed (registry blip?) — retrying in 15s" >&2
              sleep 15
            done
          ) > /tmp/stack.log 2>&1 &
          echo "compose up PID=$!"

      - name: Download FLS.Server.Console bin
        uses: actions/download-artifact@v4
        with:
          name: flsserver-console-bin
          path: flsserver/src/FLS.Server.Console/bin/Debug

      - name: Restore flsweb node_modules cache
        uses: actions/cache@v4
        with:
          path: flsweb-node_modules
          key: flsweb-node-modules-${{ runner.os }}-${{ hashFiles('flsweb/yarn.lock', 'flsweb/package.json') }}
          restore-keys: |
            flsweb-node-modules-${{ runner.os }}-

      - uses: actions/setup-node@v4
        with: { node-version: 8 }

      - name: Prepare flsweb tree
        run: |
          rm -rf /tmp/flsweb-build
          cp -r flsweb /tmp/flsweb-build
          sed -i "s|'./TryflightController'|'./TryFlightController'|" /tmp/flsweb-build/src/tryflight/TryFlightModule.js
          sed -i "s|'./PassengerflightController'|'./PassengerFlightController'|" /tmp/flsweb-build/src/passengerflight/PassengerFlightModule.js
          if [ ! -d flsweb-node_modules ]; then
            echo "flsweb-node_modules cache restore failed — legacy-web-build did not populate it"
            exit 1
          fi
          mv flsweb-node_modules /tmp/flsweb-build/node_modules

      - name: Wait for Mono install
        run: |
          while [ ! -f /tmp/.done-mono ]; do sleep 2; done
          tail -3 /tmp/mono.log

      - name: Wait for MSSQL healthcheck
        run: |
          while [ ! -f /tmp/.done-stack ]; do sleep 1; done
          for i in $(seq 1 60); do
            healthy=$(docker compose -p fls-e2e ps --format json | grep -c '"Health":"healthy"' || true)
            if [ "$healthy" -ge 1 ]; then break; fi
            sleep 2
          done
          docker compose -p fls-e2e ps

      - name: Apply FLSTest schema and seed
        env:
          FLS_MSSQL_CONTAINER: fls-e2e-mssql-1
        run: bash e2e/scripts/seed.sh

      - name: Start FLS.Server.Console (legacy API)
        working-directory: flsserver/src/FLS.Server.Console/bin/Debug
        run: |
          setsid nohup mono FLS.Server.Console.exe > /tmp/fls-server.log 2>&1 < /dev/null &
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:25567/api/v1/countries || true)
            if [ "$code" = "200" ]; then echo "legacy API ready"; break; fi
            sleep 2
          done

      - name: Start flsweb webpack-dev-server (legacy SPA)
        working-directory: /tmp/flsweb-build
        run: |
          setsid nohup ./node_modules/.bin/webpack-dev-server --TARGET=DEV --SERVER_URL=http://localhost:25567/ > /tmp/flsweb.log 2>&1 < /dev/null &
          for i in $(seq 1 90); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/ || true)
            if [ "$code" = "200" ]; then echo "flsweb dev server ready"; break; fi
            sleep 2
          done

      # Node 20 + the legacy e2e Playwright suite (top-level e2e/) for T-04.
      - name: Set up Node 20 for legacy Playwright
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: e2e/package-lock.json

      - name: Cache Playwright browsers (legacy e2e)
        id: pw-legacy-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('e2e/package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install legacy Playwright deps
        working-directory: e2e
        run: |
          npm ci
          if [ "${{ steps.pw-legacy-cache.outputs.cache-hit }}" = 'true' ]; then
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi

      # ========================================================================
      # 2. T-04 — legacy create-flow spec. Creates the chain's random-named
      #    Location referenced by 2 clubs in the flsweb UI; records the legacy
      #    parity video. J0C_LOCATION_NAME (pinned above) makes the legacy name
      #    match what the AlpenFlight parity spec later asserts.
      # ========================================================================
      - name: Run T-04 legacy create-flow spec (records legacy video)
        id: legacy-pw
        working-directory: e2e
        timeout-minutes: 10
        run: |
          npx playwright test \
            --project=masterdata \
            tests/masterdata/locations-fanout-J0c.spec.ts

      # ========================================================================
      # 2b. J-1 T-14 — legacy AIRCRAFT parity spec. Read-only walkthrough of the
      #     seeded aircraft list + one aircraft's form in the flsweb UI; records
      #     the legacy aircraft parity video. The SAME legacy stack (already up)
      #     and the SAME deterministic FLSTest seed (~15 aircraft) the Location
      #     spec used — no extra seeding, runs on this one nightly run alongside
      #     T-04. Paired side-by-side with J-1's AlpenFlight aircraft videos
      #     (proof-journey: J-1) in the gallery via the legacy-video sidecar
      #     (step 7b). Non-blocking parity aid; AlpenFlight green is the gate.
      # ========================================================================
      - name: Run J-1 T-14 legacy aircraft parity spec (records legacy video)
        id: legacy-pw-aircraft
        # NON-BLOCKING parity aid (same contract as the J-2 step below): `if:
        # always()` to run after a prior failure AND `continue-on-error: true` so
        # its own failure neither fails the job nor skips the unguarded downstream
        # gate steps. Without continue-on-error, a red here would cascade-skip the
        # real export + AlpenFlight parity specs exactly as the J-2 step did in
        # run 26923775939.
        if: always()
        continue-on-error: true
        working-directory: e2e
        timeout-minutes: 10
        run: |
          npx playwright test \
            --project=masterdata \
            tests/masterdata/aircrafts-parity-J1.spec.ts

      # ========================================================================
      # 2c. J-2 T-10 — legacy FLIGHT parity spec. Read-only walkthrough of the
      #     T-08-seeded flight list (glider + paired tow) + one flight's edit
      #     form (glider+tow field set) + the /airmovements motor list, in the
      #     flsweb UI; records the legacy flight parity video. The SAME legacy
      #     stack (already up) and the SAME deterministic FLSTest seed the J-0c
      #     Location + J-1 aircraft specs used — T-08 added the test flights to
      #     "6 Insert Test Flights.sql", which `e2e/scripts/seed.sh` applies — so
      #     no extra seeding; runs on this one nightly run alongside T-04 + T-14.
      #     Paired side-by-side with J-2's AlpenFlight flight videos (proof-
      #     journey: J-2) in the gallery via the legacy-video sidecar (step 7b).
      #     Non-blocking parity aid; AlpenFlight green is the gate.
      # ========================================================================
      - name: Run J-2 T-10 legacy flight parity spec (records legacy video)
        id: legacy-pw-flight
        # NON-BLOCKING parity aid (operator: AlpenFlight green is the gate). Both
        # `if: always()` (so it runs even if a prior step failed) AND
        # `continue-on-error: true` (so its OWN failure does NOT fail the job and
        # does NOT skip the unguarded downstream gate steps — the real
        # alpenflight-export producer-SELECT validation + the AlpenFlight parity
        # specs + the gallery deploy). Run 26923775939: this step's selector
        # failure, with only `if: always()` and no continue-on-error, marked the
        # job failed and SKIPPED every unguarded downstream step, including the
        # whole point of the fanout for a migration journey (the real export).
        # The legacy video outcome is surfaced (non-blocking) in the final-status
        # step; only the J-0c legacy spec + the AlpenFlight parity specs gate.
        if: always()
        continue-on-error: true
        working-directory: e2e
        timeout-minutes: 10
        run: |
          npx playwright test \
            --project=flights \
            tests/flights/flights-parity-J2.spec.ts

      # ========================================================================
      # 2d. J-4 T-12 — legacy /profile parity spec. Read-only walkthrough of the
      #     legacy `#/profile` page (the LEFT user-settings + password form and
      #     the RIGHT shared <fls-person-form> accordion — Masterdata,
      #     Communication, License, Club-Settings groups) in the flsweb UI;
      #     records the legacy /profile parity video + writes the four
      #     legacy-profile-<tab>.png screenshots (one per AlpenFlight-tab
      #     equivalent: Account / Personal / Pilot / Notifications). The SAME
      #     legacy stack (already up) + the SAME deterministic FLSTest seed — the
      #     spec links testclubadmin to an existing TestClub Person (read-only
      #     UPDATE) so the person form renders, then displays the field set; no
      #     mutation, no submit (the legacy password form is the dropped-by-design
      #     affordance, Keycloak owns credentials, ADR 0007). Paired side-by-side
      #     with the AlpenFlight /profile showcase shots (step 6b) on the proof
      #     bookmark. J-4 carries NO data migration, so the
      #     export→migrate half of the fanout does NOT run for it — only this
      #     legacy-video harness step, exactly like J-0c/J-1/J-2 capture theirs.
      #     Non-blocking parity aid; AlpenFlight green is the gate.
      # ========================================================================
      - name: Run J-4 T-12 legacy /profile parity spec (records legacy video)
        id: legacy-pw-profile
        # NON-BLOCKING parity aid (operator: AlpenFlight green is the gate). Same
        # contract as the J-1/J-2 steps above: `if: always()` (runs even after a
        # prior failure) AND `continue-on-error: true` (its own failure neither
        # fails the job nor cascade-skips the unguarded downstream gate steps).
        if: always()
        continue-on-error: true
        working-directory: e2e
        timeout-minutes: 10
        run: |
          npx playwright test \
            --project=profile \
            tests/profile/profile-parity-J4.spec.ts

      # ========================================================================
      # 2e. J-5 T-16 — legacy RESERVATION parity spec. Read-only walkthrough of
      #     the seeded reservation list + one reservation's edit form (+ the
      #     reservation-scheduler grid, best-effort) in the flsweb UI; records the
      #     legacy reservation parity video + writes the legacy-reservation-
      #     {list,form,scheduler}.png screenshots. The SAME legacy stack (already
      #     up) + the SAME deterministic FLSTest seed the J-0c/J-1/J-2 specs used —
      #     J-5 T-07 added the reservation type + cross-tenant aircraft + an
      #     existing reservation to `_test-fixture.sql`, so the list is populated;
      #     no extra seeding, runs on this one fanout run alongside T-04 + the
      #     others. Paired side-by-side with J-5's AlpenFlight reservation videos
      #     (proof-journey: J-5) in the gallery via the legacy-video sidecar (step
      #     7b). Non-blocking parity aid; AlpenFlight green is the gate.
      # ========================================================================
      - name: Run J-5 T-16 legacy reservation parity spec (records legacy video)
        id: legacy-pw-reservation
        # NON-BLOCKING parity aid (operator: AlpenFlight green is the gate). Same
        # contract as the J-1/J-2/J-4 steps above: `if: always()` (runs even after
        # a prior failure) AND `continue-on-error: true` (its own failure neither
        # fails the job nor cascade-skips the unguarded downstream gate steps —
        # incl. the real alpenflight-export producer-SELECT validation that proves
        # the T-07 reservation bindings, + the AlpenFlight parity specs).
        if: always()
        continue-on-error: true
        working-directory: e2e
        timeout-minutes: 12
        run: |
          npx playwright test \
            --project=reservations \
            tests/reservations/reservations-parity-J5.spec.ts

      # ========================================================================
      # 2f. J-6 T-13/T-16 — legacy PLANNING parity spec. Read-only walkthrough of
      #     the seeded future-days list + one planning day's edit form + the
      #     setup-wizard form in the flsweb UI; records the legacy planning parity
      #     video + writes the legacy-planning-{list,form,setup}.png screenshots.
      #     The SAME legacy stack (already up) + the SAME deterministic FLSTest
      #     seed the J-0c/J-1/J-2/J-5 specs used — "4 or 5 Insert Test Data.sql"
      #     seeds a GETDATE()+1 planning day with crew assignments + remarks, so
      #     the future-days list is populated; no extra seeding, runs on this one
      #     fanout run alongside T-04 + the others. Paired side-by-side with J-6's
      #     AlpenFlight planning videos + shots (journey: J-6) in the gallery via
      #     the legacy-video sidecar (step 7b) + screenshots.json (step 7).
      #     Non-blocking parity aid; AlpenFlight green is the gate.
      # ========================================================================
      - name: Run J-6 T-13 legacy planning parity spec (records legacy video)
        id: legacy-pw-planning
        # NON-BLOCKING parity aid (operator: AlpenFlight green is the gate). Same
        # contract as the J-1/J-2/J-4/J-5 steps above: `if: always()` (runs even
        # after a prior failure) AND `continue-on-error: true` (its own failure
        # neither fails the job nor cascade-skips the unguarded downstream gate
        # steps — incl. the real alpenflight-export producer-SELECT validation
        # that proves the T-11 PlanningDay bindings, + the AlpenFlight parity
        # specs).
        if: always()
        continue-on-error: true
        working-directory: e2e
        timeout-minutes: 12
        run: |
          npx playwright test \
            --project=planning \
            tests/planning/planning-parity-J6.spec.ts

      # ========================================================================
      # 2g. J-7 T-01/T-22 — legacy REPORTING parity spec. Read-only walkthrough of
      #     the /flightreports picker + a canned report's result (filter panel +
      #     summary + flights table) + the custom-report builder form in the flsweb
      #     UI; records the legacy reporting parity video + writes the
      #     legacy-flightreports-{picker,result,custom}.png screenshots. The SAME
      #     legacy stack (already up) + the SAME deterministic FLSTest seed the
      #     J-0c/J-1/J-2/J-5/J-6 specs used — the spec self-seeds a current-year
      #     LSZK glider flight (ensureGliderFlight) so the location-flights-this-year
      #     canned report renders ≥1 row; no extra seeding, runs on this one fanout
      #     run alongside T-04 + the others. Paired side-by-side with J-7's
      #     AlpenFlight reporting shots (alpenflight-flightreports-{picker,result,
      #     custom}.png, curled from the per-push proof gallery) in the gallery via
      #     the legacy-video sidecar (step 7b) + screenshots.json (step 7).
      #     Non-blocking parity aid; AlpenFlight green is the gate.
      # ========================================================================
      - name: Run J-7 T-01 legacy reporting parity spec (records legacy video)
        id: legacy-pw-reporting
        # NON-BLOCKING parity aid (operator: AlpenFlight green is the gate). Same
        # contract as the J-1/J-2/J-4/J-5/J-6 steps above: `if: always()` (runs
        # even after a prior failure) AND `continue-on-error: true` (its own
        # failure neither fails the job nor cascade-skips the unguarded downstream
        # gate steps — incl. the real alpenflight-export producer-SELECT validation
        # + the AlpenFlight parity specs).
        if: always()
        continue-on-error: true
        working-directory: e2e
        timeout-minutes: 12
        run: |
          npx playwright test \
            --project=reporting \
            tests/reporting/reporting-parity-J7.spec.ts

      # ========================================================================
      # 2h. J-8 T-18 — legacy ACCOUNTING-RULE-FILTER parity spec. Read-only
      #     walkthrough of the seeded rule-filter list + one rule's edit form
      #     (`masterdata/accountingRules/`) in the flsweb UI; records the legacy
      #     accounting parity video + writes the legacy-accountingrules-{list,form}.png
      #     screenshots. The SAME legacy stack (already up) + the SAME deterministic
      #     FLSTest seed the J-0c..J-7 specs used — the spec self-seeds ONE
      #     article-target rule via the REST API (so the list is populated + an
      #     edit-form is reachable), then deletes it; no extra fixture seeding, runs
      #     on this one fanout run alongside T-04 + the others. Paired side-by-side
      #     with J-8's AlpenFlight accounting shots (alpenflight-accountingrules-
      #     {list,form}.png, written by accounting-rules-parity.spec.ts in step 6)
      #     in the gallery via the legacy-video sidecar (step 7b) + screenshots.json
      #     (step 7). Non-blocking parity aid; AlpenFlight green is the gate.
      # ========================================================================
      - name: Run J-8 T-18 legacy accounting parity spec (records legacy video)
        id: legacy-pw-accounting
        # NON-BLOCKING parity aid (operator: AlpenFlight green is the gate). Same
        # contract as the J-1/J-2/J-4/J-5/J-6/J-7 steps above: `if: always()` (runs
        # even after a prior failure) AND `continue-on-error: true` (its own failure
        # neither fails the job nor cascade-skips the unguarded downstream gate
        # steps — incl. the real alpenflight-export producer-SELECT validation that
        # proves the T-10 AccountingRuleFilter bindings, + the AlpenFlight parity
        # specs).
        if: always()
        continue-on-error: true
        working-directory: e2e
        timeout-minutes: 12
        run: |
          npx playwright test \
            --project=accounting \
            tests/accounting/accounting-parity-J8.spec.ts

      # ========================================================================
      # 3. ALPENFLIGHT STACK — Postgres + Keycloak + Mailpit + backend + SPA.
      #    (reuses ci.yml's alpenflight-proof bring-up shape)
      #    The alpenflight_shared network is created EARLIER (before "Start
      #    MSSQL"), so it already exists by the time these services come up.
      # ========================================================================
      # Registry-pull retry (J-1 T-09, mirrors ci.yml J-25 T-05): the docker
      # steps below touch external registries (quay.io for Keycloak,
      # registry-1.docker.io for mailpit/postgres/pgadmin) and fail red on
      # transient 5xx/timeout blips. Each is wrapped in a bounded 3-attempt
      # retry with 15s backoff; a persistent failure still exits non-zero after
      # the 3rd attempt, so real breakage stays red. Scoped to image-pull/
      # build/up ONLY — the test/gallery/deploy steps are deliberately NOT
      # retried (a flaky spec must not be silently retried into green).
      - name: Bring up alpenflight-infra (mailpit)
        run: |
          for i in 1 2 3; do
            bash alpenflight/ops/dev-up-infra.sh && exit 0
            echo "attempt $i failed (registry blip?) — retrying in 15s" >&2
            sleep 15
          done
          echo "::error::alpenflight-infra bring-up failed after 3 attempts" >&2
          exit 1

      - name: Build pgAdmin + Keycloak images
        run: |
          for i in 1 2 3; do
            docker compose -f docker-compose.yml --profile next build pgadmin keycloak && exit 0
            echo "attempt $i failed (registry blip?) — retrying in 15s" >&2
            sleep 15
          done
          echo "::error::pgAdmin + Keycloak image build failed after 3 attempts" >&2
          exit 1

      - name: Bring up alpenflight-dev (postgres + pgadmin + keycloak)
        run: |
          for i in 1 2 3; do
            docker compose -p alpenflight-dev -f docker-compose.yml \
              up -d --wait --wait-timeout 240 postgres pgadmin keycloak && exit 0
            echo "attempt $i failed (registry blip?) — retrying in 15s" >&2
            sleep 15
          done
          echo "::error::alpenflight-dev bring-up failed after 3 attempts" >&2
          exit 1

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version-file: alpenflight/web/.nvmrc

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11
          run_install: false

      - name: Restore pnpm store cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('alpenflight/web/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install alpenflight/web deps
        working-directory: alpenflight/web
        env:
          CI: 'true'
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser (alpenflight/web)
        working-directory: alpenflight/web
        run: pnpm exec playwright install-deps chromium && pnpm exec playwright install chromium

      - name: Flyway migrate (alpenflight Postgres)
        working-directory: alpenflight/server
        run: |
          DATASOURCE_URL=jdbc:postgresql://localhost:5432/alpenflight \
          DATASOURCE_USER=alpenflight \
          DATASOURCE_PASSWORD=alpenflight \
          ./gradlew flywayMigrate --no-daemon --console=plain --quiet

      - name: Build alpenflight backend bootJar
        working-directory: alpenflight/server
        run: ./gradlew bootJar --no-daemon --console=plain --quiet

      - name: Start alpenflight backend
        working-directory: alpenflight/server
        env:
          DATASOURCE_URL: jdbc:postgresql://localhost:5432/alpenflight
          DATASOURCE_USER: alpenflight
          DATASOURCE_PASSWORD: alpenflight
          SPRING_PROFILES_ACTIVE: dev
          LOGGING_LEVEL_ROOT: INFO
          # T-17: the backend runs as a HOST bootJar but Keycloak is a container
          # host-mapped to localhost:8090 (compose `127.0.0.1:8090:8080`), so the
          # compose-internal `http://keycloak:8080` is unresolvable from the host.
          # The `dev` profile already redirects JWKS + issuer to localhost:8090,
          # but `keycloak.admin.base-url` (application.yml) still defaults to
          # `http://keycloak:8080` — latent until T-02's provisionMigratedClubAdmins
          # first exercised the admin client at ingest. Point the admin-base at the
          # host-published port; realm / client-id / client-secret defaults already
          # match the committed realm-export's `alpenflight-backend-admin` client.
          ALPENFLIGHT_KC_ADMIN_BASE_URL: http://localhost:8090
          ALPENFLIGHT_KC_ADMIN_REALM: alpenflight
          ALPENFLIGHT_KC_ADMIN_CLIENT_ID: alpenflight-backend-admin
          ALPENFLIGHT_KC_ADMIN_CLIENT_SECRET: alpenflight-backend-admin-dev-secret
          # Token-issuer URL Keycloak emits (KC_HOSTNAME_URL=http://localhost:8090)
          # — kept explicit so backend `iss` validation matches host tokens even if
          # the application.yml default drifts.
          ALPENFLIGHT_OIDC_ISSUER_URI: http://localhost:8090/realms/alpenflight
        run: |
          JAR="$(ls build/libs/*.jar | grep -v -- '-plain.jar' | head -1)"
          echo "Starting backend from: $JAR"
          nohup java -jar "$JAR" > backend.log 2>&1 &
          echo "$!" > backend.pid

      - name: Wait for backend /actuator/health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/actuator/health >/dev/null 2>&1; then
              echo "backend ready (attempt $i)"
              exit 0
            fi
            sleep 2
          done
          echo "backend not ready after 120s" >&2
          tail -n 200 alpenflight/server/backend.log >&2 || true
          exit 1

      # ========================================================================
      # 4. MINT HANDSHAKE — SPA-driven (no direct-access grant on alpenflight-web).
      #    The real-idp project boots `ng serve --configuration=development` on
      #    :4201 for this spec via the Playwright webServer config (E2E_REAL_IDP=1).
      #    Writes {uploadId, publicKeyPem} to the handshake file the export seals to.
      # ========================================================================
      - name: Mint migration handshake to file
        working-directory: alpenflight/web
        timeout-minutes: 10
        env:
          J0C_HANDSHAKE_OUT: ${{ github.workspace }}/j0c-handshake.json
        run: |
          # --workers=1: real-idp serial (top-level `workers` no-op per-project).
          pnpm exec playwright test \
            --config=e2e/playwright.config.ts \
            --project=real-idp \
            --workers=1 \
            e2e/tests/real-idp/mint-handshake.spec.ts

      # ========================================================================
      # 5. REAL EXPORT — alpenflight-export reads the legacy MSSQL READ-ONLY
      #    (the data T-04 just created) → ALPF-encrypted bundle sealed to the
      #    minted handshake. The shadowJar (`build`) yields alpenflight-export.jar.
      # ========================================================================
      - name: Build alpenflight-export fat jar
        working-directory: alpenflight/migration-tool
        run: ./gradlew shadowJar --no-daemon --console=plain --quiet

      - name: Run alpenflight-export against legacy MSSQL (read-only)
        env:
          ALPF_DB_PASSWORD: ${{ env.FLS_MSSQL_SA_PASSWORD }}
        run: |
          JAR="alpenflight/migration-tool/build/libs/alpenflight-export.jar"
          OUT="${{ github.workspace }}/j0c-bundle.enc"
          java -jar "$JAR" \
            --jdbc-url "jdbc:sqlserver://localhost:1433;databaseName=FLSTest;encrypt=true;trustServerCertificate=true" \
            --user sa \
            --password-env ALPF_DB_PASSWORD \
            --handshake-file "${{ github.workspace }}/j0c-handshake.json" \
            --output "$OUT" \
            --force \
            --verbose
          ls -l "$OUT"

      # ========================================================================
      # 6. ALPENFLIGHT PARITY SPECS (J-0c real-bundle + J-1 aircraft + J-2 flight)
      #    — ONE `playwright test` invocation so the single JSON proof-manifest
      #    the gallery reads carries ALL journeys' AlpenFlight videos (a second
      #    invocation would overwrite the manifest, dropping the prior captions).
      #    Mirrors ci.yml's `alpenflight-proof` multi-spec shape (T-07).
      #
      #    - J-0c (fan-out-migration-parity, REAL-bundle): POST the real exported
      #      bundle → fan-out + Keycloak provision → per-club view + edit-isolation
      #      + cross-tenant 404. Records per-club AlpenFlight videos (proof-journey:
      #      J-0c) — paired with the legacy Location video (step 2 / 7b).
      #    - J-1 (aircraft-migration-parity, SYNTH bundle — J1_BUNDLE_SOURCE unset):
      #      clean-seed CRUD + tenant edit-isolation + S-163 + S-164 + the migrated
      #      aircraft render (synth bundle through the REAL migration ingest +
      #      Keycloak provisioning). Records the AlpenFlight aircraft videos
      #      (proof-journey: J-1) — paired SIDE-BY-SIDE with the legacy aircraft
      #      video (step 2b / 7b) under J-1 in the gallery. The full legacy→export
      #      AIRCRAFT bundle is a deeper follow-up; T-14 captures the legacy
      #      aircraft VIDEO + this synth-migrated render is the J-1 AlpenFlight half.
      #    - J-2 (flight-migration-parity, SYNTH bundle — J2_BUNDLE_SOURCE unset):
      #      clean-seed glider+tow+motor CRUD + tenant 404 + read-only state gate +
      #      412 conflict + the migrated glider (crew + tow link) render (synth
      #      bundle through the REAL migration ingest + Keycloak provisioning).
      #      Records the AlpenFlight flight videos (proof-journey: J-2) — paired
      #      SIDE-BY-SIDE with the legacy flight video (step 2c / 7b) under J-2.
      #      The full legacy→export FLIGHT bundle is a deeper follow-up; T-10
      #      captures the legacy flight VIDEO + this synth-migrated render is the
      #      J-2 AlpenFlight half. The clean-seed list/form screenshots
      #      (alpenflight-flights-{list,form}.png) are written by this spec.
      #
      #    The webServer SPA from step 4 is reused (reuseExistingServer is false in
      #    CI, but Playwright tears it down per `playwright test` invocation; this
      #    run re-boots it — acceptable on the dedicated workflow). DATASOURCE_*
      #    are exported so the aircraft spec's Gradle seeder shell-outs
      #    (seedAircraftParityBundle build + seedAircraftOwnerLink DB write) reach
      #    the same Postgres the backend uses.
      # ========================================================================
      - name: Run AlpenFlight parity specs (J-0c real-bundle + J-1 aircraft + J-2 flight + J-5 reservations + J-6 planning + J-8 accounting + J-9 engine)
        id: pw
        working-directory: alpenflight/web
        timeout-minutes: 25
        env:
          J0C_BUNDLE_SOURCE: real
          J0C_REAL_HANDSHAKE_FILE: ${{ github.workspace }}/j0c-handshake.json
          J0C_REAL_BUNDLE_FILE: ${{ github.workspace }}/j0c-bundle.enc
          J0C_REAL_LOCATION_NAME: ${{ env.J0C_LOCATION_NAME }}
          # J-5/J-6/J-8/J-9: the migrated-data render blocks ride the SAME real
          # export the J-0c fan-out spec ingests (the T-07-bound reservation rows,
          # the T-11 planning rows, the T-10-bound AccountingRuleFilter rows, AND
          # the migrated TestClub flights — all in the real bundle, the export
          # iterates EntityType.values()). Flag the real path so each migrated-data
          # describe runs (each `test.skip`s on !useRealBundle() when unset, so the
          # per-push synth gate doesn't false-green); the clean-seed real chains
          # always run. J-8's accounting + J-9's engine migrated blocks read the
          # SAME J5_BUNDLE_SOURCE flag (shared useRealBundle() helper). The J-9
          # engine block runs the harness dry-run over a MIGRATED glider flight +
          # the migrated `FlightTime: Glider per minute` filter (article 5001) →
          # asserts the engine emits that line (producer-bound J-8+J-2 → engine).
          J5_BUNDLE_SOURCE: real
          DATASOURCE_URL: jdbc:postgresql://localhost:5432/alpenflight
          DATASOURCE_USER: alpenflight
          DATASOURCE_PASSWORD: alpenflight
        run: |
          # --workers=1: real-idp serial (top-level `workers` no-op per-project).
          pnpm exec playwright test \
            --config=e2e/playwright.config.ts \
            --project=real-idp \
            --workers=1 \
            e2e/tests/real-idp/fan-out-migration-parity.spec.ts \
            e2e/tests/real-idp/aircraft-migration-parity.spec.ts \
            e2e/tests/real-idp/flight-migration-parity.spec.ts \
            e2e/tests/real-idp/reservations-migration-parity.spec.ts \
            e2e/tests/real-idp/planning-migration-parity.spec.ts \
            e2e/tests/real-idp/accounting-rules-parity.spec.ts \
            e2e/tests/real-idp/delivery-creation-test-parity.spec.ts \
            e2e/tests/real-idp/email-templates.spec.ts

      # Upload the per-test failure artifacts (error-context.md + trace.zip +
      # screenshot/video) BEFORE the staging + gallery + link-check steps run: the
      # deployed-bookmark link-check re-invokes Playwright, which CLEANS the output
      # dir and would delete this spec's trace. Gated on `failure()` and placed
      # right after the AlpenFlight parity step so the trace is captured intact.
      - name: Upload Playwright test-results on failure (pre-gallery)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results-fanout-${{ github.run_id }}
          path: alpenflight/web/test-results/**
          retention-days: 7
          if-no-files-found: warn

      # ========================================================================
      # 6b. J-4 T-12 — AlpenFlight /profile parity SHOTS are NOT re-captured here.
      #     J-4 carries NO data migration, so its AlpenFlight side is the
      #     showcase-seeded 4-tab /profile. The earlier approach re-seeded +
      #     re-captured it in THIS fanout, but `seedShowcase` (fixed-id
      #     clubs/persons/flights) COLLIDES with the migrated J-0c/J-1/J-2
      #     real-bundle data this run already holds (BUILD FAILED in ~1s) — the
      #     showcase seed fundamentally does not belong in the fanout's migrate
      #     chain. So the 4 `alpenflight-profile-{account,personal,pilot,
      #     notifications}.png` shots are sourced from the per-push required
      #     `alpenflight-profile-proof` job (ci.yml), which captures them against
      #     a CLEAN showcase seed (pilot1-populated — exactly the right state to
      #     pair against legacy) and deploys them to the LIVE gh-pages preview
      #     path. The staging step (step 7) `curl`s those deployed PNGs into the
      #     staging dir and pairs them beside the legacy /profile shots. No
      #     seedShowcase, no backend restart, no extra Playwright capture here.
      # ========================================================================
      # 7. GALLERY + VIDEO RETENTION. The AlpenFlight parity videos carry the
      #    proof-* annotations the generator reads (proofVideo() in the spec).
      #    T-06 owns captioning the LEGACY video into the same gallery; here we
      #    build the AlpenFlight side + retain the legacy video as an artifact.
      # ========================================================================
      # Stage the legacy parity video + write the declared legacy-video.json
      # sidecar BEFORE the generator runs — generate-gallery.mjs reads the
      # sidecar (--legacy-video) and renders the legacy create video in the SAME
      # J-0c section as the AlpenFlight per-club videos (T-06).
      - name: Stage legacy parity videos + caption sidecar (J-0c + J-1)
        if: always()
        run: |
          # Legacy videos land under /tmp/fls-e2e-results/<spec>-<title>-<...>/video/.
          # Playwright names each per-test output dir after the spec file, so we
          # pick EACH legacy video deterministically by its spec-name fragment —
          # NOT "the first .webm" (two specs now record: J-0c Location + J-1
          # aircraft). Each gets a stable, named filename so the sidecar's `file`
          # reference is deterministic, and is declared under its OWN journey so
          # the gallery groups it with the matching AlpenFlight videos.
          STAGE="$GITHUB_WORKSPACE/j0c-legacy-video"
          mkdir -p "$STAGE"

          # J-0c — legacy Location fan-out create video.
          LOC_WEBM="$(find /tmp/fls-e2e-results -path '*locations-fanout-J0c*' -name '*.webm' | head -1 || true)"
          # J-1 — legacy aircraft list+form parity video (T-14).
          AC_WEBM="$(find /tmp/fls-e2e-results -path '*aircrafts-parity-J1*' -name '*.webm' | head -1 || true)"
          # J-2 — legacy flight list+form+air-movements parity video (T-10).
          FL_WEBM="$(find /tmp/fls-e2e-results -path '*flights-parity-J2*' -name '*.webm' | head -1 || true)"
          # J-4 — legacy /profile user-settings + person-form parity video (T-12).
          PROF_WEBM="$(find /tmp/fls-e2e-results -path '*profile-parity-J4*' -name '*.webm' | head -1 || true)"
          # J-5 — legacy reservation list+form(+scheduler) parity video (T-16).
          RESV_WEBM="$(find /tmp/fls-e2e-results -path '*reservations-parity-J5*' -name '*.webm' | head -1 || true)"
          # J-6 — legacy planning list+form+setup-wizard parity video (T-13/T-16).
          PLAN_WEBM="$(find /tmp/fls-e2e-results -path '*planning-parity-J6*' -name '*.webm' | head -1 || true)"
          # J-7 — legacy reporting picker+canned-result+custom-builder parity video (T-01/T-22).
          REP_WEBM="$(find /tmp/fls-e2e-results -path '*reporting-parity-J7*' -name '*.webm' | head -1 || true)"
          # J-8 — legacy accounting-rule-filter list+edit-form parity video (T-18).
          ACCT_WEBM="$(find /tmp/fls-e2e-results -path '*accounting-parity-J8*' -name '*.webm' | head -1 || true)"
          # J-4 — the AlpenFlight /profile VIDEO is NOT captured in this fanout
          # (T-12: seedShowcase collides with this run's migrated data). The
          # AlpenFlight /profile half is represented by the 4 PAIRED SCREENSHOTS
          # curled from the per-push gallery (step 7 add_shots), and the per-push
          # `alpenflight-profile-proof` job retains its own /profile video. So
          # there is no AlpenFlight /profile .webm to resolve here.

          VIDEOS=""
          if [ -n "$LOC_WEBM" ]; then
            cp "$LOC_WEBM" "$STAGE/locations-fanout-J0c.webm"
            CAP_LOC="Legacy flsweb: Location '${J0C_LOCATION_NAME}' created + set as homebase on 2 clubs — the global Location row the migration fans out into 2 distinct per-club AlpenFlight rows"
            VIDEOS="$VIDEOS{\"journey\":\"J-0c\",\"file\":\"locations-fanout-J0c.webm\",\"acTag\":\"happy\",\"caption\":$(node -e 'process.stdout.write(JSON.stringify(process.argv[1]))' "$CAP_LOC")},"
          else
            echo "No J-0c Location .webm found under /tmp/fls-e2e-results."
          fi
          if [ -n "$AC_WEBM" ]; then
            cp "$AC_WEBM" "$STAGE/aircrafts-parity-J1.webm"
            CAP_AC="Legacy flsweb: the seeded aircraft list + one aircraft's edit form (immatriculation, competition sign, type, manufacturer, model, seats, owner, homebase, …) — the legacy field set to eyeball against AlpenFlight's /aircrafts register"
            VIDEOS="$VIDEOS{\"journey\":\"J-1\",\"file\":\"aircrafts-parity-J1.webm\",\"acTag\":\"happy\",\"caption\":$(node -e 'process.stdout.write(JSON.stringify(process.argv[1]))' "$CAP_AC")},"
          else
            echo "No J-1 aircraft .webm found under /tmp/fls-e2e-results."
          fi
          if [ -n "$FL_WEBM" ]; then
            cp "$FL_WEBM" "$STAGE/flights-parity-J2.webm"
            CAP_FL="Legacy flsweb: the seeded flight list (glider + paired tow rows) + one flight's edit form (glider+tow field set) + the /airmovements motor list — the legacy field set to eyeball against AlpenFlight's /flights logbook + /airmovements"
            VIDEOS="$VIDEOS{\"journey\":\"J-2\",\"file\":\"flights-parity-J2.webm\",\"acTag\":\"happy\",\"caption\":$(node -e 'process.stdout.write(JSON.stringify(process.argv[1]))' "$CAP_FL")},"
          else
            echo "No J-2 flight .webm found under /tmp/fls-e2e-results."
          fi
          if [ -n "$PROF_WEBM" ]; then
            cp "$PROF_WEBM" "$STAGE/profile-parity-J4.webm"
            CAP_PROF="Legacy flsweb: the /profile screen — the LEFT user-settings + password form (username, language, the dropped-by-design password change) and the RIGHT shared person-form accordion (Masterdata, Communication, License, Club-Settings groups) — the legacy field set to eyeball against AlpenFlight's 4-tab /profile redesign (no data migration; redesign-only)"
            VIDEOS="$VIDEOS{\"journey\":\"J-4\",\"file\":\"profile-parity-J4.webm\",\"acTag\":\"happy\",\"caption\":$(node -e 'process.stdout.write(JSON.stringify(process.argv[1]))' "$CAP_PROF")},"
          else
            echo "No J-4 legacy /profile .webm found under /tmp/fls-e2e-results."
          fi
          if [ -n "$RESV_WEBM" ]; then
            cp "$RESV_WEBM" "$STAGE/reservations-parity-J5.webm"
            CAP_RESV="Legacy flsweb: the seeded reservation list (Date · Start/End · Location · Immatriculation · Pilot · 2nd crew · Reservation type · Remarks) + one reservation's edit form + the reservation-scheduler aircraft×time grid — the legacy field set to eyeball against AlpenFlight's /reservations list + edit form + /reservation-scheduler"
            VIDEOS="$VIDEOS{\"journey\":\"J-5\",\"file\":\"reservations-parity-J5.webm\",\"acTag\":\"happy\",\"caption\":$(node -e 'process.stdout.write(JSON.stringify(process.argv[1]))' "$CAP_RESV")},"
          else
            echo "No J-5 reservation .webm found under /tmp/fls-e2e-results."
          fi
          if [ -n "$PLAN_WEBM" ]; then
            cp "$PLAN_WEBM" "$STAGE/planning-parity-J6.webm"
            CAP_PLAN="Legacy flsweb: the seeded future-days list (Date · Weekday · Location · Remarks · Towing pilot · Flight operator · Instructor · #Reservations) + one planning day's edit form (date · location · remarks · the 3 crew selectizes · the inline per-day reservations table) + the setup wizard (start/end range · 7 weekday checkboxes · location) — the legacy field set to eyeball against AlpenFlight's /planning list + edit form + /planningsetup wizard"
            VIDEOS="$VIDEOS{\"journey\":\"J-6\",\"file\":\"planning-parity-J6.webm\",\"acTag\":\"happy\",\"caption\":$(node -e 'process.stdout.write(JSON.stringify(process.argv[1]))' "$CAP_PLAN")},"
          else
            echo "No J-6 planning .webm found under /tmp/fls-e2e-results."
          fi
          if [ -n "$REP_WEBM" ]; then
            cp "$REP_WEBM" "$STAGE/reporting-parity-J7.webm"
            CAP_REP="Legacy flsweb: the /flightreports picker (person + location canned-report tile grid) + a canned report's results (filter-criteria panel · grouped summary · flights table) + the custom-report builder (date range · glider/motor/tow toggles · person/location selector) — the legacy reporting screens to eyeball against AlpenFlight's /flightreports picker + result page + custom builder"
            VIDEOS="$VIDEOS{\"journey\":\"J-7\",\"file\":\"reporting-parity-J7.webm\",\"acTag\":\"happy\",\"caption\":$(node -e 'process.stdout.write(JSON.stringify(process.argv[1]))' "$CAP_REP")},"
          else
            echo "No J-7 reporting .webm found under /tmp/fls-e2e-results."
          fi
          if [ -n "$ACCT_WEBM" ]; then
            cp "$ACCT_WEBM" "$STAGE/accounting-parity-J8.webm"
            CAP_ACCT="Legacy flsweb: the AccountingRuleFilter list (Active · Name · Description · Target · Type) + one rule's edit form (filter-type selectize driving the conditional article-target / aircraft-filter / recipient sections) — the legacy masterdata/accountingRules screens to eyeball against AlpenFlight's /accountingrules list + filter-type-driven edit form"
