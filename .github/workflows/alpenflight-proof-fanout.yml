          fi

      # Guarantee a modern Node for EVERY `.mjs`/npx generator that follows (the
      # maintainability `npx fallow` + the gallery `generate-gallery.mjs`).
      # This job sets up Node 8 (line ~228, for the legacy flsweb webpack build)
      # BEFORE later Node 20/22 setups. Those later setups are plain steps with no
      # `if:`, so if ANY upstream step in the long legacy→migrate→real chain fails,
      # they are skipped — yet the gallery/maintainability steps below run on
      # `if: always()`, landing on the last node that actually got set up: Node 8.
      # Node 8 predates `.mjs` ESM (`SyntaxError: Unexpected token import` from
      # `vm.js`/`bootstrap_node.js`), so the gallery step red-ed the live fanout.
      # ci.yml's `alpenflight-proof` job has no Node-8 setup, so its identical
      # `always()` gallery step always lands on Node 22 — mirror that here with an
      # `always()` re-pin of the SAME `.nvmrc` node right before the generators,
      # so a failed upstream step can never leave Node 8 on PATH for the .mjs runs.
      - name: Re-pin Node for the .mjs proof generators (mirror ci.yml)
        if: always()
        uses: actions/setup-node@v4
        with:
          node-version-file: alpenflight/web/.nvmrc

      # J-5 T-12 — emit the per-journey Maintainability reports the T-13 gallery
      # panel renders (same stable paths as ci.yml). PRODUCE + STAGE only; T-13
      # reads these. FAIL-SOFT: informational, must never red the fanout proof.
      # Paths (under the gallery --out root + the always() proof artifact):
      #   FE delta:    public/alpenflight/proof/maintainability/fallow-audit.json
      #   FE snapshot: public/alpenflight/proof/maintainability/fallow-health.json
      #   BE PMD:      public/alpenflight/proof/maintainability/pmd-main.xml
      #   BE CPD:      public/alpenflight/proof/maintainability/cpd-check.xml
      - name: Emit maintainability reports (fail-soft)
        id: maintainability
        if: always()
        continue-on-error: true
        run: |
          set +e
          OUT="public/alpenflight/proof/maintainability"
          mkdir -p "$OUT"
          # FE (fallow): audit = changed-files envelope vs main (journey delta).
          git fetch --no-tags --depth=200 origin main:refs/remotes/origin/main 2>/dev/null || true
          (
            cd alpenflight/web
            npx --yes fallow@latest audit --base origin/main --format json \
              > ../../"$OUT"/fallow-audit.json 2>/dev/null || true
            npx --yes fallow@latest health --format json \
              > ../../"$OUT"/fallow-health.json 2>/dev/null || true
          )
          # BE (PMD/CPD from T-11).
          (
            cd alpenflight/server
            ./gradlew :pmdMain :cpdCheck --no-daemon --console=plain --quiet || true
          )
          cp -f alpenflight/server/build/reports/pmd/main.xml "$OUT"/pmd-main.xml 2>/dev/null || true
          cp -f alpenflight/server/build/reports/cpd/cpdCheck.xml "$OUT"/cpd-check.xml 2>/dev/null || true
          echo "── staged maintainability reports ──" >&2
          ls -l "$OUT" >&2 || true
          exit 0

      - name: Build + link-check proof gallery (legacy + AlpenFlight, J-0c)
        id: gallery
        if: always()
        working-directory: alpenflight/web
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          STAGE="${{ github.workspace }}/j0c-legacy-video"
          LEGACY_ARG=""
          if [ -f "$STAGE/legacy-video.json" ]; then
            LEGACY_ARG="--legacy-video $STAGE"
          fi
          # J-1 T-20 — parity screenshots: feed the staged screenshots.json dir so
          # the generator renders the legacy↔AlpenFlight paired <img> block (+ its
          # AC5 link-check: a declared PNG missing from $SHOT fails this step).
          SHOT="${{ github.workspace }}/j1-screenshots"
          SHOT_ARG=""
          if [ -f "$SHOT/screenshots.json" ]; then
            SHOT_ARG="--screenshots $SHOT"
          fi
          # Derive the journey-under-work id off the dispatched integration branch
          # (`integration/J-NNN` → `J-NNN`) so the single page renders that
          # journey's proof. A non-integration dispatch → empty → the generator's
          # own fallback applies.
          JUW_ARG=""
          JID="$(printf '%s' "${REF_NAME:-}" | sed -nE 's#^integration/(J-[0-9]+[a-z]?)$#\1#p')"
          if [ -n "$JID" ]; then
            JUW_ARG="--journey-under-work ${JID}"
          fi
          node e2e/proof-gallery/generate-gallery.mjs \
            --report test-results/proof-manifest.json \
            --out ../../public/alpenflight/proof \
            $LEGACY_ARG \
            $SHOT_ARG \
            $JUW_ARG

      - name: Collect logs on failure
        if: failure()
        run: |
          echo "── legacy server log ───────────────────────" >&2
          tail -n 200 /tmp/fls-server.log >&2 || true
          echo "── flsweb log ──────────────────────────────" >&2
          tail -n 100 /tmp/flsweb.log >&2 || true
          echo "── alpenflight backend log ─────────────────" >&2
          tail -n 200 alpenflight/server/backend.log >&2 || true
          echo "── keycloak log ────────────────────────────" >&2
          docker compose -p alpenflight-dev -f docker-compose.yml logs --tail 200 keycloak >&2 || true

      - name: Upload proof artifact (all videos + reports)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpenflight-proof-fanout-${{ github.run_id }}
          path: |
            alpenflight/web/playwright-report
            alpenflight/web/test-results
            alpenflight/web/screenshots
            alpenflight/server/backend.log
            public/alpenflight/proof
            /tmp/fls-e2e-results
            /tmp/fls-server.log
            /tmp/flsweb.log
          retention-days: 14
          if-no-files-found: warn

      # BRANCH-PREVIEW deploy of the single in-flight-journey bookmark. The fanout
      # runs on a `workflow_dispatch` (no `github.head_ref`), so sanitize
      # `github.ref_name` — kept byte-identical to ci.yml's `Compute proof-preview
      # destination` step + proof-preview-reap.yml so the reaper removes the same
      # `alpenflight/proof-preview/<sanitized>` subdir on PR close. Same bookmark
      # ci.yml's PR preview writes (`keep_files:true`): whichever ran serves the
      # page (the fanout's carries the legacy-paired shots when they exist).
      - name: Compute fan-out branch-preview destination
        id: preview
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main' && steps.gallery.outcome == 'success' }}
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          sanitized="$(printf '%s' "$REF_NAME" | sed -E 's#[^A-Za-z0-9._-]#-#g')"
          subdir="alpenflight/proof-preview/${sanitized}"
          url="https://elekktrisch.github.io/fls/${subdir}/"
          {
            echo "subdir=${subdir}"
            echo "url=${url}"
          } >> "$GITHUB_OUTPUT"
          echo "fan-out proof preview → ${url}"

      # `!cancelled()` so the deploy survives a partial-red parity run; the
      # gallery-outcome gate keeps it from publishing a never-built page.
      - name: Deploy fan-out gallery to gh-pages (branch preview)
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main' && steps.gallery.outcome == 'success' }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: public/alpenflight/proof
          destination_dir: ${{ steps.preview.outputs.subdir }}
          publish_branch: gh-pages
          keep_files: true
          enable_jekyll: false
          commit_message: "fan-out proof preview: ${{ steps.pw.outcome }} for ${{ github.ref_name }} (${{ github.sha }})"

      # Emit the clickable preview URL to both the job summary and a grep-able
      # ::notice:: log line.
      - name: Emit fan-out preview URL
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main' && steps.gallery.outcome == 'success' }}
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
        run: |
          echo "::notice title=Fan-out proof preview::${PREVIEW_URL}"
          {
            echo "## Fan-out proof gallery (branch preview)"
            echo ""
            echo "**${PREVIEW_URL}**"
          } >> "$GITHUB_STEP_SUMMARY"

      # The DEPLOYED bookmark link-check — the catch the generator unit test can't
      # make, because the deploy path drifts independently. Asserts the live
      # bookmark + every declared asset resolve 200 and, with a journey id, that the
      # page is that journey's page (not a thin placeholder). Polls for CDN slack.
      - name: Link-check the DEPLOYED branch-preview gallery
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main' && steps.gallery.outcome == 'success' && steps.preview.outputs.url != '' }}
        working-directory: alpenflight/web
        env:
          GALLERY_DEPLOYED_URL: ${{ steps.preview.outputs.url }}
          REF_NAME: ${{ github.ref_name }}
          GALLERY_LINKS_ONLY: '1'
        run: |
          JID="$(printf '%s' "${REF_NAME:-}" | sed -nE 's#^integration/(J-[0-9]+[a-z]?)$#\1#p')"
          GALLERY_DEPLOYED_JOURNEY="$JID" \
          pnpm exec playwright test \
            --config=e2e/playwright.config.ts \
            --project=proof-gallery-links \
            --grep '\[deployed'

      - name: Stop backend
        if: always()
        run: |
          if [ -f alpenflight/server/backend.pid ]; then
            kill "$(cat alpenflight/server/backend.pid)" 2>/dev/null || true
          fi

      - name: Tear down
        if: always()
        run: |
          docker compose -p alpenflight-dev   -f docker-compose.yml                 down -v --remove-orphans || true
          docker compose -p alpenflight-infra -f docker-compose.yml --profile infra down -v --remove-orphans || true
          docker compose -p fls-e2e           -f docker-compose.yml                 down -v --remove-orphans || true
          docker network rm alpenflight_shared || true

      # Surface the J-1 aircraft + J-2 flight + J-4 /profile legacy parity-video
      # outcomes for visibility, but they are NON-BLOCKING parity aids (operator:
      # AlpenFlight green is the gate), so they are NOT part of the hard-fail
      # condition — only the J-0c legacy create spec + the AlpenFlight parity
      # specs gate this job. J-4 carries no data migration, so its /profile capture
      # (both the legacy spec and the showcase AlpenFlight spec) is a parity aid
      # only, never a gate.
      - name: Mark job failed if a gating spec was red (post-publish)
        if: ${{ steps.legacy-pw.outcome != 'success' || steps.pw.outcome != 'success' }}
        run: |
          echo "legacy J-0c spec: ${{ steps.legacy-pw.outcome }}; AlpenFlight parity specs (J-0c+J-1+J-2): ${{ steps.pw.outcome }}; legacy J-1 aircraft parity video (non-blocking): ${{ steps.legacy-pw-aircraft.outcome }}; legacy J-2 flight parity video (non-blocking): ${{ steps.legacy-pw-flight.outcome }}; legacy J-4 /profile parity video (non-blocking): ${{ steps.legacy-pw-profile.outcome }}; legacy J-8 accounting parity video (non-blocking): ${{ steps.legacy-pw-accounting.outcome }}; AlpenFlight J-4 /profile shots: curled from per-push gallery (no in-fanout capture)" >&2
          exit 1
