          # ----- J-1 T-19/T-20 — parity SCREENSHOTS (legacy + AlpenFlight) -----
          # Four fixed-name PNGs the two specs wrote with fullPage screenshots:
          #   legacy   list/form → testInfo.outputPath under /tmp/fls-e2e-results
          #   AlpenFlight list/form → testInfo.outputDir under
          #                           alpenflight/web/test-results
          # Stage them into SHOT (the --screenshots dir) under their stable names
          # + write screenshots.json declaring journey/side/view/caption so the
          # generator pairs legacy↔AlpenFlight per view (T-20). A missing PNG is a
          # no-op for THAT entry (we only declare the ones we found) — but a
          # DECLARED-yet-missing PNG fails the generator's AC5 link-check, so we
          # declare strictly what we copied.
          SHOT="$GITHUB_WORKSPACE/j1-screenshots"
          mkdir -p "$SHOT"
          SHOTS=""
          add_shot() { # $1 src-glob  $2 stable-name  $3 journey  $4 side  $5 view  $6 caption
            local src; src="$(find $1 -name "$2" 2>/dev/null | head -1 || true)"
            if [ -n "$src" ]; then
              [ "$src" -ef "$SHOT/$2" ] || cp "$src" "$SHOT/$2"
              SHOTS="$SHOTS{\"journey\":\"$3\",\"side\":\"$4\",\"view\":\"$5\",\"file\":\"$2\",\"caption\":$(node -e 'process.stdout.write(JSON.stringify(process.argv[1]))' "$6")},"
            else
              echo "screenshot $2 not found (glob $1) — skipping that entry."
            fi
          }
          add_shot "/tmp/fls-e2e-results" "legacy-aircraft-list.png" "J-1" "legacy" "list" \
            "Legacy flsweb: the seeded aircraft list (Immatriculation · Model · Competition sign · Manufacturer · Seats) — the legacy list columns to eyeball against AlpenFlight's /aircraft list"
