name: nightly

# Legacy e2e (Playwright against flsserver + flsweb) and the two legacy
# build jobs it depends on run on a nightly schedule + on-demand, NOT on
# every PR. The PR-CI lane (`ci.yml`) only exercises the rewrite under
# `alpenflight/` — that's the codebase actively developed; legacy is reference-
# only (see CLAUDE.md "Legacy is reference-only"). The e2e suite still
# guards parity-relevant legacy behavior; it just doesn't gate every PR.
#
# Schedule: 04:00 UTC daily (~05:00–06:00 Europe/Zurich, off-peak). The
# `workflow_dispatch` trigger is the manual escape hatch for "I want a
# legacy-coverage run right now" (e.g. after touching e2e/ or shared
# fixtures).
on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

# Don't pile up overlapping nightly runs.
concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Legacy server build — Mono + xbuild. Self-contained: produces a
  # FLS.Server.Console/bin/Debug folder with the EF SqlServer DLL dropped in,
  # ready for the e2e job to download and run with `mono`.
  # ---------------------------------------------------------------------------
  legacy-server-build:
    name: legacy server build
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Mono 6.12
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mono-complete

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: flsserver/src/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('flsserver/src/**/packages.config') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Install NuGet CLI
        run: sudo curl -sSL -o /usr/local/bin/nuget.exe https://dist.nuget.org/win-x86-commandline/latest/nuget.exe

      - name: Restore every packages.config the cache key hashes
        working-directory: flsserver/src
        run: |
          set -euo pipefail
          package_configs=$(find . -name packages.config -not -path './packages/*' | sort)
          if [ -z "$package_configs" ]; then
            echo "Found no packages.config under flsserver/src. The restore has no inputs and the cache key hashes an empty set."
            exit 1
          fi
          for package_config in $package_configs; do
            mono /usr/local/bin/nuget.exe restore "$package_config" -SolutionDirectory .
          done

      - name: Assert the restore produced every assembly xbuild resolves by HintPath
        working-directory: flsserver/src
        run: |
          set -euo pipefail
          missing_count=0
          for assembly in \
              packages/EnterpriseLibrary.Common.6.0.1304.0/lib/NET45/Microsoft.Practices.EnterpriseLibrary.Common.dll \
              packages/EnterpriseLibrary.Validation.6.0.1304.0/lib/NET45/Microsoft.Practices.EnterpriseLibrary.Validation.dll \
              packages/System.Linq.Dynamic.1.0.7/lib/net40/System.Linq.Dynamic.dll \
              packages/Newtonsoft.Json.12.0.2/lib/net45/Newtonsoft.Json.dll \
              packages/EntityFramework.6.2.0/lib/net45/EntityFramework.dll \
              packages/EntityFramework.6.2.0/lib/net45/EntityFramework.SqlServer.dll ; do
            if [ ! -f "$assembly" ]; then
              echo "Absent after the restore: flsserver/src/$assembly"
              missing_count=$((missing_count + 1))
            fi
          done
          if [ "$missing_count" -gt 0 ]; then
            echo "The restore exited 0 and left $missing_count assembly path(s) absent."
            echo "Without this assertion the job stays green here and fails two steps later, in xbuild, with CS0234 / CS0246 errors in FLS.Common."
            echo "Restore every packages.config under flsserver/src, and do not let a warm actions/cache entry hide an incomplete restore."
            exit 1
          fi

      - name: xbuild projects (Debug)
        working-directory: flsserver/src
        run: |
          for proj in \
              FLS.Common/FLS.Common.csproj \
              FLS.Server.Interfaces/FLS.Server.Interfaces.csproj \
              FLS.Data.WebApi/FLS.Data.WebApi.csproj \
              Alpinely.TownCrier/Alpinely.TownCrier.csproj \
              FLS.Server.Data/FLS.Server.Data.csproj \
              FLS.Server.Service/FLS.Server.Service.csproj \
              FLS.Server.Web/FLS.Server.WebApi.csproj \
              FLS.Server.Console/FLS.Server.Console.csproj ; do
            xbuild "$proj" /p:Configuration=Debug
          done

      - name: Drop EF SqlServer DLL into bin
        working-directory: flsserver/src
        run: |
          cp packages/EntityFramework.6.2.0/lib/net45/EntityFramework.SqlServer.dll \
             FLS.Server.Console/bin/Debug/

      - name: Upload FLS.Server.Console bin artifact
        uses: actions/upload-artifact@v4
        with:
          name: flsserver-console-bin
          path: flsserver/src/FLS.Server.Console/bin/Debug
          retention-days: 1
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Legacy web build — Node 8 + yarn install. Warms the flsweb-node_modules
  # cache that the e2e job will then restore.
  # ---------------------------------------------------------------------------
  legacy-web-build:
    name: legacy web build
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: 8 }

      - name: Cache flsweb node_modules
        id: flsweb-cache
        uses: actions/cache@v4
        with:
          path: flsweb-node_modules
          key: flsweb-node-modules-${{ runner.os }}-${{ hashFiles('flsweb/yarn.lock', 'flsweb/package.json') }}
          restore-keys: |
            flsweb-node-modules-${{ runner.os }}-

      - name: yarn install (if cache miss)
        if: steps.flsweb-cache.outputs.cache-hit != 'true'
        run: |
          rm -rf /tmp/flsweb-build
          cp -r flsweb /tmp/flsweb-build
          sed -i "s|'./TryflightController'|'./TryFlightController'|" /tmp/flsweb-build/src/tryflight/TryFlightModule.js
          sed -i "s|'./PassengerflightController'|'./PassengerFlightController'|" /tmp/flsweb-build/src/passengerflight/PassengerFlightModule.js
          sudo npm install --global yarn@1 -s
          cd /tmp/flsweb-build
          yarn install --network-timeout 600000
          cp -r /tmp/flsweb-build/node_modules ${GITHUB_WORKSPACE}/flsweb-node_modules

  # ---------------------------------------------------------------------------
  # e2e — boots the legacy stack (docker + Mono runtime + webpack-dev-server)
  # and runs Playwright. Receives prebuilt artifacts from the two legacy build
  # jobs above.
  # ---------------------------------------------------------------------------
  e2e:
    name: e2e (Playwright)
    needs: [legacy-server-build, legacy-web-build]
    runs-on: ubuntu-22.04
    # 10-min cap. When this job last ran green (2026-05-24..28, before the
    # bring-up broke) it finished end-to-end in ~5 min — 10 is ~2x that. The
    # prior 30-min cancel was never a duration problem: the job hung on a broken
    # bring-up (the backgrounded compose `up` aborted on the missing external
    # `alpenflight_shared` network, so the marker was never written and the wait
    # spun to the cap) — fixed by creating the network + narrowing to `up -d
    # mssql` + a >= 1 healthy threshold, mirroring alpenflight-proof-fanout.yml.
    # A broken bring-up now loud-fails at the bounded marker wait (<= 5 min, well
    # inside this cap), and the per-test 60s timeout + maxFailures:10 cap a hang /
    # mass-regression too.
    timeout-minutes: 10
    # Serialize gh-pages writes across workflows so concurrent deploys from
    # different refs/workflows don't race the gh-pages ref.
    concurrency:
      group: gh-pages-deploy
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      FLS_LISTEN_URL: "http://*:25567/"
      FLS_MSSQL_SA_PASSWORD: "Demo#FLS#2026"

    steps:
      - uses: actions/checkout@v4

      - name: Install Mono 6.12 (background)
        run: |
          (sudo apt-get update -qq && sudo apt-get install -y -qq mono-complete && touch /tmp/.done-mono) > /tmp/mono.log 2>&1 &
          echo "mono install PID=$!"

      # mssql attaches to the `alpenflight_shared` network, declared
      # `external: true` in docker-compose.yml. An external network must already
      # exist or the compose `up` fails — and the `up` below is backgrounded, so
      # a failure here silently leaves mssql down and the healthcheck wait spins
      # to the job timeout. Create it idempotently BEFORE the `up` (mirrors
      # alpenflight-proof-fanout.yml).
      - name: Create alpenflight_shared network
        run: docker network inspect alpenflight_shared >/dev/null 2>&1 || docker network create alpenflight_shared --driver bridge

      # Backgrounded compose `up` pulls mcr.microsoft.com/mssql/server. The
      # bounded 3-attempt/15s-backoff retry (mirrors ci.yml) lives INSIDE the
      # subshell so /tmp/.done-stack is touched only on a successful `up`; on a
      # persistent failure the marker is never written and the later "Wait for
      # docker stack healthchecks" step times out red, which is correct. Scoped
      # to the image-pull/up ONLY — the Playwright run below is not retried.
      # mssql is the legacy DB; mailpit is the SMTP sink the email/registration
      # specs assert against (`--profile infra` — mailpit is a profiled service,
      # skipped without its profile even when named on the CLI).
      - name: Start docker-compose stack (background)
        run: |
          (
            for i in 1 2 3; do
              docker compose -p fls-e2e --profile infra up -d mssql mailpit && touch /tmp/.done-stack && break
              echo "compose up attempt $i failed (registry blip?) — retrying in 15s" >&2
              sleep 15
            done
          ) > /tmp/stack.log 2>&1 &
          echo "compose up PID=$!"

      - name: Download FLS.Server.Console bin
        uses: actions/download-artifact@v4
        with:
          name: flsserver-console-bin
          path: flsserver/src/FLS.Server.Console/bin/Debug

      - name: Restore flsweb node_modules cache
        uses: actions/cache@v4
        with:
          path: flsweb-node_modules
          key: flsweb-node-modules-${{ runner.os }}-${{ hashFiles('flsweb/yarn.lock', 'flsweb/package.json') }}
          restore-keys: |
            flsweb-node-modules-${{ runner.os }}-

      - uses: actions/setup-node@v4
        with: { node-version: 8 }

      - name: Prepare flsweb tree
        run: |
          rm -rf /tmp/flsweb-build
          cp -r flsweb /tmp/flsweb-build
          sed -i "s|'./TryflightController'|'./TryFlightController'|" /tmp/flsweb-build/src/tryflight/TryFlightModule.js
          sed -i "s|'./PassengerflightController'|'./PassengerFlightController'|" /tmp/flsweb-build/src/passengerflight/PassengerFlightModule.js
          if [ ! -d flsweb-node_modules ]; then
            echo "flsweb-node_modules cache restore failed — legacy-web-build did not populate it"
            exit 1
          fi
          mv flsweb-node_modules /tmp/flsweb-build/node_modules

      - name: Wait for Mono install
        run: |
          while [ ! -f /tmp/.done-mono ]; do sleep 2; done
          tail -3 /tmp/mono.log

      # Two healthchecked containers now come up (mssql + mailpit), so the
      # healthy threshold is >= 2. The marker wait is bounded (300 * 1s) and
      # dumps the otherwise-swallowed /tmp/stack.log + `ps` on timeout so a
      # broken backgrounded `up` surfaces its cause instead of spinning silently
      # to the job cap.
      - name: Wait for docker stack healthchecks
        run: |
          for i in $(seq 1 300); do
            [ -f /tmp/.done-stack ] && break
            sleep 1
          done
          if [ ! -f /tmp/.done-stack ]; then
            echo "::error::compose up never completed — dumping /tmp/stack.log" >&2
            cat /tmp/stack.log >&2 || true
            docker compose -p fls-e2e --profile infra ps >&2 || true
            exit 1
          fi
          for i in $(seq 1 60); do
            healthy=$(docker compose -p fls-e2e --profile infra ps --format json | grep -c '"Health":"healthy"' || true)
            if [ "$healthy" -ge 2 ]; then break; fi
            sleep 2
          done
          docker compose -p fls-e2e --profile infra ps

      - name: Apply FLSTest schema and seed
        env:
          FLS_MSSQL_CONTAINER: fls-e2e-mssql-1
        run: bash e2e/scripts/seed.sh

      - name: Start FLS.Server.Console
        working-directory: flsserver/src/FLS.Server.Console/bin/Debug
        run: |
          setsid nohup mono FLS.Server.Console.exe > /tmp/fls-server.log 2>&1 < /dev/null &
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:25567/api/v1/countries || true)
            if [ "$code" = "200" ]; then echo "API ready"; break; fi
            sleep 2
          done

      - name: Start webpack-dev-server in background
        working-directory: /tmp/flsweb-build
        run: |
          setsid nohup ./node_modules/.bin/webpack-dev-server --TARGET=DEV --SERVER_URL=http://localhost:25567/ > /tmp/flsweb.log 2>&1 < /dev/null &
          for i in $(seq 1 90); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/ || true)
            if [ "$code" = "200" ]; then echo "Dev server ready"; break; fi
            sleep 2
          done

      - name: Set up Node 20 for Playwright
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: e2e/package-lock.json

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('e2e/package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright deps
        working-directory: e2e
        run: |
          npm ci
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = 'true' ]; then
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi

      # @quarantine-legacy excludes flights-parity-J2 — irreducibly flaky on the
      # Mono/AngularJS reference stack under CI load (its render-readiness races
      # exhaust retries:3 even after step-wait hardening). Tracked for a dedicated
      # fix by _BOYSCOUT [LEGACY-J2-READINESS]; explicit exclusion, not a silent drop.
      - name: Run Playwright
        id: pw
        working-directory: e2e
        run: npx playwright test --grep-invert @quarantine-legacy
        continue-on-error: true

      # Loud tally so a nightly red is glanceable, never silently swallowed. The
      # job's RED-on-failure conclusion stays owned by "Mark job as failed
      # (post-deploy)" below (`steps.pw.outcome != 'success'`); this only renders
      # the numbers + failing spec names from the JSON reporter's report.
      - name: Nightly tally → step summary
        if: always()
        run: |
          REPORT=/tmp/fls-e2e-report.json
          {
            if [ ! -f "$REPORT" ]; then
              echo "### legacy nightly (Playwright) — ⚠️ NO REPORT"
              echo ""
              echo "No JSON report at ${REPORT} (the suite may have aborted before running)."
            else
              # stats.{expected,unexpected,flaky} are the run outcomes; skipped is
              # excluded from the total. Only unexpected>0 is the RED signal — a
              # flaky test recovered on retry (job conclusion stays green), so it
              # surfaces as a distinct ⚠️ PASS rather than contradicting the green
              # conclusion with ❌ FAIL.
              read -r passed failed flaky < <(jq -r '.stats | "\(.expected) \(.unexpected) \(.flaky)"' "$REPORT")
              total=$((passed + failed + flaky))
              # total==0 means no test executed (globalSetup threw / aborted run):
              # a report full of zeros is a no-run, never a pass.
              if [ "$total" -eq 0 ]; then verdict="❌ NO-RUN / FAIL"
              elif [ "$failed" -gt 0 ]; then verdict="❌ FAIL"
              elif [ "$flaky" -gt 0 ]; then verdict="⚠️ PASS (${flaky} flaky-recovered)"
              else verdict="✅ PASS"; fi
              echo "### legacy nightly (Playwright) — ${verdict}"
              echo ""
              echo "| total | passed | failed | flaky |"
              echo "| ----: | -----: | -----: | ----: |"
              echo "| ${total} | ${passed} | ${failed} | ${flaky} |"
              if [ "$failed" -gt 0 ]; then
                echo ""
                echo "**Failing specs:**"
                echo ""
                # A spec with ok=false is a genuine failure; a flaky spec is ok=true
                # (passed on retry) and counted only in the table above.
                jq -r '[.. | objects | select(has("specs")) | .specs[] | select(.ok | not) | "- `\(.file)` › \(.title)"] | unique | .[]' "$REPORT"
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Assemble gh-pages artifact
        if: always()
        env:
          PW_OUTCOME: ${{ steps.pw.outcome }}
        run: |
          # Legacy dashboard lives under /legacy/ on the gh-pages branch so it
          # coexists with /alpenflight/ (published by alpenflight-e2e.yml).
          # Pre-2026-05-25 this workflow used force_orphan:true which wiped
          # the entire branch including /alpenflight/ on every run; namespacing
          # + keep_files:true (see Deploy step below) ends that cycle.
          mkdir -p public/legacy/logs
          if [ -d /tmp/fls-e2e-report ]; then cp -r /tmp/fls-e2e-report public/legacy/report; fi
          if [ -d e2e/screenshots ];    then cp -r e2e/screenshots    public/legacy/screenshots; fi
          [ -f /tmp/fls-server.log ] && cp /tmp/fls-server.log public/legacy/logs/ || true
          [ -f /tmp/flsweb.log ]     && cp /tmp/flsweb.log     public/legacy/logs/ || true

          REPORTS=""
          add_card() {
            REPORTS="${REPORTS}<a class=\"card\" href=\"$1\"><h3>$2</h3><p>$3</p></a>"
          }
          if [ -d public/legacy/report ];              then add_card "report/index.html"     "Playwright report"     "All categories. Failure traces &amp; screenshots inline."; fi
          if [ -f public/legacy/logs/fls-server.log ]; then add_card "logs/fls-server.log"   "FLS server log"        "Mono / ASP.NET Web API output."; fi
          if [ -f public/legacy/logs/flsweb.log ];     then add_card "logs/flsweb.log"       "flsweb dev-server log" "Webpack dev-server stdout."; fi

          SCREENSHOTS=""
          if [ -d public/legacy/screenshots ]; then
            for catdir in public/legacy/screenshots/*/; do
              [ -d "$catdir" ] || continue
              compgen -G "${catdir}*.png" > /dev/null || continue
              cat=$(basename "$catdir")
              if [ -z "$SCREENSHOTS" ]; then
                SCREENSHOTS='<section><h2>Full-page screenshots</h2>'
              fi
              SCREENSHOTS="${SCREENSHOTS}<h3 class=\"cat\">${cat}</h3><div class=\"gallery\">"
              for f in "${catdir}"*.png; do
                name=$(basename "$f")
                rel="screenshots/${cat}/${name}"
                SCREENSHOTS="${SCREENSHOTS}<a class=\"shot\" href=\"${rel}\"><img src=\"${rel}\" loading=\"lazy\" alt=\"${cat}/${name}\"><span>${name}</span></a>"
              done
              SCREENSHOTS="${SCREENSHOTS}</div>"
            done
            [ -n "$SCREENSHOTS" ] && SCREENSHOTS="${SCREENSHOTS}</section>"
          fi

          export TIMESTAMP="$(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          export COMMIT_SHORT="${GITHUB_SHA:0:7}"
          export REPORTS SCREENSHOTS

          envsubst '${TIMESTAMP} ${COMMIT_SHORT} ${PW_OUTCOME} ${REPORTS} ${SCREENSHOTS}' \
            < .github/pages/index.html > public/legacy/index.html

          # Root nav page picks between /legacy/ and /alpenflight/. Deployed by
          # both workflows (content is static and identical); whichever runs
          # last is fine.
          cp .github/pages/root-index.html public/index.html

      - name: Deploy to gh-pages
        if: github.ref == 'refs/heads/main' && always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: public
          publish_branch: gh-pages
          # keep_files preserves /alpenflight/ (and any other top-level dir)
          # across nightly runs. Combined with the per-workflow /legacy/ vs
          # /alpenflight/ subdir namespacing this lets the two dashboards
          # coexist without races. Do NOT re-enable force_orphan here.
          keep_files: true
          enable_jekyll: false
          commit_message: "nightly e2e: ${{ steps.pw.outcome }} for ${{ github.sha }}"

      - name: Tear down docker-compose stack
        if: always()
        run: docker compose -p fls-e2e --profile infra down -v

      - name: Mark job as failed (post-deploy)
        if: steps.pw.outcome != 'success'
        run: exit 1
