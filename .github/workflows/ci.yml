name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: alpenflight

jobs:
  build:
    name: Build (gates 1, 2, 3, 5, 6, 8, 9)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.0
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6.3.0
      - run: ./gradlew build --no-daemon

  integration-test:
    name: Tenant isolation integration test (gate 7)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.0
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6.3.0
      - run: ./gradlew :server:core:integrationTest --no-daemon

  standalone-build:
    name: Standalone build (core + open modules, no pro)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.0
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6.3.0
      - run: ./gradlew :server:platform:build :server:core:build :server:modules-open:build --no-daemon

  standalone-build-gate-fixture:
    name: Standalone build gate fixture self-test (gate 3 detection)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.0
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6.3.0
      - run: |
          ./gradlew :server:modules-open:verifyStandaloneBuildGate \
            -PgateFixtureViolateStandaloneBuild=true --no-daemon
