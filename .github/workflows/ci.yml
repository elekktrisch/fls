name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel in-progress runs for the same ref when a new commit lands.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Decide whether the alpenflight/ lane needs to run based on what changed.
  #
  # Legacy (flsserver + flsweb + e2e) is reference-only and exercised by the
  # `nightly.yml` workflow on a schedule — see CLAUDE.md "Legacy is
  # reference-only". PR CI only gates the rewrite.
  #
  # Markdown-only diffs match neither lane: the only job that runs is the
  # `required` aggregator (always green), which keeps branch protection
  # satisfied without spending compute.
  # ---------------------------------------------------------------------------
  changes:
    name: detect changes
    runs-on: ubuntu-22.04
    timeout-minutes: 3
    outputs:
      next: ${{ steps.filter.outputs.next }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          predicate-quantifier: 'every'
          filters: |
            next:
              - '{.github/workflows/ci.yml,alpenflight/**}'
              - '!**/*.md'


  # ---------------------------------------------------------------------------
  # alpenflight/ build — Spring Boot (Gradle) under alpenflight/server, Angular under
  # alpenflight/web. Detects which subdir is buildable; runs only what exists.
  # Legacy lanes live in `nightly.yml` (cron + workflow_dispatch); PR CI
  # only gates the rewrite.
  # ---------------------------------------------------------------------------
  next-build:
    name: alpenflight build
    needs: changes
    if: needs.changes.outputs.next == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    # Write scope so the API-client drift step can push regenerated artifacts
    # back to the PR branch instead of failing the run on every backend-only
    # PR. Fork PRs + push events fall through to the previous fail-with-
    # message behaviour (no write token granted).
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Check out the PR head ref (not the merge ref) so the auto-commit
          # below pushes to the contributor's branch. `persist-credentials`
          # leaves the GITHUB_TOKEN behind for the `git push` step.
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          persist-credentials: true

      - name: Detect buildable next subdirs
        id: detect
        run: |
          if [ -f alpenflight/server/build.gradle.kts ] || [ -f alpenflight/server/build.gradle ]; then
            echo "server=true" >> $GITHUB_OUTPUT
          else
            echo "server=false" >> $GITHUB_OUTPUT
          fi
          if [ -f alpenflight/web/package.json ]; then
            echo "web=true" >> $GITHUB_OUTPUT
          else
            echo "web=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up JDK 25
        if: steps.detect.outputs.server == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin

      - name: Set up Gradle
        if: steps.detect.outputs.server == 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Build alpenflight/server
        if: steps.detect.outputs.server == 'true'
        working-directory: alpenflight/server
        run: ./gradlew build --no-daemon

      - name: Set up Node 22
        if: steps.detect.outputs.web == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: alpenflight/web/.nvmrc

      - name: Set up pnpm
        if: steps.detect.outputs.web == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 11
          run_install: false

      - name: Restore pnpm store cache
        if: steps.detect.outputs.web == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('alpenflight/web/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install alpenflight/web deps
        if: steps.detect.outputs.web == 'true'
        working-directory: alpenflight/web
        env:
          CI: 'true'
        run: pnpm install --frozen-lockfile

      - name: Regenerate API client and auto-commit on drift
        if: steps.detect.outputs.web == 'true'
        working-directory: alpenflight/web
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          BASE_REPO: ${{ github.event.pull_request.base.repo.full_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          EVENT: ${{ github.event_name }}
        run: |
          pnpm run generate-api
          if git diff --quiet src/app/api/generated/; then
            echo "Generated API client is up to date."
            exit 0
          fi
          # Fork PRs (head.repo != base.repo) and non-PR events (push,
          # workflow_dispatch) don't grant a usable write token. Fall back
          # to the legacy fail-with-message behaviour in those cases.
          if [ "$EVENT" != "pull_request" ] || [ "$HEAD_REPO" != "$BASE_REPO" ]; then
            echo "::error::Generated API client is stale. Run 'pnpm run generate-api' locally and commit the result."
            git --no-pager diff --stat src/app/api/generated/
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/api/generated/
          # Intentionally NO `[skip ci]`: branch-protection's `required`
          # check is keyed on the PR HEAD SHA, so the regenerated-client
          # commit must trigger its own CI run for the PR to become
          # mergeable. `concurrency.cancel-in-progress` (workflow header)
          # cancels any in-flight run for this ref. The second run is a
          # no-op for this step (`git diff --quiet` passes), so there is
          # no infinite loop.
          git commit -m "ci: regenerate API client"
          git push origin "HEAD:$HEAD_REF"

      - name: Lint + format + test + build alpenflight/web
        if: steps.detect.outputs.web == 'true'
        working-directory: alpenflight/web
        run: |
          pnpm lint
          pnpm format
          pnpm test
          pnpm build:prod

  # ---------------------------------------------------------------------------
  # Keycloak realm shape check (S-019). Cheap jq guard over
  # alpenflight/auth/realm-export.json: PKCE-S256, bearer-only, no private key,
  # seed users + clubId, ADR 0007 token policy. Reuses `changes.outputs.next`
  # because the realm-export lives under alpenflight/auth/.
  # ---------------------------------------------------------------------------
  next-auth-realm-shape:
    name: alpenflight auth realm shape
    needs: changes
    if: needs.changes.outputs.next == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: Realm-export shape guard
        if: hashFiles('alpenflight/auth/realm-export.json') != ''
        run: bash alpenflight/auth/scripts/check-realm-shape.sh

  # ---------------------------------------------------------------------------
  # Aggregator — single check to wire into branch protection. Passes when
  # every upstream job either succeeded or was correctly skipped (e.g.
  # docs-only PRs skip the next lane, that job reports `skipped`, aggregator
  # is green).
  # ---------------------------------------------------------------------------
  required:
    name: required
    needs: [changes, next-build, next-auth-realm-shape]
    if: always()
    runs-on: ubuntu-22.04
    timeout-minutes: 3
    steps:
      - name: Check upstream job results
        env:
          R_CHANGES: ${{ needs.changes.result }}
          R_NEXT: ${{ needs.next-build.result }}
          R_AUTH: ${{ needs.next-auth-realm-shape.result }}
        run: |
          fail=0
          for pair in \
              "changes:$R_CHANGES" \
              "alpenflight-build:$R_NEXT" \
              "alpenflight-auth-realm-shape:$R_AUTH" ; do
            name="${pair%%:*}"
            result="${pair##*:}"
            case "$result" in
              success|skipped) printf "  %-28s %s\n" "$name" "$result" ;;
              *)               printf "  %-28s %s  <-- failing\n" "$name" "$result"; fail=1 ;;
            esac
          done
          [ "$fail" = "0" ]
