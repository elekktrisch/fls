name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel in-progress runs for the same ref when a new commit lands.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Job-level permissions stay restrictive; the alpenflight-build job re-grants
# `contents: write` so it can auto-commit a stale generated API client back
# to the PR branch (see the "Regenerate API client" step).
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Decide whether the alpenflight/ lane needs to run based on what changed.
  #
  # Legacy (flsserver + flsweb + e2e) is reference-only and exercised by the
  # `nightly.yml` workflow on a schedule — see CLAUDE.md "Legacy is
  # reference-only". PR CI only gates the rewrite.
  #
  # Markdown-only diffs match neither lane: the only job that runs is the
  # `required` aggregator (always green), which keeps branch protection
  # satisfied without spending compute.
  # ---------------------------------------------------------------------------
  changes:
    name: detect changes
    runs-on: ubuntu-22.04
    timeout-minutes: 3
    outputs:
      next: ${{ steps.filter.outputs.next }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          predicate-quantifier: 'every'
          filters: |
            next:
              - '{.github/workflows/ci.yml,alpenflight/**}'
              - '!**/*.md'


  # ---------------------------------------------------------------------------
  # alpenflight/ build — Spring Boot (Gradle) under alpenflight/server, Angular
  # under alpenflight/web. Detects which subdir is buildable; runs only what
  # exists. Legacy lanes live in `nightly.yml` (cron + workflow_dispatch); PR
  # CI only gates the rewrite.
  #
  # NOTE: the job id stays `next-build` so existing branch-protection rules
  # and `required` aggregator wiring keep working without re-pinning.
  # ---------------------------------------------------------------------------
  next-build:
    name: alpenflight build
    needs: changes
    if: needs.changes.outputs.next == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    # contents: write — re-granted at the job level so the API-client
    # regeneration step can push the auto-committed update back to the PR
    # branch. Fork PRs receive a read-only token and the auto-push falls back
    # to a clear error (see the step).
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # head_ref on a `pull_request` event so we can `git push` back to
          # the PR's branch. checkout@v4 leaves this in detached-HEAD by
          # default; we want a real branch.
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          # Persist the GITHUB_TOKEN credentials so the auto-commit step can
          # push without re-authenticating.
          persist-credentials: true

      - name: Detect buildable next subdirs
        id: detect
        run: |
          if [ -f alpenflight/server/build.gradle.kts ] || [ -f alpenflight/server/build.gradle ]; then
            echo "server=true" >> $GITHUB_OUTPUT
          else
            echo "server=false" >> $GITHUB_OUTPUT
          fi
          if [ -f alpenflight/web/package.json ]; then
            echo "web=true" >> $GITHUB_OUTPUT
          else
            echo "web=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up JDK 25
        if: steps.detect.outputs.server == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin

      - name: Set up Gradle
        if: steps.detect.outputs.server == 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Build alpenflight/server
        if: steps.detect.outputs.server == 'true'
        working-directory: alpenflight/server
        run: ./gradlew build --no-daemon

      - name: Set up Node 22
        if: steps.detect.outputs.web == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: alpenflight/web/.nvmrc

      - name: Set up pnpm
        if: steps.detect.outputs.web == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 11
          run_install: false

      - name: Restore pnpm store cache
        if: steps.detect.outputs.web == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('alpenflight/web/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install alpenflight/web deps
        if: steps.detect.outputs.web == 'true'
        working-directory: alpenflight/web
        env:
          CI: 'true'
        run: pnpm install --frozen-lockfile

      # Regenerate the API client. If it drifts from what was committed:
      #   - same-repo PR  →  commit the regenerated files back to the PR
      #                       branch with `[skip ci]` (avoids triggering a
      #                       second CI run; the developer's next push runs
      #                       CI normally).
      #   - fork PR or push to main with no head_ref → fail with a clear
      #                       message asking for a local `pnpm run generate-api`.
      - name: Regenerate API client; auto-commit drift to PR branch
        if: steps.detect.outputs.web == 'true'
        working-directory: alpenflight/web
        env:
          GH_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          GH_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          GH_BASE_REPO: ${{ github.repository }}
        run: |
          pnpm run generate-api
          if git diff --exit-code --quiet src/app/api/generated/; then
            echo "Generated API client up-to-date."
            exit 0
          fi
          echo "::notice::Generated API client was stale."
          if [ -z "${GH_HEAD_REF}" ] || [ "${GH_HEAD_REPO}" != "${GH_BASE_REPO}" ]; then
            echo "::error::Cannot auto-commit (push event or fork PR — read-only token). Run 'pnpm run generate-api' locally and commit the result."
            git diff --stat src/app/api/generated/
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/api/generated/
          git commit -m "ci: regenerate API client [skip ci]"
          git push origin "HEAD:${GH_HEAD_REF}"
          echo "::notice::Regenerated API client pushed to ${GH_HEAD_REF}. CI will re-run on the new commit."

      - name: Lint + format + test + build alpenflight/web
        if: steps.detect.outputs.web == 'true'
        working-directory: alpenflight/web
        run: |
          pnpm lint
          pnpm format
          pnpm test
          pnpm build:prod

  # ---------------------------------------------------------------------------
  # Keycloak realm shape check (S-019). Cheap jq guard over
  # alpenflight/auth/realm-export.json: PKCE-S256, bearer-only, no private key,
  # seed users + clubId, ADR 0007 token policy. Reuses `changes.outputs.next`
  # because the realm-export lives under alpenflight/auth/.
  #
  # Job id stays `next-auth-realm-shape` for branch-protection stability.
  # ---------------------------------------------------------------------------
  next-auth-realm-shape:
    name: alpenflight auth realm shape
    needs: changes
    if: needs.changes.outputs.next == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: Realm-export shape guard
        if: hashFiles('alpenflight/auth/realm-export.json') != ''
        run: bash alpenflight/auth/scripts/check-realm-shape.sh

  # ---------------------------------------------------------------------------
  # Aggregator — single check to wire into branch protection. Passes when
  # every upstream job either succeeded or was correctly skipped (e.g.
  # docs-only PRs skip the alpenflight lane, that job reports `skipped`,
  # aggregator is green).
  # ---------------------------------------------------------------------------
  required:
    name: required
    needs: [changes, next-build, next-auth-realm-shape]
    if: always()
    runs-on: ubuntu-22.04
    timeout-minutes: 3
    steps:
      - name: Check upstream job results
        env:
          R_CHANGES: ${{ needs.changes.result }}
          R_NEXT: ${{ needs.next-build.result }}
          R_AUTH: ${{ needs.next-auth-realm-shape.result }}
        run: |
          fail=0
          for pair in \
              "changes:$R_CHANGES" \
              "alpenflight-build:$R_NEXT" \
              "alpenflight-auth-realm-shape:$R_AUTH" ; do
            name="${pair%%:*}"
            result="${pair##*:}"
            case "$result" in
              success|skipped) printf "  %-30s %s\n" "$name" "$result" ;;
              *)               printf "  %-30s %s  <-- failing\n" "$name" "$result"; fail=1 ;;
            esac
          done
          [ "$fail" = "0" ]
