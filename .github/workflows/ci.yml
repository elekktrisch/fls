name: ci

# Trigger policy (J-25 T-05 dedup): `push` is `main`-only — the post-merge
# run that performs the canonical `github.ref == 'refs/heads/main'`-gated
# gh-pages proof-gallery deploy. In-flight `integration/**` branches always
# carry a (draft) PR in this flow, so the `pull_request` trigger covers them
# with a SINGLE run (a branch listed under both `push` and `pull_request`
# would otherwise run twice on one commit — different `github.ref` → the
# `ci-${{ github.ref }}` concurrency groups don't cancel each other).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main, "integration/**"]
  workflow_dispatch:

# Cancel in-progress runs for the same ref when a new commit lands.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Decide whether the alpenflight/ lane needs to run based on what changed.
  #
  # Legacy (flsserver + flsweb + e2e) is reference-only and exercised by the
  # `nightly.yml` workflow on a schedule — see CLAUDE.md "Legacy is
  # reference-only". PR CI only gates the rewrite.
  #
  # Two ways the heavy lane is skipped (both leave only the `required`
  # aggregator running — always green — so branch protection stays satisfied
  # without spending compute):
  #   1. The WHOLE PR vs main touches no alpenflight/ or ci.yml file (markdown-
  #      only PR): `filter.next` is false.
  #   2. THIS push / PR-sync's incremental diff is docs-only even though the PR
  #      cumulatively contains code: `incremental.docs_only` is true (J-2 T-11).
  # ---------------------------------------------------------------------------
  changes:
    name: detect changes
    runs-on: ubuntu-22.04
    timeout-minutes: 3
    outputs:
      next: ${{ steps.filter.outputs.next }}
      docs_only: ${{ steps.incremental.outputs.docs_only }}
      # J-5 T-14 — the journey-under-work's real-idp proof spec, derived off the
      # integration branch name (see the "Derive journey proof spec" step). The
      # per-push `alpenflight-proof` job runs ONLY this spec; `proof_is_baseline`
      # is 'true' when it resolved to the J-0 Locations baseline (the branch is
      # not an integration/J-NNN branch, the journey's `parity_test:` is not a
      # clean-seed `tests/real-idp/` spec — e.g. a showcase-seeded J-4
      # `tests/profile/` spec, which has its own gating job — or derivation
      # failed: the FAIL-SAFE always runs a known-good real-chain proof, never
      # nothing). NOTE J-5's `parity_test:` IS a `tests/real-idp/` spec
      # (`reservations-migration-parity.spec.ts`), so on `integration/J-5` this
      # resolves to that spec with `is_baseline=false` — not the baseline.
      proof_spec: ${{ steps.proof_spec.outputs.spec }}
      proof_journey: ${{ steps.proof_spec.outputs.journey }}
      proof_is_baseline: ${{ steps.proof_spec.outputs.is_baseline }}
      # J-6 T-02b — the journey-under-work's OWN mock-auth spec filter, derived
      # off the integration branch name (see "Derive journey mock-e2e filter").
      # The per-push `alpenflight-mock-e2e` job runs ONLY this path-filter (the
      # journey's own `tests/<feature>/` specs); prior journeys' mock specs run
      # in the FULL chromium suite nightly + at the §4 do-ship gate, never
      # per-push, so an unrelated flaky mock spec can't red this journey's
      # `required`. `mock_is_full` is 'true' when derivation fell back to the
      # WHOLE chromium project (non-integration branch / no `mock_test:`
      # frontmatter / underivable) — the FAIL-SAFE runs the full suite, never a
      # no-spec run that Playwright would treat as "match nothing".
      mock_filter: ${{ steps.mock_spec.outputs.filter }}
      mock_is_full: ${{ steps.mock_spec.outputs.is_full }}
    steps:
      # fetch-depth: 0 so the `incremental` step below can diff against the
      # PR/push "before" SHA (the parent of the pushed commits), which a
      # shallow depth-1 checkout would not have locally.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          predicate-quantifier: 'every'
          filters: |
            next:
              - '{.github/workflows/ci.yml,alpenflight/**}'
              - '!**/*.md'

      # ---------------------------------------------------------------------
      # Incremental docs-only gate (J-2 T-11).
      #
      # `filter.next` above diffs the WHOLE PR against its base (`main`) — so on
      # an `integration/**` branch that already carries earlier alpenflight/
      # commits, `next` is ALWAYS true, even for a push that only edited docs.
      # That re-ran the ~8-min build+proof on every doc-only push during J-1.
      #
      # This step instead looks at ONLY the commits introduced by THIS push /
      # PR-sync (github.event.before..after) and sets `docs_only=true` iff that
      # incremental diff touched zero heavy-lane files (alpenflight/** or this
      # workflow, ignoring *.md). The heavy jobs gate on
      # `next == 'true' && docs_only != 'true'`, so a doc-only push skips them
      # while a code push still runs. FAIL-SAFE toward running: any case where
      # the incremental range is undeterminable (new branch / force-push with a
      # zero or missing `before`, freshly opened PR, workflow_dispatch) leaves
      # docs_only=false so the heavy lane runs — we never risk false-skipping a
      # real code push.
      - name: Detect docs-only push (incremental)
        id: incremental
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: |
          set -euo pipefail
          zero='0000000000000000000000000000000000000000'
          # No usable incremental range → run the heavy lane (fail-safe).
          if [ -z "${BEFORE:-}" ] || [ "${BEFORE}" = "${zero}" ] \
             || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            echo "no usable 'before' SHA (${BEFORE:-unset}) — not docs-only (run heavy lane)"
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          head="${AFTER:-HEAD}"
          if [ "${head}" != "HEAD" ] && ! git cat-file -e "${head}^{commit}" 2>/dev/null; then
            head=HEAD
          fi
          echo "incremental diff range: ${BEFORE}..${head}"
          changed="$(git diff --name-only "${BEFORE}" "${head}")"
          echo "── files changed in this push ──"
          echo "${changed}"
          # A "heavy-lane" file is alpenflight/** or this workflow, EXCLUDING *.md.
          # If the incremental diff contains any such file, it is NOT docs-only.
          heavy="$(printf '%s\n' "${changed}" \
            | grep -E '^(alpenflight/|\.github/workflows/ci\.yml$)' \
            | grep -vE '\.md$' || true)"
          if [ -n "${heavy}" ]; then
            echo "── heavy-lane files touched → not docs-only ──"
            echo "${heavy}"
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          else
            echo "── no heavy-lane files in this push → docs-only (skip build+proof) ──"
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
          fi

      # ---------------------------------------------------------------------
      # Derive the journey-under-work's real-idp proof spec (J-5 T-14).
      #
      # PROBLEM (J-3 retro): the per-push `alpenflight-proof` job used to be
      # hardcoded to the J-0 Locations spec; the rider asks that — during a
      # journey's build-up — the per-push proof run the CURRENT journey's spec,
      # not a fixed prior journey's, so iteration is fast and a prior-journey
      # flake can't red an unrelated journey's gate.
      #
      # DERIVATION (most-robust path, per the rider): read the journey FILE's
      # `parity_test:` frontmatter off the integration branch name.
      #   1. branch = github.head_ref (PR) || github.ref_name (push).
      #   2. integration/J-NNN  →  journey id  J-NNN  (anything else → baseline).
      #   3. docs/modernization/stories/J-NNN-*.md  →  the `parity_test:` value;
      #      take its FIRST path token, normalize to a path relative to
      #      alpenflight/web/ (so it's runnable from that working-directory).
      #   4. Only specs UNDER tests/real-idp/ are runnable by the CLEAN-SEED
      #      `alpenflight-proof` job (they self-seed in beforeAll). J-5's
      #      `parity_test:` IS such a spec (real-idp
      #      `reservations-migration-parity.spec.ts`), so `integration/J-5`
      #      derives that spec, is_baseline=false — it gates `required` (T-19).
      #      A `parity_test:` that is NOT a clean-seed real-idp spec — a
      #      showcase-seeded tests/profile/ spec (J-4 — own showcase-seeded
      #      gating job), a mock-auth-only tests/… spec that runs in
      #      `alpenflight-mock-e2e`, or an underivable branch → FALL BACK to the
      #      journey-agnostic J-0 Locations baseline (`is_baseline=true`).
      #      FAIL-SAFE: always a known-good real-chain proof, NEVER nothing — the
      #      baseline keeps the J-0 captions the preview live-link-check greps for.
      - name: Derive journey proof spec
        id: proof_spec
        env:
          HEAD_REF: ${{ github.head_ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          BASELINE='e2e/tests/real-idp/locations-crud-tenant-isolation.spec.ts'
          emit() { # $1 spec  $2 journey  $3 is_baseline
            echo "spec=$1" >> "$GITHUB_OUTPUT"
            echo "journey=$2" >> "$GITHUB_OUTPUT"
            echo "is_baseline=$3" >> "$GITHUB_OUTPUT"
            echo "── proof spec: $1  (journey=$2, baseline=$3) ──"
          }
          branch="${HEAD_REF:-${REF_NAME:-}}"
          echo "branch under work: '${branch}'"
          # Only integration/J-NNN branches carry a journey-under-work.
          jid="$(printf '%s' "$branch" | sed -nE 's#^integration/(J-[0-9]+[a-z]?)$#\1#p')"
          if [ -z "$jid" ]; then
            echo "not an integration/J-NNN branch → J-0 Locations baseline (fail-safe)"
            emit "$BASELINE" "J-0" "true"; exit 0
          fi
          # Select the actual JOURNEY file by its frontmatter `id:`, not by glob
          # order — a sibling scratch doc (e.g. J-6b-oracle.md, no frontmatter)
          # also matches `${jid}-*.md` and would otherwise win `head -1`
          # alphabetically, derailing the derivation.
          jf="$(grep -lE "^id:[[:space:]]*${jid}([[:space:]]|$)" docs/modernization/stories/${jid}-*.md 2>/dev/null | head -1 || true)"
          if [ -z "$jf" ] || [ ! -f "$jf" ]; then
            echo "no journey file for ${jid} → baseline (fail-safe)"
            emit "$BASELINE" "$jid" "true"; exit 0
          fi
          # First path token of the `parity_test:` frontmatter value: stop at the
          # first whitespace, '(', or ';' (the value can carry prose / a second
          # path after a separator). Strip a leading alpenflight/web/ so the path
          # is relative to that working-directory.
          raw="$(grep -m1 -E '^parity_test:' "$jf" | sed -E 's/^parity_test:[[:space:]]*//' || true)"
          spec="$(printf '%s' "$raw" | sed -E 's/[[:space:](;].*$//' | sed -E 's#^alpenflight/web/##')"
          echo "${jid} parity_test first token → '${spec}'"
          case "$spec" in
            e2e/tests/real-idp/*.spec.ts)
              # A CLEAN-SEED real-idp spec the proof job can run directly: the
              # real-idp specs self-seed in their own beforeAll (Gradle seeder
              # shell-outs against the clean-seed Postgres), so they run green in
              # this clean-seed job. (`tests/profile/` is DELIBERATELY excluded:
              # the J-4 self-edit spec needs the @Profile("showcase") seed, which
              # only the dedicated showcase-seeded `alpenflight-profile-proof`
              # job loads — running it here, clean-seed, would red. It already
              # has its own gating job, so we fall through to the baseline.)
              if [ -f "alpenflight/web/${spec}" ]; then
                # The file existing is NOT enough: a STUB spec whose every case
                # is `test.fixme(` / `test.skip(` (the journey's parity_test
                # authored at T-01, before its assertions are thickened) runs as
                # a NO-OP here — zero captures, so the post-deploy
                # deployed-journey guard then reds demanding a complete
                # journey-under-work page that this run never produced (J-26
                # T-31). Require ≥1 ACTIVE real-idp test before treating the
                # spec as runnable. "Active" = a top-level `test(` declaration
                # (NOT `test.fixme(` / `test.skip(` — those carry a `.` after
                # `test`, so `^\s*test\(` excludes them; `test.describe(`
                # grouping is likewise excluded — only the inner `test(` counts).
                # When T-27 un-fixmes the assertions, this auto-flips to
                # is_baseline=false with no workflow change.
                if grep -qE '^[[:space:]]*test\(' "alpenflight/web/${spec}"; then
                  emit "$spec" "$jid" "false"; exit 0
                fi
                echo "spec '${spec}' exists but has no active (non-fixme) real-idp test → baseline until thickened"
                emit "$BASELINE" "$jid" "true"; exit 0
              fi
              echo "derived spec '${spec}' not found on disk → baseline (fail-safe)"
              emit "$BASELINE" "$jid" "true"; exit 0
              ;;
            *)
              # A mock-auth parity spec (runs in `alpenflight-mock-e2e`), a
              # showcase-seeded `tests/profile/` spec (own gating job), or an
              # unparseable value → run the journey-agnostic J-0 Locations
              # baseline (fail-safe: a known-good real-chain proof, never nothing).
              echo "parity spec is not a clean-seed real-idp spec → baseline (fail-safe)"
              emit "$BASELINE" "$jid" "true"; exit 0
              ;;
          esac

      # ---------------------------------------------------------------------
      # Derive the journey-under-work's mock-e2e spec filter (J-6 T-02b).
      #
      # MIRRORS the real-idp `proof_spec` step above, for the mock-auth half.
      # PROBLEM (the pending _BOYSCOUT rider, J-5-held-hostage-by-articles-crud):
      # the per-push `alpenflight-mock-e2e` job runs the WHOLE `chromium` project
      # (ALL features' mock specs). One unrelated flaky mock spec then reds the
      # `required` gate on a journey that touches none of it.
      #
      # DERIVATION (same path as proof_spec): read the journey FILE's
      # `mock_test:` frontmatter off the integration branch name; its FIRST path
      # token (a `tests/<feature>/` dir or a single spec), normalized relative to
      # alpenflight/web/, becomes the Playwright positional filter the mock job
      # passes to `--project=chromium`. The chromium project's own testMatch /
      # testIgnore still apply on top of the filter, so an excluded spec under
      # the dir stays excluded.
      #   1. branch = github.head_ref (PR) || github.ref_name (push).
      #   2. integration/J-NNN  →  journey id  (anything else → full suite).
      #   3. docs/.../J-NNN-*.md  →  `mock_test:` value → first path token →
      #      strip a leading alpenflight/web/ → assert it exists on disk.
      # FAIL-SAFE: a non-integration branch, a missing journey file, no
      # `mock_test:` frontmatter, or a filter that doesn't resolve on disk →
      # emit an EMPTY filter + is_full=true, so the mock job runs the WHOLE
      # chromium project (the pre-T-02b baseline). NEVER a no-spec run — an empty
      # positional arg to `playwright test` means "run everything", which is
      # exactly the fail-safe we want, but we make it explicit via is_full so the
      # job logs which path it took.
      - name: Derive journey mock-e2e filter
        id: mock_spec
        env:
          HEAD_REF: ${{ github.head_ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          emit() { # $1 filter (may be empty)  $2 is_full
            echo "filter=$1" >> "$GITHUB_OUTPUT"
            echo "is_full=$2" >> "$GITHUB_OUTPUT"
            echo "── mock-e2e filter: '${1:-<full chromium suite>}'  (is_full=$2) ──"
          }
          branch="${HEAD_REF:-${REF_NAME:-}}"
          echo "branch under work: '${branch}'"
          jid="$(printf '%s' "$branch" | sed -nE 's#^integration/(J-[0-9]+[a-z]?)$#\1#p')"
          if [ -z "$jid" ]; then
            echo "not an integration/J-NNN branch → full chromium suite (fail-safe)"
            emit "" "true"; exit 0
          fi
          # Select the actual JOURNEY file by its frontmatter `id:`, not by glob
          # order — a sibling scratch doc (e.g. J-6b-oracle.md, no frontmatter)
          # also matches `${jid}-*.md` and would otherwise win `head -1`
          # alphabetically, silently defeating this step's scoping.
          jf="$(grep -lE "^id:[[:space:]]*${jid}([[:space:]]|$)" docs/modernization/stories/${jid}-*.md 2>/dev/null | head -1 || true)"
          if [ -z "$jf" ] || [ ! -f "$jf" ]; then
            echo "no journey file for ${jid} → full chromium suite (fail-safe)"
            emit "" "true"; exit 0
          fi
          raw="$(grep -m1 -E '^mock_test:' "$jf" | sed -E 's/^mock_test:[[:space:]]*//' || true)"
          if [ -z "$raw" ]; then
            echo "${jid} has no mock_test: frontmatter → full chromium suite (fail-safe)"
            emit "" "true"; exit 0
          fi
          # Extract the filter token. Stop at whitespace / ';' / '#' so trailing
          # prose or a comment is dropped — but DELIBERATELY keep '(' '|' ')': a
          # journey whose own specs span SEVERAL feature dirs (J-6b:
          # reservations/planning/forms) can't be a single dir without pulling
          # prior journeys' specs in that dir, so its `mock_test:` is a Playwright
          # positional REGEX (an alternation over its spec stems). Strip a leading
          # alpenflight/web/ so the token is relative to that working-directory.
          filter="$(printf '%s' "$raw" | sed -E 's/[[:space:];#].*$//' | sed -E 's#^alpenflight/web/##')"
          echo "${jid} mock_test token → '${filter}'"
          if [ -z "$filter" ]; then
            echo "empty mock_test token → full chromium suite (fail-safe)"
            emit "" "true"; exit 0
          fi
          # VALIDATE the token resolves to real spec(s) under alpenflight/web/,
          # else fall back to the full suite (never risk a no-spec run). Two shapes:
          #   • PLAIN PATH (no regex metachars): a tests/<feature>/ dir OR a single
          #     spec file — check it exists on disk directly (pre-J-6b behaviour).
          #   • REGEX ALTERNATION (contains '(' or '|'): a Playwright positional
          #     regex like `tests/(a/x|b/y|c/z)`. Decompose it into its literal
          #     path stems and require EVERY stem to resolve on disk (a *.spec.ts
          #     file or a prefix of one). The chromium project's testMatch still
          #     applies on top, so the regex only narrows — it can't widen.
          case "$filter" in
            *'('*|*'|'*)
              # Expand the alternation: drop the leading `prefix(`, the trailing
              # `)`, split on '|', and re-prepend the prefix to each branch.
              prefix="$(printf '%s' "$filter" | sed -E 's/\(.*$//')"
              inner="$(printf '%s' "$filter" | sed -E 's/^[^(]*\(//; s/\)[^)]*$//')"
              ok=1
              IFS='|'
              for branch in $inner; do
                stem="${prefix}${branch}"
                # A stem resolves if a *.spec.ts under alpenflight/web/ starts with
                # it (the regex matches by path prefix, e.g. `…-hardening` → the
                # `…-hardening.spec.ts` file). Match dir-or-file-prefix via glob.
                if ! ls "alpenflight/web/${stem}"*.spec.ts >/dev/null 2>&1 \
                   && [ ! -e "alpenflight/web/${stem}" ]; then
                  echo "mock filter branch '${stem}' resolves to no spec on disk"
                  ok=0
                fi
              done
              unset IFS
              if [ "$ok" = 1 ]; then
                emit "$filter" "false"; exit 0
              fi
              echo "mock filter regex '${filter}' has an unresolved branch → full chromium suite (fail-safe)"
              emit "" "true"; exit 0
              ;;
            *)
              if [ -e "alpenflight/web/${filter}" ]; then
                emit "$filter" "false"; exit 0
              fi
              echo "mock filter '${filter}' not found on disk → full chromium suite (fail-safe)"
              emit "" "true"; exit 0
              ;;
          esac


  # ---------------------------------------------------------------------------
  # alpenflight/ build — FAIL-AGGREGATE split (J-7 T-13, J-5 retro rider).
  #
  # Previously ONE `next-build` job built server (Gradle) THEN web (Node) THEN
  # ran `pnpm lint; pnpm format; pnpm test; pnpm build` in a single `run:` block.
  # A server-build failure hid every web check; a `pnpm lint` failure hid the
  # `pnpm test`/`build` reds — so a developer discovered reds layer-by-layer
  # across fix-one-rerun cycles. Split into two PARALLEL jobs by toolchain (the
  # two use entirely DISJOINT setups — JDK/Gradle vs Node/pnpm — so the split
  # adds no duplicated expensive setup), and inside each job each check is its
  # OWN step gated on `${{ !cancelled() }}` so a red step doesn't skip the
  # later independent checks: one CI run now surfaces server build, web lint,
  # web format, web test, and web build reds all at once. Both jobs gate the
  # `required` aggregator (see `required.needs`); each carries the SAME
  # `next == 'true' && docs_only != 'true'` path-filter as before, so a
  # docs-only push skips both → they report `skipped` → the aggregator's
  # skipped-to-success path keeps the gate green.
  #
  # `mock-e2e` was already a separate parallel job (`needs: changes`), so it
  # reported independently before this split — this change closes the
  # build/server-test/web-lint serial gap the rider names.
  #
  # Legacy lanes live in `nightly.yml` (cron + workflow_dispatch); PR CI
  # only gates the rewrite.
  # ---------------------------------------------------------------------------
  next-build-server:
    name: alpenflight build (server + migration-tool)
    needs: changes
    if: needs.changes.outputs.next == 'true' && needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Detect buildable Gradle subdirs
        id: detect
        run: |
          if [ -f alpenflight/server/build.gradle.kts ] || [ -f alpenflight/server/build.gradle ]; then
            echo "server=true" >> $GITHUB_OUTPUT
          else
            echo "server=false" >> $GITHUB_OUTPUT
          fi
          if [ -f alpenflight/migration-tool/build.gradle.kts ]; then
            echo "migration_tool=true" >> $GITHUB_OUTPUT
          else
            echo "migration_tool=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up JDK 25
        if: steps.detect.outputs.server == 'true' || steps.detect.outputs.migration_tool == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin

      - name: Set up Gradle
        if: steps.detect.outputs.server == 'true' || steps.detect.outputs.migration_tool == 'true'
        uses: gradle/actions/setup-gradle@v4

      # `!cancelled()` (not the default fail-fast) so a red server build still
      # lets the migration-tool build report its own status in the same run.
      - name: Build alpenflight/server
        if: ${{ !cancelled() && steps.detect.outputs.server == 'true' }}
        working-directory: alpenflight/server
        run: ./gradlew build --no-daemon

      - name: Build alpenflight/migration-tool
        if: ${{ !cancelled() && steps.detect.outputs.migration_tool == 'true' }}
        working-directory: alpenflight/migration-tool
        run: ./gradlew build --no-daemon

  next-build-web:
    name: alpenflight build (web)
    needs: changes
    if: needs.changes.outputs.next == 'true' && needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Detect buildable web subdir
        id: detect
        run: |
          if [ -f alpenflight/web/package.json ]; then
            echo "web=true" >> $GITHUB_OUTPUT
          else
            echo "web=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up Node 22
        if: steps.detect.outputs.web == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: alpenflight/web/.nvmrc

      - name: Set up pnpm
        if: steps.detect.outputs.web == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 11
          run_install: false

      - name: Restore pnpm store cache
        if: steps.detect.outputs.web == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('alpenflight/web/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install alpenflight/web deps
        if: steps.detect.outputs.web == 'true'
        working-directory: alpenflight/web
        env:
          CI: 'true'
        run: pnpm install --frozen-lockfile

      # Drift gate for the generated TS API client (orval reads the committed
      # openapi/openapi.json snapshot — Node-only, no JDK/server boot). We
      # deliberately do NOT auto-commit the regenerated artifacts back to the PR
      # branch: any push made with the workflow's GITHUB_TOKEN suppresses the
      # `pull_request: synchronize` events for subsequent pushes on the same
      # branch (GitHub's recursive-workflow protection), which leaves the PR's
      # `required` check forever unsatisfied. Developers regenerate locally and
      # commit the result.
      #
      # Each web check below is its OWN step gated on `${{ !cancelled() }}` so a
      # red in one (e.g. lint) does NOT skip the later independent checks
      # (format / test / build) — one run reports every web red at once. (The
      # leading detect-gate `&& steps.detect.outputs.web == 'true'` keeps them
      # no-ops when there is no web subdir.)
      - name: Check generated API client is up to date
        if: ${{ !cancelled() && steps.detect.outputs.web == 'true' }}
        working-directory: alpenflight/web
        run: |
          pnpm run generate-api
          if git diff --quiet src/app/api/generated/; then
            echo "Generated API client is up to date."
            exit 0
          fi
          echo "::error::Generated API client is stale. Run 'pnpm run generate-api' in alpenflight/web/ and commit the result."
          git --no-pager diff --stat src/app/api/generated/
          exit 1

      - name: Lint alpenflight/web
        if: ${{ !cancelled() && steps.detect.outputs.web == 'true' }}
        working-directory: alpenflight/web
        run: pnpm lint

      - name: Check formatting alpenflight/web
        if: ${{ !cancelled() && steps.detect.outputs.web == 'true' }}
        working-directory: alpenflight/web
        run: pnpm format

      - name: Test alpenflight/web
        if: ${{ !cancelled() && steps.detect.outputs.web == 'true' }}
        working-directory: alpenflight/web
        run: pnpm test

      - name: Build alpenflight/web
        if: ${{ !cancelled() && steps.detect.outputs.web == 'true' }}
        working-directory: alpenflight/web
        run: pnpm build:prod

  # ---------------------------------------------------------------------------
  # Keycloak realm shape check (S-019). Cheap jq guard over
  # alpenflight/auth/realm-export.json: PKCE-S256, bearer-only, no private key,
  # seed users + clubId, ADR 0007 token policy. Reuses `changes.outputs.next`
  # because the realm-export lives under alpenflight/auth/.
  # ---------------------------------------------------------------------------
  next-auth-realm-shape:
    name: alpenflight auth realm shape
    needs: changes
    if: needs.changes.outputs.next == 'true' && needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: Realm-export shape guard
        if: hashFiles('alpenflight/auth/realm-export.json') != ''
        run: bash alpenflight/auth/scripts/check-realm-shape.sh

  # ---------------------------------------------------------------------------
  # alpenflight-proof — the per-push real-chain verticality proof (clean-seed)
  # (S-062g, S-110).
  #
  # Brings up the real stack — Postgres + Keycloak + Mailpit + the alpenflight
  # backend + `ng serve --configuration=development` — applies a CLEAN Flyway
  # seed (NO legacy-up / NO MSSQL / NO migrate; the legacy→migrate half is
  # DEFERRED to J-0b), then runs ONE real-idp spec against the real backend —
  # the JOURNEY-UNDER-WORK's spec (derived in the `changes` job; see
  # `proof_spec`). This is the run that proves verticality (real Keycloak JWT →
  # @TenantId filter → Postgres) for the journey currently in flight.
  #
  # PROOF-SCOPING — two riders, one mechanism.
  # ----------------------------------------------------------------------------
  # This job used to ALSO run the J-1 aircraft + J-2 flight migration-parity
  # specs. The known J-1 `aircraft-migration-parity.spec.ts` cross-process flake
  # then intermittently RED-ed the per-push `required` gate on journeys that
  # touch no aircraft at all (e.g. J-4 /profile).
  #
  #   • J-4 T-21+T-22 (operator Q1 2026-06-05): the aircraft + flight parity
  #     specs MOVED to the nightly real-idp suite (`alpenflight-e2e-real-idp.yml`,
  #     full `--project=real-idp` run), and this job was temporarily DROPPED from
  #     the `required` aggregator's `needs` to stop the flake red-ing unrelated
  #     journeys.
  #   • J-5 T-14 (J-3 retro): the per-push spec is DERIVED off the integration
  #     branch name, so during a journey's build-up this runs THAT journey's
  #     real-idp spec only — not a fixed prior journey's, and not all of them.
  #   • J-5 T-19 (operator decision 2026-06-06): with the proof now scoped to the
  #     journey-under-work's OWN spec (T-14) and the aircraft flake fixed (T-15),
  #     this job is BACK in the `required` aggregator's `needs` — a red real-idp
  #     run for the journey in flight BLOCKS merge again (see `required` below).
  #     A `parity_test:` that is NOT a clean-seed real-idp spec — a showcase
  #     `tests/profile/` spec (J-4, own gating job), a mock-auth-only spec, or a
  #     non-integration branch — falls back to the journey-agnostic J-0 Locations
  #     baseline (`proof_is_baseline`), so the J-0 proof gallery + the per-PR
  #     preview live-link-check (which greps for the J-0 Locations captions) keep
  #     working on the baseline path, AND `alpenflight-dashboard-proof` can still
  #     chain after it. (J-5 itself derives its real-idp
  #     `reservations-migration-parity.spec.ts`, is_baseline=false.)
  #
  # The FULL cross-journey regression runs NIGHTLY (`alpenflight-e2e-real-idp.yml`,
  # full `--project=real-idp`) + once at the §4 do-ship gate (e2e-driver's full
  # chain) — never on every push. This per-push job stays a SINGLE spec (plus its
  # `real-idp-setup` dependency, which Playwright runs automatically) to hold the
  # ~8-min PR budget. Lives INSIDE ci.yml (not the nightly workflow) so it can
  # build the same proof gallery the other in-repo proof jobs do.
  #
  # The `real-idp` project's `video: 'on'` (playwright.config.ts) retains the
  # pass-video; the upload step archives it as J-0's acceptance artifact.
  # ---------------------------------------------------------------------------
  alpenflight-proof:
    name: alpenflight proof (real-idp, clean-seed)
    needs: changes
    if: needs.changes.outputs.next == 'true' && needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    # `contents: write` lets the gh-pages deploy steps push the proof gallery
    # to the gh-pages branch (mirrors alpenflight-e2e.yml). Without it the
    # deploy fails with 403; the rest of the job needs read.
    # `pull-requests: write` (J-25) lets the preview step post/update the
    # sticky PR comment carrying the per-branch preview URL.
    permissions:
      contents: write
      pull-requests: write
    env:
      E2E_REAL_IDP: '1'
    steps:
      - uses: actions/checkout@v4

      # Cross-project shared network (S-172). Create explicitly first so the
      # bring-up scripts' inspect-first diag message isn't ambiguous on a
      # clean runner.
      - name: Create alpenflight_shared network
        run: docker network create alpenflight_shared --driver bridge

      # Registry-pull retry (J-25 T-05): the three docker steps below touch
      # external registries (quay.io for Keycloak, registry-1.docker.io for
      # mailpit/postgres/pgadmin) and fail red on transient 5xx/timeout blips
      # (observed: quay.io 502 + docker.io timeout → manual reruns). Each is
      # wrapped in a bounded 3-attempt retry with 15s backoff. A genuinely
      # persistent failure still exits non-zero after the 3rd attempt (the
      # `exit 1` after the loop), so real breakage stays red — only transient
      # blips self-heal. The retry is scoped to image-pull/build/up ONLY; the
      # test/gallery/deploy steps are deliberately NOT retried (a flaky spec
      # must not be silently retried into green — different policy).
      - name: Bring up alpenflight-infra (mailpit)
        run: |
          for i in 1 2 3; do
            bash alpenflight/ops/dev-up-infra.sh && exit 0
            echo "attempt $i failed (registry blip?) — retrying in 15s" >&2
            sleep 15
          done
          echo "::error::alpenflight-infra bring-up failed after 3 attempts" >&2
          exit 1

      - name: Build pgAdmin + Keycloak images
        run: |
          for i in 1 2 3; do
            docker compose -f docker-compose.yml --profile next build pgadmin keycloak && exit 0
            echo "attempt $i failed (registry blip?) — retrying in 15s" >&2
            sleep 15
          done
          echo "::error::pgAdmin + Keycloak image build failed after 3 attempts" >&2
          exit 1

      # Clean seed: Postgres + Keycloak only. No MSSQL / legacy-up / migrate
      # (deferred to J-0b — see the J-0 journey file).
      - name: Bring up alpenflight-dev (postgres + pgadmin + keycloak)
        run: |
          for i in 1 2 3; do
            docker compose -p alpenflight-dev -f docker-compose.yml \
              up -d --wait --wait-timeout 240 postgres pgadmin keycloak && exit 0
            echo "attempt $i failed (registry blip?) — retrying in 15s" >&2
            sleep 15
          done
          echo "::error::alpenflight-dev bring-up failed after 3 attempts" >&2
          exit 1

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version-file: alpenflight/web/.nvmrc

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11
          run_install: false

      - name: Restore pnpm store cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('alpenflight/web/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install alpenflight/web deps
        working-directory: alpenflight/web
        env:
          CI: 'true'
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('alpenflight/web/pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright browser + deps
        working-directory: alpenflight/web
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = 'true' ]; then
            pnpm exec playwright install-deps chromium
          else
            pnpm exec playwright install --with-deps chromium
          fi

      # Apply Flyway migrations against the target Postgres so the alpenflight
      # backend has the (clean-seeded) schema it expects at boot.
      - name: Flyway migrate (alpenflight Postgres)
        working-directory: alpenflight/server
        run: |
          DATASOURCE_URL=jdbc:postgresql://localhost:5432/alpenflight \
          DATASOURCE_USER=alpenflight \
          DATASOURCE_PASSWORD=alpenflight \
          ./gradlew flywayMigrate --no-daemon --console=plain --quiet

      - name: Build alpenflight backend bootJar
        working-directory: alpenflight/server
        run: ./gradlew bootJar --no-daemon --console=plain --quiet

      - name: Start alpenflight backend
        working-directory: alpenflight/server
        env:
          DATASOURCE_URL: jdbc:postgresql://localhost:5432/alpenflight
          DATASOURCE_USER: alpenflight
          DATASOURCE_PASSWORD: alpenflight
          SPRING_PROFILES_ACTIVE: dev
          # Pin log level so payload logging can't leak the canned dev
          # password into the uploaded backend.log artifact.
          LOGGING_LEVEL_ROOT: INFO
          # Matches alpenflight-proof-fanout.yml's T-17 (host bootJar ↔
          # host-mapped Keycloak). The backend runs as a HOST bootJar but
          # Keycloak is a container host-published at localhost:8090 (compose
          # `127.0.0.1:8090:8080`), so the compose-internal `http://keycloak:8080`
          # is unresolvable from the host. The `dev` profile already redirects
          # JWKS + issuer to localhost:8090, but `keycloak.admin.base-url`
          # (application.yml) still defaults to `http://keycloak:8080` — latent
          # until J-1's migration provisioning first exercises the admin client
          # at ingest. Point the admin-base at the host port so the
          # migration-provisioning admin client can reach Keycloak.
          ALPENFLIGHT_KC_ADMIN_BASE_URL: http://localhost:8090
          ALPENFLIGHT_KC_ADMIN_REALM: alpenflight
          ALPENFLIGHT_KC_ADMIN_CLIENT_ID: alpenflight-backend-admin
          ALPENFLIGHT_KC_ADMIN_CLIENT_SECRET: alpenflight-backend-admin-dev-secret
          ALPENFLIGHT_OIDC_ISSUER_URI: http://localhost:8090/realms/alpenflight
        run: |
          # bootJar archiveBaseName = rootProject.name ("alpenflight-server"),
          # not "server" — and the plain `jar` task also emits a non-executable
          # *-plain.jar. Resolve the executable boot jar by excluding -plain.
          JAR="$(ls build/libs/*.jar | grep -v -- '-plain.jar' | head -1)"
          echo "Starting backend from: $JAR"
          nohup java -jar "$JAR" > backend.log 2>&1 &
          echo "$!" > backend.pid

      - name: Wait for backend /actuator/health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/actuator/health >/dev/null 2>&1; then
              echo "backend ready (attempt $i)"
              exit 0
            fi
            sleep 2
          done
          echo "backend not ready after 120s" >&2
          tail -n 200 alpenflight/server/backend.log >&2 || true
          exit 1

      # The JOURNEY-UNDER-WORK's real-idp proof spec (its `real-idp-setup`
      # dependency runs automatically) — a SINGLE spec, NOT the full real-idp
      # suite, and NOT every prior journey's spec.
      #
      # PROOF-SCOPING — two riders, one mechanism:
      #   • J-4 T-21+T-22 (operator Q1 2026-06-05): the J-1 aircraft / J-2 flight
      #     migration-parity specs MOVED to the nightly real-idp suite
      #     (`alpenflight-e2e-real-idp.yml`'s full `--project=real-idp` run) — the
      #     known `aircraft-migration-parity.spec.ts` flake intermittently red-ed
      #     the per-push `required` gate on journeys touching no aircraft.
      #   • J-5 T-14 (J-3 retro): the per-push spec is now DERIVED off the
      #     integration branch (`changes` job → `proof_spec`), so during a
      #     journey's build-up this runs THAT journey's real-idp spec, not a
      #     fixed prior journey's. A `parity_test:` that is NOT a clean-seed
      #     real-idp spec (a showcase `tests/profile/` spec — J-4, own gating job;
      #     a mock-auth-only spec) or a non-integration branch falls back to the
      #     stable J-0 Locations baseline (`proof_is_baseline`), so this job still
      #     proves the real Keycloak→@TenantId→Postgres vertical and emits the J-0
      #     captions the per-PR preview live-link-check greps for. J-5 itself
      #     derives its real-idp `reservations-migration-parity.spec.ts`
      #     (is_baseline=false). The full cross-journey regression runs NIGHTLY
      #     (the real-idp workflow) + at the §4 do-ship gate (e2e-driver's full
      #     chain) — deliberately NOT on every push.
      #   • J-5 T-19 (operator decision 2026-06-06): this single-spec run now GATES
      #     `required` again — a failed Playwright assertion here exits the step
      #     non-zero (`set -euo pipefail`; no `|| true`/continue-on-error/always()
      #     on THIS step) → the job fails → `needs.alpenflight-proof.result` is
      #     `failure` → the aggregator reds. The fail-soft maintainability +
      #     gallery steps run AFTER and cannot mask this step's failure.
      #
      # Single spec → single proof-manifest → the gallery still publishes one
      # proof video per push.
      - name: Run real-idp proof spec (journey-under-work)
        id: pw
        working-directory: alpenflight/web
        timeout-minutes: 15
        env:
          DATASOURCE_URL: jdbc:postgresql://localhost:5432/alpenflight
          DATASOURCE_USER: alpenflight
          DATASOURCE_PASSWORD: alpenflight
          PROOF_SPEC: ${{ needs.changes.outputs.proof_spec }}
          PROOF_JOURNEY: ${{ needs.changes.outputs.proof_journey }}
        run: |
          set -euo pipefail
          # Fail-safe: an empty PROOF_SPEC (output unexpectedly missing) must NOT
          # become a no-spec run that Playwright would treat as "run everything"
          # — pin the J-0 baseline.
          SPEC="${PROOF_SPEC:-e2e/tests/real-idp/locations-crud-tenant-isolation.spec.ts}"
          if [ -z "$SPEC" ]; then
            SPEC='e2e/tests/real-idp/locations-crud-tenant-isolation.spec.ts'
          fi
          echo "running per-push proof spec for ${PROOF_JOURNEY:-?}: ${SPEC}"
          # --workers=1: real-idp must run serial (one realm + one Mailpit inbox);
          # `workers` is top-level-only so the project's per-project value is a no-op
          # and would otherwise inherit the top-level CI count.
          pnpm exec playwright test \
            --config=e2e/playwright.config.ts \
            --project=real-idp \
            --workers=1 \
            "$SPEC"

      # J-26 T-25 — upload the per-test failure artifacts (error-context.md +
      # trace.zip + the failure screenshot/video) BEFORE any later step mutates
      # `test-results/`. The shots-present guard step below re-invokes Playwright
      # (`--project=proof-gallery-links`), and Playwright CLEANS its output dir at
      # the start of a run, deleting THIS spec's per-test artifacts — so by the
      # time the always()-uploaded proof artifact runs (further down) the DOM
      # snapshot + trace are already gone (only `proof-manifest.json` survives,
      # which the gallery generator also reads). That left J-7 T-19's
      # tenant-isolation + reservation reds undiagnosable from the run, forcing
      # source+log+architecture reasoning. This step is gated on `failure()` so it
      # only fires on a red run, and placed RIGHT AFTER the proof spec (before the
      # maintainability / screenshot-staging / gallery / guard steps) so the
      # artifacts are captured intact. Playwright writes per-test dirs to
      # `alpenflight/web/test-results/<test>/` (NOT under `e2e/` — config has no
      # `outputDir`, but the reporter pins the manifest there and the per-test
      # output co-locates; verified empirically).
      - name: Upload Playwright test-results on failure (pre-gallery)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results-alpenflight-proof-${{ github.run_id }}
          path: alpenflight/web/test-results/**
          retention-days: 7
          if-no-files-found: warn

      # J-5 T-12 — emit the per-journey Maintainability reports the T-13 gallery
      # panel renders. PRODUCE + STAGE only (T-13 reads these paths; no panel
      # HTML here). FAIL-SOFT: a missing/failed report is informational and must
      # NEVER red the proof gate (continue-on-error + `|| true` guards inside).
      # Stable artifact paths consumed by the gallery deploy:
      #   FE (fallow, journey delta): public/alpenflight/proof/maintainability/fallow-audit.json
      #   FE (fallow, repo snapshot): public/alpenflight/proof/maintainability/fallow-health.json
      #   BE (PMD):                   public/alpenflight/proof/maintainability/pmd-main.xml
      #   BE (CPD):                   public/alpenflight/proof/maintainability/cpd-check.xml
      # Placed BEFORE the gallery generate step so the JSON/XML are on disk under
      # the gallery's --out root when T-13's generator scans for them, and so the
      # always()-uploaded proof artifact carries them too.
      - name: Emit maintainability reports (fail-soft)
        id: maintainability
        if: always()
        continue-on-error: true
        run: |
          set +e
          OUT="public/alpenflight/proof/maintainability"
          mkdir -p "$OUT"
          # --- Frontend (fallow) ---------------------------------------------
          # audit = changed-files envelope (this journey's diff vs main):
          # per-finding `introduced: true/false` attribution = the journey delta.
          # Needs the base ref present (checkout is shallow) — fetch it best-effort.
          git fetch --no-tags --depth=200 origin main:refs/remotes/origin/main 2>/dev/null || true
          (
            cd alpenflight/web
            # audit exits non-zero on a fail/warn verdict — capture JSON regardless.
            npx --yes fallow@latest audit --base origin/main --format json \
              > ../../"$OUT"/fallow-audit.json 2>/dev/null || true
            # health snapshot (overall grade/MI/dup/dead-code for the repo).
            npx --yes fallow@latest health --format json \
              > ../../"$OUT"/fallow-health.json 2>/dev/null || true
          )
          # --- Backend (PMD/CPD from T-11) -----------------------------------
          (
            cd alpenflight/server
            ./gradlew :pmdMain :cpdCheck --no-daemon --console=plain --quiet || true
          )
          cp -f alpenflight/server/build/reports/pmd/main.xml "$OUT"/pmd-main.xml 2>/dev/null || true
          cp -f alpenflight/server/build/reports/cpd/cpdCheck.xml "$OUT"/cpd-check.xml 2>/dev/null || true
          echo "── staged maintainability reports ──" >&2
          ls -l "$OUT" >&2 || true
          exit 0

      # J-6 T-17b — stage the PER-PUSH parity screenshots: PAIR the COMMITTED
      # legacy-reference PNGs (`e2e/legacy-reference/<feature>/<view>.png`, made
      # once + in git per T-17a — legacy flsweb is frozen) against the FRESH
      # clean-seed AlpenFlight PNGs this run's proof spec just wrote to
      # test-results/. This gives the per-push per-journey page its full
      # legacy↔AlpenFlight visual pairing WITHOUT any dependency on the heavy
      # nightly fanout — closing the "videos OR screenshots, depending on which
      # job deployed last" pain (operator design, 2026-06-07).
      #
      # The view keys (`list`/`form`/`setup`) + journey id MUST match the
      # fanout's J-6 declarations (alpenflight-proof-fanout.yml ~L1024-1035) so
      # the per-push page reads identically to the nightly page. AF filenames
      # differ per view (`setup` → `…-setup-form.png`); the per-journey block
      # below maps them.
      #
      # `if: always()` so a red proof assertion still stages whatever PNGs the
      # spec wrote BEFORE its deep assertions — the gate signal is `steps.pw`,
      # not the gallery. A missing legacy ref OR a missing AF PNG simply DROPS
      # that one entry (add_pair no-ops it) so the page degrades gracefully —
      # never a declared-but-absent PNG that would red the AC5 link-check.
      - name: Stage per-push parity screenshots (committed-legacy + fresh-AF)
        if: always()
        env:
          PROOF_JOURNEY: ${{ needs.changes.outputs.proof_journey }}
        run: |
          SHOT="${{ github.workspace }}/perpush-screenshots"
          mkdir -p "$SHOT"
          REF_DIR="alpenflight/web/e2e/legacy-reference"
          AF_RESULTS="alpenflight/web/test-results"
          SHOTS=""
          # add_pair: stage the committed legacy ref + the fresh AF PNG for ONE
          # view, declaring both sides under the same journey/view so the
          # generator pairs them. $1 journey $2 feature $3 view $4 legacy-ref
          # filename $5 AF filename $6 legacy-caption $7 AF-caption.
          add_pair() {
            local jrn="$1" feat="$2" view="$3" lref="$4" affile="$5" lcap="$6" acap="$7"
            local lsrc="$REF_DIR/$feat/$lref"
            local asrc; asrc="$(find "$AF_RESULTS" -name "$affile" 2>/dev/null | head -1 || true)"
            if [ -f "$lsrc" ]; then
              cp "$lsrc" "$SHOT/legacy-${feat}-${view}.png"
              SHOTS="$SHOTS{\"journey\":\"$jrn\",\"side\":\"legacy\",\"view\":\"$view\",\"file\":\"legacy-${feat}-${view}.png\",\"caption\":$(node -e 'process.stdout.write(JSON.stringify(process.argv[1]))' "$lcap")},"
            else
              echo "legacy ref $lsrc absent — skipping legacy ${feat}/${view}."
            fi
            if [ -n "$asrc" ]; then
              cp "$asrc" "$SHOT/$affile"
              SHOTS="$SHOTS{\"journey\":\"$jrn\",\"side\":\"alpenflight\",\"view\":\"$view\",\"file\":\"$affile\",\"caption\":$(node -e 'process.stdout.write(JSON.stringify(process.argv[1]))' "$acap")},"
            else
              echo "AF PNG $affile not found under $AF_RESULTS — skipping alpenflight ${feat}/${view} (spec likely red before capture)."
            fi
          }
          # add_af_only: stage just the FRESH AF PNG for ONE view with NO legacy
          # pairing — used for GREENFIELD screens (no legacy parity, e.g. the
          # J-6b reservations Day/Week calendar). The generator renders a single
          # AlpenFlight figure (the other pairing slot is simply absent).
          # $1 journey $2 feature $3 view $4 AF filename $5 AF-caption.
          add_af_only() {
            local jrn="$1" feat="$2" view="$3" affile="$4" acap="$5"
            local asrc; asrc="$(find "$AF_RESULTS" -name "$affile" 2>/dev/null | head -1 || true)"
            if [ -n "$asrc" ]; then
              cp "$asrc" "$SHOT/$affile"
              SHOTS="$SHOTS{\"journey\":\"$jrn\",\"side\":\"alpenflight\",\"view\":\"$view\",\"file\":\"$affile\",\"caption\":$(node -e 'process.stdout.write(JSON.stringify(process.argv[1]))' "$acap")},"
            else
              echo "AF PNG $affile not found under $AF_RESULTS — skipping alpenflight ${feat}/${view} (spec likely red before capture)."
            fi
          }
          # ----- J-6 planning (list/form/setup — view keys match the fanout) ---
          if [ "${PROOF_JOURNEY:-}" = "J-6" ]; then
            add_pair "J-6" "planning" "list" "list.png" "alpenflight-planning-list.png" \
              "Legacy flsweb: the seeded future-days list (Date · Weekday · Location · Remarks · Towing pilot · Flight operator · Instructor · #Reservations) — the legacy planning table, paired before/after against AlpenFlight's /planning future-days list" \
              "AlpenFlight: the /planning future-days list (date · weekday · location · remarks · the 3 crew display names · reservation count, weekend rows flagged) — the clean-seed future-days list to eyeball against the legacy planning table"
            add_pair "J-6" "planning" "form" "form.png" "alpenflight-planning-form.png" \
              "Legacy flsweb: one planning day's edit form (date · location selectize · remarks · towing-pilot / flight-operator / instructor selectizes · the inline per-day reservations table) — paired against AlpenFlight's planning-day edit form" \
              "AlpenFlight: the planning-day edit form, fully populated (date · location · instructor / tow-pilot / flight-operator pickers · remarks) — the planning-day field set to eyeball side-by-side against the legacy edit form"
            add_pair "J-6" "planning" "setup" "setup.png" "alpenflight-planning-setup-form.png" \
              "Legacy flsweb: the /planningsetup wizard (start/end date range · seven weekday checkboxes · location selectize · Generate Planning Days) — paired against AlpenFlight's /planningsetup setup wizard" \
              "AlpenFlight: the /planningsetup wizard, populated (start/end range · Sat+Sun weekday filter · location) — the bulk-create wizard to eyeball against the legacy /planningsetup form"
          fi
          # ----- J-6b reservations & planning hardening + inline validation ----
          # The Day/Week CALENDAR is GREENFIELD (no legacy parity per the oracle)
          # → AlpenFlight-only shots. The edit FORMS pair against legacy where a
          # committed legacy ref exists (planning form ref is committed; the
          # reservation form + inline-validation refs are captured at T-17 — until
          # then add_pair degrades to the AF side only). Filenames must match the
          # PNGs the J-6b proof spec writes to test-results/.
          if [ "${PROOF_JOURNEY:-}" = "J-6b" ]; then
            add_af_only "J-6b" "reservations" "calendar-day" \
              "alpenflight-reservations-calendar-day.png" \
              "AlpenFlight (greenfield, no legacy parity): the /reservations DAY view — the aircraft×hour calendar with the Day/Week toggle (selected button legible) + a DD.MM.YYYY period label"
            add_af_only "J-6b" "reservations" "calendar-week" \
              "alpenflight-reservations-calendar-week.png" \
              "AlpenFlight (greenfield, no legacy parity): the /reservations WEEK view — the aircraft×day matrix, paging by weeks with a DD.MM.YYYY – DD.MM.YYYY range label"
            add_pair "J-6b" "planning" "form" "form.png" "alpenflight-planning-edit-form.png" \
              "Legacy flsweb: one planning day's edit form (date · location · remarks · crew selectizes · the inline per-day reservations table)" \
              "AlpenFlight: the planning-day edit form hardened — read-only renders all fields disabled with an Edit toggle, dates render DD.MM.YYYY, and inline validation surfaces per-field errors while typing"
            # The ≥60% feature — inline validation — as an AF-only state shot
            # (greenfield UX; legacy flsweb has no while-typing inline validation
            # to pair against). The PNG the proof spec writes at the inline-validate
            # assertion (reservations-planning-hardening.spec.ts ~L640).
            add_af_only "J-6b" "planning" "inline-validate" \
              "alpenflight-planning-inline-validate.png" \
              "AlpenFlight (greenfield): the planning-day edit form mid-typing — the debounced inline per-field validation message surfaces under the field from the real validate endpoint (no full submit)"
            # NOTE: the reservation-edit-form parity shot is DEFERRED (J-6b T-20):
            # the reservation real-idp seeding is heavier (aircraft/type/pilot
            # picker chain) and the planning inline-validate above already proves
            # the FE→real-endpoint→real-rule→inline vertical. The proof spec does
            # NOT write `alpenflight-reservation-edit-form.png`, so NO `add_pair`
            # for it here — the page must never advertise a shot the run can't
            # produce (would render a lone legacy figure / a dead pairing slot).
          fi
          # ----- J-7 flight reports (picker/result/custom — view keys match the
          # legacy-reference dir + the fanout) -------------------------------
          # Read-side reporting journey: the three views the per-journey page
          # pairs are picker / result / custom (matching
          # e2e/legacy-reference/reporting/PENDING.md + expected-shots.json J-7).
          # The legacy `reporting/{picker,result,custom}.png` refs are DEFERRED
          # (legacy stack unrunnable on the Alpine/musl box → captured at the
          # fanout, PENDING.md) so add_pair degrades to the AF side; and the AF
          # parity PNGs are written once T-15 thickens flight-reports-parity.spec.ts
          # (today the real-idp spec emits only proofVideos). Until both land, this
          # block stages whatever exists; the `[shots-present]` guard below treats
          # all six J-7 views as `pending` (tolerated) per the contract, so nothing
          # reds prematurely — T-15 flips the AF three to `expected`. The DECLARATION
          # exists NOW so a future missing-shot reds instead of silently passing.
          if [ "${PROOF_JOURNEY:-}" = "J-7" ]; then
            add_pair "J-7" "reporting" "picker" "picker.png" "alpenflight-flightreports-picker.png" \
              "Legacy flsweb: the /flightreports picker - the person + location canned-report tile grid" \
              "AlpenFlight: the /flightreports picker - person + location category tiles linking to each canned report"
            add_pair "J-7" "reporting" "result" "result.png" "alpenflight-flightreports-result.png" \
              "Legacy flsweb: a canned report's results - the filter-criteria panel + grouped summary + flights table" \
              "AlpenFlight: a canned report's results page - derived filter panel, grouped summary (corrected TotalFlights), and the flights table with nested tow rows"
            add_pair "J-7" "reporting" "custom" "custom.png" "alpenflight-flightreports-custom.png" \
              "Legacy flsweb: the custom-report builder - date range + flight-type toggles + person/location selector" \
              "AlpenFlight: the custom-report builder form - From/To date range, Glider/Motor/Tow toggles, conditional person/location selector, as-you-type validation"
          fi
          # ----- J-8 accounting rule filters (list/form — view keys match the
          # fanout + expected-shots.json J-8) --------------------------------
          # MIGRATION journey, but PER-CONTEXT producing (J-7 T-16 pattern, T-21):
          # only the AlpenFlight halves are produced in the PER-PUSH proof context.
          # The clean-seed real chain `accounting-rules-parity.spec.ts` runs HERE
          # (the alpenflight-proof real-idp specs) and writes
          # alpenflight-accountingrules-{list,form}.png to test-results/. The LEGACY
          # halves are producible ONLY in the fanout (the flsweb stack runs there),
          # so expected-shots.json tags legacy:list/form `producedBy: fanout` →
          # tolerated-absent in this `proof` context. Hence add_af_only (not
          # add_pair): we stage only the two AF halves the per-push run produces; the
          # legacy peer is rendered in the fanout page (and from the committed
          # capture-once refs). The view keys (list/form) + AF filenames match the
          # fanout's J-8 add_shot declarations (alpenflight-proof-fanout.yml ~L1196)
          # so the per-push page reads identically to the nightly page's AF column.
          if [ "${PROOF_JOURNEY:-}" = "J-8" ]; then
            add_af_only "J-8" "accounting" "list" \
              "alpenflight-accountingrules-list.png" \
              "AlpenFlight: the /accountingrules list — a created article-target rule renders with its server-derived target column (articleNumber + deliveryLineText), the rule-filter table to eyeball against the legacy ng-table (legacy peer in the fanout page)"
            add_af_only "J-8" "accounting" "form" \
              "alpenflight-accountingrules-form.png" \
              "AlpenFlight: the /accountingrules edit form reopened over the real chain — every field round-trips (RuleFilterName · Description · the glider + stop-rule-engine flags · the article-target ArticleNumber + the filter_config-stored DeliveryLineText), the filter-type-driven edit form to eyeball against the legacy form (legacy peer in the fanout page)"
          fi
          # ----- J-26 hardening (membership / duplicate-code — AF-only) --------
          # Hardening sprint: no new screen, no legacy parity peer (the shots are
          # AlpenFlight-only hardening evidence). The view keys (membership,
          # duplicate-code) match expected-shots.json J-26; the AF filenames match
          # the PNGs the real-idp hardening-J26.spec.ts writes to test-results/
          # BEFORE its deep assertions (so a partial red still stages them).
          if [ "${PROOF_JOURNEY:-}" = "J-26" ]; then
            add_af_only "J-26" "hardening" "membership" \
              "alpenflight-hardening-membership.png" \
              "AlpenFlight (hardening, T-04): a Person's membership edit re-opened after Save over the real chain — memberNumber, the toggled pilot-role flag and the changed member state all came back from the real backend (the data-loss fix: the form used to toast success while silently dropping them)"
            add_af_only "J-26" "hardening" "duplicate-code" \
              "alpenflight-hardening-duplicate-code.png" \
              "AlpenFlight (hardening, T-05): creating a second flight type with a duplicate FlightCode over the real chain — the real ux_flight_type_club_code constraint / service pre-check returns a 409 that surfaces INLINE on the Code field (previously a raw 500 reproducing the legacy bug, or a mislabel onto the name field)"
          fi
          # ----- J-2b flights hardening (#229 — AF-only) -----------------------
          # Hardening sprint: no new screen, no committed legacy /flights ref (the
          # J-2 legacy shots live in the fanout). The view keys (list, form) match
          # expected-shots.json J-2b; the AF filenames match the PNGs the real-idp
          # flight-migration-parity.spec.ts hardening block writes to test-results/
          # on the state that RENDERS the asserted result (the list with the
          # off-today affordance + real rows; the form reopened with every
          # populated required field VALID).
          if [ "${PROOF_JOURNEY:-}" = "J-2b" ]; then
            add_af_only "J-2b" "flights" "list" \
              "alpenflight-flights-hardening-list.png" \
              "AlpenFlight (#229): the /flights logbook on the today-default range (legacy parity) with real glider rows + the post-save 'View it →' affordance for a flight saved outside the range — off-today flights are surfaced, not silently hidden"
            add_af_only "J-2b" "flights" "form" \
              "alpenflight-flights-hardening-form.png" \
              "AlpenFlight (#229b): a fully-populated saved flight re-opened over the real chain — every populated required field (date · start type · start location) renders VALID, no stale 'Entry required.' (the root fix: the edit form had ZERO client validators; they are now wired + revalidate against the loaded values)"
          fi
          if [ -n "$SHOTS" ]; then
            printf '{ "screenshots": [ %s ] }' "${SHOTS%,}" \
              | node -e 'const fs=require("fs");let s="";process.stdin.on("data",d=>s+=d).on("end",()=>fs.writeFileSync(process.argv[1],JSON.stringify(JSON.parse(s),null,2)))' "$SHOT/screenshots.json"
            echo "Staged per-push parity screenshots + sidecar:"
            ls -l "$SHOT/"
            cat "$SHOT/screenshots.json"
          else
            echo "No per-push parity pairs staged for ${PROOF_JOURNEY:-?} — gallery renders videos only."
          fi

      # J-24 — build + link-check the proof gallery from the run's manifest +
      # videos (test-results/). `always()` so it runs even when the spec is red;
      # on red there are no proof videos so it emits only pending rows. The
      # generator exits non-zero on a missing caption / missing .webm (AC5
      # link-check) — that MUST fail the job, so no `|| true` swallow here.
      - name: Build + link-check proof gallery
        id: gallery
        if: always()
        working-directory: alpenflight/web
        env:
          # T-14 — the journey-under-work id (derived in the `changes` job's
          # `proof_spec` step off the integration branch). Passed EXPLICITLY so
          # the per-journey Maintainability panel renders THIS journey's FE
          # fallow-audit DELTA (not just the repo snapshot): on a PR push
          # GITHUB_REF_NAME is the merge ref (`<pr>/merge`), so the generator's
          # branch-name fallback can't derive the journey — the panel would
          # degrade to "snapshot only". Empty on a non-integration branch (the
          # changes job emits the J-0 baseline journey then) — harmless, that
          # page has no audit delta to show anyway.
          PROOF_JOURNEY: ${{ needs.changes.outputs.proof_journey }}
          # J-26 T-32 — a BASELINE run (the journey's own real-idp spec is not
          # yet thickened → `proof_is_baseline=true`, the J-0 Locations spec
          # actually ran) must produce a BASELINE-shaped gallery: drop
          # --journey-under-work so the deployed preview carries the J-0 page +
          # its 3 captions (the `Live link-check … (200 + captions)` step below,
          # gated on is_baseline==true, greps for exactly those). Passing
          # --journey-under-work here built the EMPTY journey page instead, so
          # the J-0 captions were absent → that step red. When the real spec
          # lands (is_baseline flips false), JUW returns and the J-26 page +
          # its Maintainability delta render again.
          PROOF_IS_BASELINE: ${{ needs.changes.outputs.proof_is_baseline }}
        run: |
          JUW_ARG=""
          if [ -n "${PROOF_JOURNEY:-}" ] && [ "${PROOF_IS_BASELINE:-}" != "true" ]; then
            JUW_ARG="--journey-under-work ${PROOF_JOURNEY}"
          fi
          # T-17b — per-push parity screenshots: feed the staged screenshots.json
          # dir (committed-legacy + fresh-AF, paired by view) so the generator
          # renders the legacy↔AlpenFlight `shot-pair`/`shot-grid` block on the
          # per-journey page — same rendering the fanout page uses, but sourced
          # per-push with no fanout dependency. Absent dir/sidecar = no-op.
          SHOT="${{ github.workspace }}/perpush-screenshots"
          SHOT_ARG=""
          if [ -f "$SHOT/screenshots.json" ]; then
            SHOT_ARG="--screenshots $SHOT"
          fi
          node e2e/proof-gallery/generate-gallery.mjs \
            --report test-results/proof-manifest.json \
            --out ../../public/alpenflight/proof \
            --order ../../docs/modernization/stories/_ORDER.md \
            $JUW_ARG \
            $SHOT_ARG

      # J-7 T-12 — SHOTS-PRESENT pre-deploy guard (operator grill, J-5/J-6 retro).
      # add_shot/add_pair silently DROP a missing PNG, so a partial-red capture
      # could ship a THIN per-journey page while the generator stays green. This
      # browserless guard reads the committed expected-shots.json + the staged
      # screenshots.json and FAILS if any `expected` <side>:<view> for the
      # journey-under-work is absent (a `pending`/deferred shot is tolerated +
      # surfaced). Runs BEFORE the deploy so a thin page never publishes. Gated on
      # a derivable journey-under-work + the gallery having built; `always()` so a
      # partial-red proof run is still guarded (the gate signal is `steps.pw`).
      # A journey with no expected-shots entry skips cleanly inside the spec.
      - name: Shots-present guard (journey-under-work, pre-deploy)
        if: ${{ always() && steps.gallery.outcome == 'success' && needs.changes.outputs.proof_journey != '' }}
        working-directory: alpenflight/web
        env:
          GALLERY_EXPECT_JOURNEY: ${{ needs.changes.outputs.proof_journey }}
          GALLERY_SHOTS_DIR: ${{ github.workspace }}/perpush-screenshots
          GALLERY_LINKS_ONLY: '1'
          # J-7 T-16 — this is the PER-PUSH proof context: it produces the
          # journey's AF parity shots (the real-idp/proof specs run here). The
          # guard enforces only the shots `producedBy: proof` (+ untagged shots)
          # so a read-side journey's proof-only AF shots are required HERE — where
          # they are actually produced — not in the fanout (which never runs them).
          GALLERY_PROOF_CONTEXT: proof
        run: |
          pnpm exec playwright test \
            --config=e2e/playwright.config.ts \
            --project=proof-gallery-links \
            --grep '\[shots-present\]'

      # J-25 — compute the per-PR preview destination + clickable URL.
      # PR-only. Sanitize github.head_ref (the PR source branch, e.g.
      # `integration/J-26`): replace `/` and any non-[A-Za-z0-9._-] char with
      # `-` (so `integration/J-26` → `integration-J-26`). Emit the gh-pages
      # subdir + the full GitHub Pages URL as step outputs for the preview
      # deploy + the sticky comment / step-summary to consume. The repo is
      # elekktrisch/fls → project Pages base is https://elekktrisch.github.io/fls/
      # (matches J-24's published /alpenflight/proof/ base).
      - name: Compute proof-preview destination
        id: preview
        if: ${{ github.event_name == 'pull_request' }}
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          # SANITIZE RULE — keep in sync with .github/workflows/proof-preview-reap.yml
          # (the reaper derives the identical subpath from github.head_ref; the two
          # sed expressions MUST stay byte-for-byte identical or the reaper deletes
          # the wrong subdir / misses the live one).
          sanitized="$(printf '%s' "$HEAD_REF" | sed -E 's#[^A-Za-z0-9._-]#-#g')"
          subdir="alpenflight/proof-preview/${sanitized}"
          url="https://elekktrisch.github.io/fls/${subdir}/"
          {
            echo "subdir=${subdir}"
            echo "url=${url}"
          } >> "$GITHUB_OUTPUT"
          echo "proof preview → ${url}"

      - name: Collect logs on failure
        if: failure()
        run: |
          echo "── backend log ─────────────────────────────" >&2
          tail -n 200 alpenflight/server/backend.log >&2 || true
          echo "── keycloak log ────────────────────────────" >&2
          docker compose -p alpenflight-dev -f docker-compose.yml logs --tail 200 keycloak >&2 || true
          echo "── mailpit log ─────────────────────────────" >&2
          docker compose -p alpenflight-infra -f docker-compose.yml --profile infra logs --tail 100 mailpit >&2 || true

      # The pass-video is J-0's acceptance artifact (`video: 'on'` on the
      # real-idp project). Uploaded on always() so the report is available on
      # red too, but on green it carries the proof video.
      - name: Upload proof artifact (incl. pass-video)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpenflight-proof-${{ github.run_id }}
          path: |
            alpenflight/web/playwright-report
            alpenflight/web/test-results
            alpenflight/web/screenshots
            alpenflight/server/backend.log
            public/alpenflight/proof
          retention-days: 14
          if-no-files-found: warn

      # Publish the proof gallery to gh-pages — main only (carve decision 2:
      # build + link-check every run above; publish on merge). Mirrors the
      # main-gated deploy in alpenflight-e2e.yml (keep_files: true so it
      # coexists with the e2e dashboard under /alpenflight/). Gated on the
      # generate step having SUCCEEDED (`steps.gallery.outcome == 'success'`),
      # not `always()`: a red run (spec failure OR an AC5 link-check failure)
      # must NOT re-push stale/broken proofs over the live gallery. The
      # generate step itself still runs on `always()` above so a red run still
      # fails the job — we only suppress the publish, not the gate.
      - name: Deploy proof gallery to gh-pages
        if: ${{ steps.gallery.outcome == 'success' && github.ref == 'refs/heads/main' }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: public
          publish_branch: gh-pages
          keep_files: true
          enable_jekyll: false
          commit_message: "alpenflight proof gallery: ${{ steps.pw.outcome }} for ${{ github.sha }}"

      # J-5 T-13b — after the canonical gallery (incl. T-13a's persistent
      # per-journey pages at alpenflight/proof/J-<n>/) lands on main, rebuild the
      # persistent JOURNEY index so the just-merged journey is listed as a live
      # row. The index sources J-0…J-N from the persistent canonical + fan-out
      # archive pages (no active branch needed on main). Fail-soft composite.
      - name: Rebuild persistent previews index (main)
        if: ${{ steps.gallery.outcome == 'success' && github.ref == 'refs/heads/main' }}
        uses: ./.github/actions/rebuild-previews-index
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      # J-25 — per-PR preview deploy. PR-only + gallery-success-gated (a red
      # run produces no valid gallery, so don't publish a broken preview).
      # Publishes the SAME generated gallery (public/alpenflight/proof) to a
      # per-branch subpath under gh-pages: alpenflight/proof-preview/<ref>/.
      # keep_files: true + the disjoint per-branch destination_dir mean this
      # NEVER touches the canonical /alpenflight/proof/ (main) or /alpenflight/
      # (e2e dashboard) — and a second branch's preview can't clobber this one.
      # Self-clobber on a branch's own rapid re-pushes is already prevented by
      # the workflow-level `concurrency: ci-${{ github.ref }}` (cancel-in-progress)
      # group, which cancels the prior run before its preview deploy lands; a
      # job-level group keyed on head_ref would OVERRIDE that inherited group
      # (and head_ref is empty on push, breaking main runs), so we intentionally
      # do NOT add one — see the journey note.
      - name: Deploy proof preview to gh-pages (PR)
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false && steps.gallery.outcome == 'success' }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: public/alpenflight/proof
          destination_dir: ${{ steps.preview.outputs.subdir }}
          publish_branch: gh-pages
          keep_files: true
          enable_jekyll: false
          commit_message: "proof preview: ${{ steps.pw.outcome }} for ${{ github.head_ref }} (${{ github.sha }})"

      # J-4 T-24 — after the clean-seed gallery lands at .../<branch>/, rebuild
      # the persistent previews index (alpenflight/previews/index.html) from the
      # fresh gh-pages scan so this branch's "Clean-seed tenant-isolation" link is
      # current. Fail-soft inside the composite (the index is an entry point, not
      # a gate). Same PR + non-fork + gallery-green gate as the deploy above.
      - name: Rebuild persistent previews index
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false && steps.gallery.outcome == 'success' }}
        uses: ./.github/actions/rebuild-previews-index
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      # J-7 T-12 — DEPLOYED-JOURNEY post-deploy guard (operator grill, J-6 retro:
      # "a procedure rule kept failing, so this must be structural"). The baseline
      # caption check below ONLY runs for the J-0 baseline path
      # (proof_is_baseline == 'true'); a JOURNEY-UNDER-WORK run (e.g. J-7) had NO
      # deployed assertion at all — exactly where the page shipped wrong ~4× (the
      # generator was green while the deployed bookmark read `pending` or the page
      # was thin, deploy-path/probe-path drifting independently). This step runs
      # the browserless proof-gallery-links spec in `[deployed-journey]` mode
      # against the LIVE PR preview + the persistent previews index, asserting the
      # journey-under-work's bookmark row is a LIVE LINK (200) and its per-journey
      # page declares ≥1 asset with EVERY asset resolving 200 (the spec polls ~60s
      # for gh-pages). Runs AFTER the preview deploy + index rebuild, PR + non-fork
      # + gallery-green gated, for the non-baseline journey-under-work path only
      # (the baseline path is covered by the caption check below).
      - name: Deployed-journey guard (bookmark live + page assets 200)
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false && steps.gallery.outcome == 'success' && needs.changes.outputs.proof_is_baseline != 'true' && needs.changes.outputs.proof_journey != '' }}
        working-directory: alpenflight/web
        env:
          GALLERY_DEPLOYED_URL: ${{ steps.preview.outputs.url }}
          # Empty on a baseline run: a baseline (J-0 fail-safe) produces NO
          # journey-under-work captures by definition, so the deployed-journey
          # guard must not demand a complete journey page. The guard
          # `test.skip`s when GALLERY_DEPLOYED_JOURNEY is empty-string (falsy).
          # The step `if:` already gates on `proof_is_baseline != 'true'`; this
          # is the defense-in-depth twin closing the latent bug for any future
          # path that reaches the guard on a baseline fallback (J-26 T-31).
          GALLERY_DEPLOYED_JOURNEY: ${{ needs.changes.outputs.proof_is_baseline == 'true' && '' || needs.changes.outputs.proof_journey }}
          GALLERY_LINKS_ONLY: '1'
          # J-26 T-26 — this is the PER-PUSH proof deploy. The both-sides-of-every-
          # declared-pair check enforces only the shots `producedBy: proof` (+
          # untagged) so a read-side journey's fanout-produced legacy side (deployed
          # by the fanout, not here) is tolerated-absent on this deploy rather than
          # false-redding it. A pair both sides of which are proof/untagged must
          # render BOTH sides here.
          GALLERY_PROOF_CONTEXT: proof
        run: |
          pnpm exec playwright test \
            --config=e2e/playwright.config.ts \
            --project=proof-gallery-links \
            --grep '\[deployed-journey\]'

      # J-25 T-02 — THE provable green: a live link-check against the deployed
      # preview. PR-only + gallery-green-gated, placed AFTER the preview deploy
      # step above so the gh-pages push has already happened. Polls the computed
      # preview URL (steps.preview.outputs.url) with bounded retry — gh-pages
      # serves a freshly-pushed subpath anywhere from a few seconds to ~1 min
      # later, so we loop 12× with 10s sleeps (≈2 min budget) until HTTP 200,
      # then assert the returned HTML contains the J-0 proof captions the
      # generator emits (esc() only touches & < > " — none of which appear in
      # these captions, so they render verbatim and grep-match literally). The
      # caption substrings are the distinctive tails of the three J-0 captions
      # in alpenflight/web/e2e/tests/real-idp/locations-crud-tenant-isolation.spec.ts
      # (the `proofVideo({ caption })` calls). If the URL never 200s within budget,
      # OR 200s but a caption is absent, the step fails the job red. Inherent
      # timing caveat: on the FIRST-EVER push of a brand-new subpath, Pages
      # build latency can exceed even this budget — the failure message names
      # the URL so a transient propagation miss is diagnosable + re-runnable.
      # Dependency-free: bash + curl (both on the ubuntu runner).
      #
      # J-5 T-14 — the captions below are the J-0 Locations spec's. They are only
      # present when this push ran the J-0 BASELINE spec (the fail-safe path).
      # When the per-push proof ran a journey-under-work's OWN real-idp spec
      # (proof_is_baseline != 'true'), the gallery carries that journey's
      # captions instead, so this J-0-specific grep would false-red. Gate the
      # check on the baseline having run — the journey-specific run is still
      # proven green by its own `pw` step (the gate signal), and the gallery
      # still deploys + the preview index still rebuilds above.
      - name: Live link-check the deployed preview (200 + captions)
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false && steps.gallery.outcome == 'success' && needs.changes.outputs.proof_is_baseline == 'true' }}
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
        run: |
          set -uo pipefail
          # Distinctive tails of the three J-0 captions emitted by the gallery
          # generator (see locations-crud-tenant-isolation.spec.ts proofVideo
          # captions). ASCII-only substrings (no multibyte `·`) for a robust grep.
          captions=(
            "club A admin creates a Location and sees it in club A's list"
            "club B is denied club A's Location (404 not 403)"
            "the same ICAO is creatable independently in club B"
          )
          attempts=12
          sleep_s=10
          body="$(mktemp)"
          code=000
          for i in $(seq 1 "$attempts"); do
            code="$(curl -s -o "$body" -w '%{http_code}' "$PREVIEW_URL" || echo 000)"
            if [ "$code" = "200" ]; then
              echo "preview served HTTP 200 on attempt ${i}/${attempts}: ${PREVIEW_URL}"
              break
            fi
            echo "attempt ${i}/${attempts}: preview not ready (HTTP ${code}) — sleeping ${sleep_s}s"
            sleep "$sleep_s"
          done
          if [ "$code" != "200" ]; then
            echo "::error::preview URL never served (last HTTP ${code}) within budget at ${PREVIEW_URL}"
            exit 1
          fi
          missing=0
          for c in "${captions[@]}"; do
            if grep -qF -- "$c" "$body"; then
              echo "  ✓ caption present: ${c}"
            else
              echo "::error::caption absent from served preview: \"${c}\""
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::preview served 200 but J-0 captions absent at ${PREVIEW_URL}"
            exit 1
          fi
          echo "live link-check passed: 200 + all 3 J-0 captions present at ${PREVIEW_URL}"

      # J-25 — surface the clickable preview URL: a $GITHUB_STEP_SUMMARY line
      # PLUS a sticky PR comment upserted by a hidden HTML marker (find-and-update
      # via github-script, so re-runs update one comment instead of spamming).
      # Both gated on the preview deploy having published (PR + non-fork + gallery
      # green) — there's no preview URL to surface when the deploy itself skipped,
      # and a fork PR has no write token for the comment anyway, so both skip
      # cleanly on fork PRs (the documented "fork PRs silently skip" contract)
      # rather than failing the required proof gate red.
      # J-4 T-24 — surface the PERSISTENT previews index (the single bookmark),
      # not this branch's ephemeral clean-seed URL, on the step summary.
      - name: Surface previews index (step summary)
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false && steps.gallery.outcome == 'success' }}
        run: |
          {
            echo "### Proof previews index (permanent bookmark)"
            echo ""
            echo "[$INDEX_URL]($INDEX_URL)"
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          INDEX_URL: https://elekktrisch.github.io/fls/alpenflight/previews/index.html

      # J-4 T-24 — THE single sticky PR comment. Replaces the former
      # `<!-- proof-preview -->` (clean-seed) and `<!-- fanout-proof-preview -->`
      # (fanout) comments: one `<!-- proof-index -->` comment that points at the
      # PERSISTENT, bookmarkable index. The index lists THIS branch's proofs (and
      # every other active branch's) with per-proof links + last-updated, so the
      # operator bookmarks ONE URL and always returns to it. No per-branch URL in
      # the comment — the index is the entry point.
      - name: Upsert single sticky proof-index comment
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false && steps.gallery.outcome == 'success' }}
        uses: actions/github-script@v7
        env:
          INDEX_URL: https://elekktrisch.github.io/fls/alpenflight/previews/index.html
        with:
          script: |
            const marker = '<!-- proof-index -->';
            const url = process.env.INDEX_URL;
            const body = `${marker}\n### Proof previews index — **permanent bookmark**\n\n[${url}](${url})\n\n_One stable page lists every active branch's proofs (clean-seed · dashboards · /profile · legacy-parity) with per-proof links + last-updated. Bookmark it — the URL never changes; the per-branch galleries come and go. Rebuilt on every proof deploy._`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Stop backend
        if: always()
        run: |
          if [ -f alpenflight/server/backend.pid ]; then
            kill "$(cat alpenflight/server/backend.pid)" 2>/dev/null || true
          fi

      - name: Tear down
        if: always()
        run: |
          docker compose -p alpenflight-dev   -f docker-compose.yml                   down -v --remove-orphans || true
          docker compose -p alpenflight-infra -f docker-compose.yml --profile infra   down -v --remove-orphans || true
          docker network rm alpenflight_shared || true

  # ---------------------------------------------------------------------------
  # alpenflight-dashboard-proof — J-3's SHOWCASE-SEEDED dashboard display run.
  #
  # The J-3 dashboard variants only prove their worth against realistic data
  # (empty cards / zero counts demonstrate nothing), so this job boots the SAME
  # real stack as `alpenflight-proof` (Postgres + Keycloak + Mailpit + the
  # alpenflight backend + `ng serve --configuration=development`), then loads the
  # `@Profile("showcase")` seed (`./gradlew seedShowcase` — deterministic 2-club
  # demo dataset: club-1 today=3/pending=4, 14 flights, the pilot1/clubadmin1/
  # sysadmin principals) BEFORE starting the long-running backend, and runs ONLY
  # `start-dashboard.spec.ts` against it with full real assertions.
  #
  # SEED-PROFILE SEPARATION (the critical J-3 constraint): the required
  # `alpenflight-proof` job above runs the J-0/J-1/J-2 specs against a CLEAN
  # `dev`-profile seed and asserts EXACT counts (e.g. aircraft = 3). Loading the
  # showcase data there would pollute those counts (aircraft 6≠3). So the
  # showcase seed lives in its OWN job, against its OWN Postgres, with the
  # dashboard spec it serves — the two jobs share NO state and run in parallel.
  #
  # NON-BLOCKING DISPLAY RUN: this job is NOT in the `required` aggregator's
  # `needs` (it's the journey's visual proof + gallery, not a branch-protection
  # gate — mirroring the non-blocking `parity-legacy-video` posture). It deploys
  # the 3 populated variant screenshots to a DISJOINT per-branch preview subpath
  # (`alpenflight/proof-preview/<ref>/dashboard`) so it never clobbers the
  # canonical proof gallery or the `alpenflight-proof` preview; the manager
  # refreshes the PR sticky gallery comment after it lands.
  # ---------------------------------------------------------------------------
  alpenflight-dashboard-proof:
    name: alpenflight dashboard proof (real-idp, showcase seed)
    # CHAINED after `alpenflight-proof` (not parallel with it) — `needs:` it so the
    # two full-stack real-chain jobs never contend for one runner's CPU/IO. The
    # first live run (run 26988942197) brought the stack up + seeded + passed 5/6
    # specs, but the pilot last-flight card (the only TWO-HOP chained-fetch
    # assertion) timed out at 5s against a cold backend racing the dashboard's
    # masterdata prefetch burst — a starved 4th heavy parallel job (alongside
    # alpenflight-build + alpenflight-proof + mock-e2e) made the cold-start latency
    # worse. Serialising behind `alpenflight-proof` gives this job an uncontended
    # runner. STILL NON-BLOCKING: deliberately NOT added to the `required`
    # aggregator's `needs` (it's the journey's visual proof + gallery, mirroring
    # the non-blocking `parity-legacy-video` posture). `needs.alpenflight-proof`
    # only orders it AFTER that job — it does not make THIS job gate the merge.
    # `if: always()` so a red `alpenflight-proof` (the required gate's own signal)
    # doesn't skip the display run — a `needs:`-ed job otherwise skips when its
    # dependency fails, and we still want the showcase gallery on a proof red.
    needs: [changes, alpenflight-proof]
    if: >-
      always()
      && needs.changes.outputs.next == 'true'
      && needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    env:
      E2E_REAL_IDP: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Create alpenflight_shared network
        run: docker network create alpenflight_shared --driver bridge

      - name: Bring up alpenflight-infra (mailpit)
        run: |
          for i in 1 2 3; do
            bash alpenflight/ops/dev-up-infra.sh && exit 0
            echo "attempt $i failed (registry blip?) — retrying in 15s" >&2
            sleep 15
          done
          echo "::error::alpenflight-infra bring-up failed after 3 attempts" >&2
          exit 1

      - name: Build pgAdmin + Keycloak images
        run: |
          for i in 1 2 3; do
            docker compose -f docker-compose.yml --profile next build pgadmin keycloak && exit 0
            echo "attempt $i failed (registry blip?) — retrying in 15s" >&2
            sleep 15
          done
          echo "::error::pgAdmin + Keycloak image build failed after 3 attempts" >&2
          exit 1

      - name: Bring up alpenflight-dev (postgres + pgadmin + keycloak)
        run: |
          for i in 1 2 3; do
            docker compose -p alpenflight-dev -f docker-compose.yml \
              up -d --wait --wait-timeout 240 postgres pgadmin keycloak && exit 0
            echo "attempt $i failed (registry blip?) — retrying in 15s" >&2
            sleep 15
          done
          echo "::error::alpenflight-dev bring-up failed after 3 attempts" >&2
          exit 1

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version-file: alpenflight/web/.nvmrc

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11
          run_install: false

      - name: Restore pnpm store cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('alpenflight/web/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install alpenflight/web deps
        working-directory: alpenflight/web
        env:
          CI: 'true'
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('alpenflight/web/pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright browser + deps
        working-directory: alpenflight/web
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = 'true' ]; then
            pnpm exec playwright install-deps chromium
          else
            pnpm exec playwright install --with-deps chromium
          fi

      - name: Flyway migrate (alpenflight Postgres)
        working-directory: alpenflight/server
        run: |
          DATASOURCE_URL=jdbc:postgresql://localhost:5432/alpenflight \
          DATASOURCE_USER=alpenflight \
          DATASOURCE_PASSWORD=alpenflight \
          ./gradlew flywayMigrate --no-daemon --console=plain --quiet

      # Load the showcase seed BEFORE starting the long-running backend. The
      # `seedShowcase` task boots a SHORT-LIVED app under `dev,showcase` +
      # `exit-after-seed=true`: it fires the idempotent `ShowcaseSeeder` once
      # (the deterministic 2-club demo dataset) and exits 0. No Keycloak needed
      # here — the showcase principals are realm-export + Flyway-seeded `t_user`
      # rows; the seeder only writes the DB rows that reference their subs.
      - name: Load showcase seed (gradlew seedShowcase)
        working-directory: alpenflight/server
        env:
          DATASOURCE_URL: jdbc:postgresql://localhost:5432/alpenflight
          DATASOURCE_USER: alpenflight
          DATASOURCE_PASSWORD: alpenflight
          LOGGING_LEVEL_ROOT: INFO
        run: ./gradlew seedShowcase --no-daemon --console=plain --quiet

      - name: Build alpenflight backend bootJar
        working-directory: alpenflight/server
        run: ./gradlew bootJar --no-daemon --console=plain --quiet

      # Long-running backend on the `dev` profile (NOT showcase — the seed is
      # already committed; the live backend just reads it). Same host-bootJar ↔
      # host-mapped-Keycloak wiring as `alpenflight-proof`.
      - name: Start alpenflight backend
        working-directory: alpenflight/server
        env:
          DATASOURCE_URL: jdbc:postgresql://localhost:5432/alpenflight
          DATASOURCE_USER: alpenflight
          DATASOURCE_PASSWORD: alpenflight
          SPRING_PROFILES_ACTIVE: dev
          LOGGING_LEVEL_ROOT: INFO
          ALPENFLIGHT_KC_ADMIN_BASE_URL: http://localhost:8090
          ALPENFLIGHT_KC_ADMIN_REALM: alpenflight
          ALPENFLIGHT_KC_ADMIN_CLIENT_ID: alpenflight-backend-admin
          ALPENFLIGHT_KC_ADMIN_CLIENT_SECRET: alpenflight-backend-admin-dev-secret
          ALPENFLIGHT_OIDC_ISSUER_URI: http://localhost:8090/realms/alpenflight
        run: |
          JAR="$(ls build/libs/*.jar | grep -v -- '-plain.jar' | head -1)"
          echo "Starting backend from: $JAR"
          nohup java -jar "$JAR" > backend.log 2>&1 &
          echo "$!" > backend.pid

      - name: Wait for backend /actuator/health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/actuator/health >/dev/null 2>&1; then
              echo "backend ready (attempt $i)"
              exit 0
            fi
            sleep 2
          done
          echo "backend not ready after 120s" >&2
          tail -n 200 alpenflight/server/backend.log >&2 || true
          exit 1

      # Run ONLY the J-3 dashboard display spec (its `real-idp-setup` dependency
      # runs automatically) against the showcase-seeded backend. The dashboard
      # spec writes the 3 populated variant screenshots.
      #
      # PROOF-SCOPING (J-4 T-21+T-22, operator Q2 2026-06-05). The J-4
      # `/profile` self-edit spec USED to ride along here (both showcase-seeded),
      # but the operator made the profile UI proof a REQUIRED merge gate. A
      # `required`-gating spec must NOT live in a non-blocking display job, so it
      # moved to its own gating job `alpenflight-profile-proof` below (cloned
      # from this job's showcase bring-up). This job stays J-3-only + NON-blocking
      # (the journey's visual showcase + gallery), so J-4's gate is NOT coupled to
      # J-3's `start-dashboard.spec.ts`.
      - name: Run J-3 dashboard display proof (showcase seed)
        id: pw
        working-directory: alpenflight/web
        timeout-minutes: 12
        env:
          DATASOURCE_URL: jdbc:postgresql://localhost:5432/alpenflight
          DATASOURCE_USER: alpenflight
          DATASOURCE_PASSWORD: alpenflight
        run: |
          # --workers=1: real-idp serial (top-level `workers` no-op per-project).
          pnpm exec playwright test \
            --config=e2e/playwright.config.ts \
            --project=real-idp \
            --workers=1 \
            e2e/tests/real-idp/start-dashboard.spec.ts

      # J-26 T-25 — capture the per-test failure artifacts (error-context.md +
      # trace.zip + failure screenshot/video) BEFORE the staging/gallery steps run
      # (the always()-uploaded dashboard artifact further down lands after the
      # gallery generate step has consumed `test-results/`). Gated on `failure()`
      # so it only fires on a red dashboard spec. Same path as the proof job —
      # Playwright writes per-test dirs to `alpenflight/web/test-results/<test>/`.
      - name: Upload Playwright test-results on failure (pre-gallery)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results-dashboard-proof-${{ github.run_id }}
          path: alpenflight/web/test-results/**
          retention-days: 7
          if-no-files-found: warn

      # Stage the 3 populated variant screenshots + write the J-3 screenshots.json
      # sidecar (greenfield → AlpenFlight-only, NO paired legacy shots) so the
      # gallery renders them under the J-3 section. The spec wrote them as
      # `alpenflight-start-<variant>.png` under test-results/<test>/; copy each by
      # its stable name into the --screenshots dir + declare journey/side/view/
      # caption. A DECLARED-yet-missing PNG fails the generator's AC5 link-check,
      # so we declare strictly what we copied.
      #
      # PROOF-SCOPING (J-4 T-21+T-22, operator Q2). The J-4 /profile screenshots
      # are now staged by the dedicated `alpenflight-profile-proof` job (which
      # owns the now-required self-edit.spec.ts run), so this staging step is
      # J-3-dashboard-only again.
      - name: Stage J-3 dashboard screenshots + sidecar
        if: always()
        run: |
          SHOT="${{ github.workspace }}/j3-screenshots"
          mkdir -p "$SHOT"
          SHOTS=""
          add_shot() { # $1 journey  $2 stable-name  $3 view  $4 caption
            local src; src="$(find alpenflight/web/test-results -name "$2" 2>/dev/null | head -1 || true)"
            if [ -n "$src" ]; then
              cp "$src" "$SHOT/$2"
              SHOTS="$SHOTS{\"journey\":\"$1\",\"side\":\"alpenflight\",\"view\":\"$3\",\"file\":\"$2\",\"caption\":$(node -e 'process.stdout.write(JSON.stringify(process.argv[1]))' "$4")},"
            else
              echo "screenshot $2 not found — skipping that entry."
            fi
          }
          add_shot "J-3" "alpenflight-start-pilot.png" "pilot variant" \
            "AlpenFlight: the /start PILOT dashboard, populated from the showcase seed — greeting + a FILLED last-flight card (pilot1 is PIC on a real seeded club-1 flight; not the empty state)"
          add_shot "J-3" "alpenflight-start-clubadmin.png" "club-admin variant" \
            "AlpenFlight: the /start CLUB-ADMIN dashboard (clubadmin1, club-1) — today's flights = 3 + pending-validation = 4, the exact tenant-scoped showcase club-1 counts"
          add_shot "J-3" "alpenflight-start-sysadmin.png" "sysadmin variant" \
            "AlpenFlight: the /start SYSADMIN dashboard — cross-tenant aggregates (≥2 clubs / ≥14 flights / ≥6 users across the showcase) + the tenant-enter control"
          if [ -n "$SHOTS" ]; then
            printf '{ "screenshots": [ %s ] }' "${SHOTS%,}" \
              | node -e 'const fs=require("fs");let s="";process.stdin.on("data",d=>s+=d).on("end",()=>fs.writeFileSync(process.argv[1],JSON.stringify(JSON.parse(s),null,2)))' "$SHOT/screenshots.json"
            echo "Staged J-3 dashboard screenshots + sidecar:"
            ls -l "$SHOT/"
            cat "$SHOT/screenshots.json"
          else
            echo "No J-3 dashboard PNGs found — the dashboard spec likely red before capture."
          fi

      # Build + link-check the gallery from this run's manifest + the staged J-3
      # screenshots. --no-nav: this is a LEAF per-run gallery deployed to a
      # namespaced subpath, so the canonical-index "per-run galleries" nav is not
      # rendered here. The generator exits non-zero on a declared-but-missing PNG
      # (AC5) — that must fail the job.
      - name: Build + link-check proof gallery (J-3 dashboard, showcase)
        id: gallery
        if: always()
        working-directory: alpenflight/web
        run: |
          SHOT="${{ github.workspace }}/j3-screenshots"
          SHOT_ARG=""
          if [ -f "$SHOT/screenshots.json" ]; then
            SHOT_ARG="--screenshots $SHOT"
          fi
          node e2e/proof-gallery/generate-gallery.mjs \
            --report test-results/proof-manifest.json \
            --out ../../public/alpenflight/proof \
            --order ../../docs/modernization/stories/_ORDER.md \
            --no-nav \
            $SHOT_ARG

      # `!cancelled()` (not the implicit `success()`): the J-3 dashboard proof is
      # the journey's VISUAL showcase, non-blocking (not in `required.needs`). A
      # red spec CASE (e.g. the brittle pilot last-flight-card assertion) must NOT
      # cost the operator eyes-on the dashboards. The spec captures each variant
      # screenshot the moment its container is visible (before the deep
      # assertions), staging + gallery-build already run `if: always()`, and the
      # gallery built green — so the deploy chain MUST proceed on a spec red too.
      # Mirrors J-2 fanout's continue-on-error posture on non-blocking capture.
      - name: Compute J-3 dashboard preview destination
        id: preview
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          # SANITIZE RULE — byte-identical to ci.yml's `Compute proof-preview
          # destination` + proof-preview-reap.yml so the reaper's per-branch
          # parent (`alpenflight/proof-preview/<sanitized>`) recursively removes
          # this nested `.../dashboard` subdir on PR close.
          sanitized="$(printf '%s' "$HEAD_REF" | sed -E 's#[^A-Za-z0-9._-]#-#g')"
          subdir="alpenflight/proof-preview/${sanitized}/dashboard"
          url="https://elekktrisch.github.io/fls/${subdir}/"
          {
            echo "subdir=${subdir}"
            echo "url=${url}"
          } >> "$GITHUB_OUTPUT"
          echo "J-3 dashboard proof preview → ${url}"

      - name: Collect logs on failure
        if: failure()
        run: |
          echo "── backend log ─────────────────────────────" >&2
          tail -n 200 alpenflight/server/backend.log >&2 || true
          echo "── keycloak log ────────────────────────────" >&2
          docker compose -p alpenflight-dev -f docker-compose.yml logs --tail 200 keycloak >&2 || true

      - name: Upload dashboard proof artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpenflight-dashboard-proof-${{ github.run_id }}
          path: |
            alpenflight/web/playwright-report
            alpenflight/web/test-results
            alpenflight/web/screenshots
            alpenflight/server/backend.log
            public/alpenflight/proof
          retention-days: 14
          if-no-files-found: warn

      # Deploy the J-3 dashboard gallery to a DISJOINT per-branch preview subpath
      # (`alpenflight/proof-preview/<ref>/dashboard`). keep_files:true + the
      # nested per-branch destination mean it never clobbers the canonical
      # /alpenflight/proof/ (main), the `alpenflight-proof` preview, or the
      # fan-out's `.../legacy-parity` preview.
      - name: Deploy J-3 dashboard gallery to gh-pages (PR preview)
        if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false && steps.gallery.outcome == 'success' && steps.preview.outputs.subdir != '' }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: public/alpenflight/proof
          destination_dir: ${{ steps.preview.outputs.subdir }}
          publish_branch: gh-pages
          keep_files: true
          enable_jekyll: false
          commit_message: "J-3 dashboard proof preview: ${{ steps.pw.outcome }} for ${{ github.head_ref }} (${{ github.sha }})"

      # J-4 T-24 — refresh the persistent previews index after the dashboard
      # gallery lands at .../<branch>/dashboard/ so its "Showcase role dashboards"
      # link is current. Fail-soft composite.
      - name: Rebuild persistent previews index
        if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false && steps.gallery.outcome == 'success' && steps.preview.outputs.subdir != '' }}
        uses: ./.github/actions/rebuild-previews-index
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Surface J-3 dashboard preview URL (step summary)
        if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false && steps.gallery.outcome == 'success' && steps.preview.outputs.url != '' }}
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
        run: |
          {
            echo "### J-3 dashboard proof gallery (showcase seed)"
            echo ""
            echo "3 populated variant screenshots (pilot · club-admin · sysadmin):"
            echo ""
            echo "[$PREVIEW_URL]($PREVIEW_URL)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Stop backend
        if: always()
        run: |
          if [ -f alpenflight/server/backend.pid ]; then
            kill "$(cat alpenflight/server/backend.pid)" 2>/dev/null || true
          fi

      - name: Tear down
        if: always()
        run: |
          docker compose -p alpenflight-dev   -f docker-compose.yml                   down -v --remove-orphans || true
          docker compose -p alpenflight-infra -f docker-compose.yml --profile infra   down -v --remove-orphans || true
          docker network rm alpenflight_shared || true

  # ---------------------------------------------------------------------------
  # alpenflight-profile-proof — J-4's SHOWCASE-SEEDED /profile self-edit gate.
  #
  # PROOF-SCOPING (J-4 T-21+T-22, operator decision 2026-06-05 Q2). The operator
  # made J-4's `/profile` self-edit UI proof a REQUIRED per-push merge gate — it
  # IS in the `required` aggregator's `needs` (see `required` below). It runs
  # ONLY `e2e/tests/profile/self-edit.spec.ts` against the SAME showcase-seeded
  # real stack `alpenflight-dashboard-proof` boots (Postgres + Keycloak + Mailpit
  # + the alpenflight backend + `ng serve`), because the profile spec drives a
  # real PILOT (pilot1) redirect login + asserts against the showcase Person.
  #
  # WHY ITS OWN JOB (shape A, not folding into dashboard-proof):
  #   - A `required`-gating spec must not live in the NON-blocking dashboard
  #     display job (`alpenflight-dashboard-proof` stays the journey's visual
  #     showcase + gallery, NOT a branch-protection gate). Splitting keeps J-4's
  #     gate from coupling to J-3's `start-dashboard.spec.ts` (and vice versa).
  #   - It keeps the dashboard job's resilient gallery deploy
  #     (`if: always()`/`!cancelled()`) intact.
  # This is the per-push "current journey's spec" half of the proof-scoping
  # rider; the full cross-journey regression (J-1 aircraft + J-2 flight parity)
  # runs nightly in `alpenflight-e2e-real-idp.yml`.
  #
  # CHAINED after `alpenflight-dashboard-proof` (`needs:` it) so the two
  # showcase full-stack jobs never contend for one runner's CPU/IO — same
  # serialisation rationale as dashboard-proof chaining after alpenflight-proof.
  # Path-filtered on the same `next == 'true' && docs_only != 'true'` gate as the
  # other heavy jobs: a docs-only push skips it, it reports `skipped`, and the
  # `required` aggregator's skipped-to-success path keeps the gate green.
  #
  # GATING `if:` (NOT `always()`): unlike the non-blocking dashboard job, this
  # job must SKIP cleanly when its `changes` deps say docs-only/non-next — a
  # `skipped` result the aggregator maps to success. But because it `needs:`
  # the (non-required) dashboard-proof, a real RED in dashboard-proof would
  # otherwise SKIP this job and silently un-gate J-4. We guard that with an
  # explicit `needs.alpenflight-dashboard-proof.result != 'skipped'` allowance
  # plus `always()` so this job still RUNS (and can gate red) even if the
  # upstream display job failed — only the `changes`-driven path-filter skips it.
  # ---------------------------------------------------------------------------
  alpenflight-profile-proof:
    name: alpenflight profile proof (real-idp, showcase seed)
    needs: [changes, alpenflight-dashboard-proof]
    if: >-
      always()
      && needs.changes.outputs.next == 'true'
      && needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    env:
      E2E_REAL_IDP: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Create alpenflight_shared network
        run: docker network create alpenflight_shared --driver bridge

      - name: Bring up alpenflight-infra (mailpit)
        run: |
          for i in 1 2 3; do
            bash alpenflight/ops/dev-up-infra.sh && exit 0
            echo "attempt $i failed (registry blip?) — retrying in 15s" >&2
            sleep 15
          done
          echo "::error::alpenflight-infra bring-up failed after 3 attempts" >&2
          exit 1

      - name: Build pgAdmin + Keycloak images
        run: |
          for i in 1 2 3; do
            docker compose -f docker-compose.yml --profile next build pgadmin keycloak && exit 0
            echo "attempt $i failed (registry blip?) — retrying in 15s" >&2
            sleep 15
          done
          echo "::error::pgAdmin + Keycloak image build failed after 3 attempts" >&2
          exit 1

      - name: Bring up alpenflight-dev (postgres + pgadmin + keycloak)
        run: |
          for i in 1 2 3; do
            docker compose -p alpenflight-dev -f docker-compose.yml \
              up -d --wait --wait-timeout 240 postgres pgadmin keycloak && exit 0
            echo "attempt $i failed (registry blip?) — retrying in 15s" >&2
            sleep 15
          done
          echo "::error::alpenflight-dev bring-up failed after 3 attempts" >&2
          exit 1

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version-file: alpenflight/web/.nvmrc

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11
          run_install: false

      - name: Restore pnpm store cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('alpenflight/web/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install alpenflight/web deps
        working-directory: alpenflight/web
        env:
          CI: 'true'
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('alpenflight/web/pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright browser + deps
        working-directory: alpenflight/web
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = 'true' ]; then
            pnpm exec playwright install-deps chromium
          else
            pnpm exec playwright install --with-deps chromium
          fi

      - name: Flyway migrate (alpenflight Postgres)
        working-directory: alpenflight/server
        run: |
          DATASOURCE_URL=jdbc:postgresql://localhost:5432/alpenflight \
          DATASOURCE_USER=alpenflight \
          DATASOURCE_PASSWORD=alpenflight \
          ./gradlew flywayMigrate --no-daemon --console=plain --quiet

      # Same showcase seed the dashboard job loads — the profile spec drives the
      # PILOT pilot1 principal (a showcase Person with the full self-edit field
      # set) and asserts against it. Loaded BEFORE the long-running backend.
      - name: Load showcase seed (gradlew seedShowcase)
        working-directory: alpenflight/server
        env:
          DATASOURCE_URL: jdbc:postgresql://localhost:5432/alpenflight
          DATASOURCE_USER: alpenflight
          DATASOURCE_PASSWORD: alpenflight
          LOGGING_LEVEL_ROOT: INFO
        run: ./gradlew seedShowcase --no-daemon --console=plain --quiet

      - name: Build alpenflight backend bootJar
        working-directory: alpenflight/server
        run: ./gradlew bootJar --no-daemon --console=plain --quiet

      - name: Start alpenflight backend
        working-directory: alpenflight/server
        env:
          DATASOURCE_URL: jdbc:postgresql://localhost:5432/alpenflight
          DATASOURCE_USER: alpenflight
          DATASOURCE_PASSWORD: alpenflight
          SPRING_PROFILES_ACTIVE: dev
          LOGGING_LEVEL_ROOT: INFO
          ALPENFLIGHT_KC_ADMIN_BASE_URL: http://localhost:8090
          ALPENFLIGHT_KC_ADMIN_REALM: alpenflight
          ALPENFLIGHT_KC_ADMIN_CLIENT_ID: alpenflight-backend-admin
          ALPENFLIGHT_KC_ADMIN_CLIENT_SECRET: alpenflight-backend-admin-dev-secret
          ALPENFLIGHT_OIDC_ISSUER_URI: http://localhost:8090/realms/alpenflight
        run: |
          JAR="$(ls build/libs/*.jar | grep -v -- '-plain.jar' | head -1)"
          echo "Starting backend from: $JAR"
          nohup java -jar "$JAR" > backend.log 2>&1 &
          echo "$!" > backend.pid

      - name: Wait for backend /actuator/health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/actuator/health >/dev/null 2>&1; then
              echo "backend ready (attempt $i)"
              exit 0
            fi
            sleep 2
          done
          echo "backend not ready after 120s" >&2
          tail -n 200 alpenflight/server/backend.log >&2 || true
          exit 1

      # THE GATE: run ONLY the J-4 /profile self-edit spec against the
      # showcase-seeded backend. Full-assertion (T-06..T-13 + T-20a locale fix
      # landed): 4-tab round-trips, locale de→en flip + reload-survival, audit
      # read, no-Person banner, tenant isolation. A red here MUST fail this job
      # → fail `required` → block the merge (that is the whole point of the
      # operator's Q2 decision). NO `continue-on-error`. The spec still captures
      # each tab screenshot BEFORE its deep assertions (resilient capture), so a
      # red assertion still leaves the gallery staging below something to publish.
      - name: Run J-4 /profile self-edit proof (showcase seed) [REQUIRED]
        id: pw
        working-directory: alpenflight/web
        timeout-minutes: 12
        env:
          DATASOURCE_URL: jdbc:postgresql://localhost:5432/alpenflight
          DATASOURCE_USER: alpenflight
          DATASOURCE_PASSWORD: alpenflight
        run: |
          # --workers=1: real-idp serial (top-level `workers` no-op per-project).
          pnpm exec playwright test \
            --config=e2e/playwright.config.ts \
            --project=real-idp \
            --workers=1 \
            e2e/tests/profile/self-edit.spec.ts

      # J-26 T-25 — capture the per-test failure artifacts (error-context.md +
      # trace.zip + failure screenshot/video) BEFORE the staging/gallery steps run
      # (the always()-uploaded profile artifact further down lands after the
      # gallery generate step has consumed `test-results/`). This job is the
      # REQUIRED /profile merge gate, so a red here blocks merge — exactly the
      # case that must stay diagnosable from the run. Gated on `failure()`; same
      # `alpenflight/web/test-results/<test>/` path as the other proof jobs.
      - name: Upload Playwright test-results on failure (pre-gallery)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results-profile-proof-${{ github.run_id }}
          path: alpenflight/web/test-results/**
          retention-days: 7
          if-no-files-found: warn

      # Stage the 4 per-tab /profile screenshots + the J-4 screenshots.json
      # sidecar (AlpenFlight-only) so the gallery renders them under the J-4
      # section. `if: always()` so a red assertion still publishes the captured
      # shots — the gate signal is the spec result (`steps.pw`), not the gallery.
      - name: Stage J-4 profile screenshots + sidecar
        if: always()
        run: |
          SHOT="${{ github.workspace }}/j4-screenshots"
          mkdir -p "$SHOT"
          SHOTS=""
          add_shot() { # $1 journey  $2 stable-name  $3 view  $4 caption
            local src; src="$(find alpenflight/web/test-results -name "$2" 2>/dev/null | head -1 || true)"
            if [ -n "$src" ]; then
              cp "$src" "$SHOT/$2"
              SHOTS="$SHOTS{\"journey\":\"$1\",\"side\":\"alpenflight\",\"view\":\"$3\",\"file\":\"$2\",\"caption\":$(node -e 'process.stdout.write(JSON.stringify(process.argv[1]))' "$4")},"
            else
              echo "screenshot $2 not found — skipping that entry."
            fi
          }
          add_shot "J-4" "alpenflight-profile-account.png" "Account tab" \
            "AlpenFlight: /profile → Account tab (PILOT pilot1) — self-edit account fields (friendly name, notification email, phone, language) functional via PATCH /api/v1/me/profile; username + club read-only"
          add_shot "J-4" "alpenflight-profile-personal.png" "Personal tab" \
            "AlpenFlight: /profile → Personal tab (PILOT pilot1) — contact/address self-edit form (pilot1 has a linked Person)"
          add_shot "J-4" "alpenflight-profile-pilot.png" "Pilot tab" \
            "AlpenFlight: /profile → Pilot tab (PILOT pilot1) — licence/medical self-edit form (+ FADP audit on save)"
          add_shot "J-4" "alpenflight-profile-notifications.png" "Notifications tab" \
            "AlpenFlight: /profile → Notifications tab (PILOT pilot1) — the 3 notification-preference toggles"
          if [ -n "$SHOTS" ]; then
            printf '{ "screenshots": [ %s ] }' "${SHOTS%,}" \
              | node -e 'const fs=require("fs");let s="";process.stdin.on("data",d=>s+=d).on("end",()=>fs.writeFileSync(process.argv[1],JSON.stringify(JSON.parse(s),null,2)))' "$SHOT/screenshots.json"
            echo "Staged J-4 profile screenshots + sidecar:"
            ls -l "$SHOT/"
            cat "$SHOT/screenshots.json"
          else
            echo "No J-4 profile PNGs found — the profile spec likely red before capture."
          fi

      # Build + link-check the gallery from this run's manifest + the staged J-4
      # screenshots. --no-nav: LEAF per-run gallery deployed to a namespaced
      # subpath. The generator exits non-zero on a declared-but-missing PNG (AC5).
      - name: Build + link-check proof gallery (J-4 profile, showcase)
        id: gallery
        if: always()
        working-directory: alpenflight/web
        run: |
          SHOT="${{ github.workspace }}/j4-screenshots"
          SHOT_ARG=""
          if [ -f "$SHOT/screenshots.json" ]; then
            SHOT_ARG="--screenshots $SHOT"
          fi
          node e2e/proof-gallery/generate-gallery.mjs \
            --report test-results/proof-manifest.json \
            --out ../../public/alpenflight/proof \
            --order ../../docs/modernization/stories/_ORDER.md \
            --no-nav \
            $SHOT_ARG

      # `!cancelled()`: even on a red profile assertion the resilient-captured
      # shots should reach the gallery preview (mirrors dashboard-proof's posture).
      - name: Compute J-4 profile preview destination
        id: preview
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          # SANITIZE RULE — byte-identical to ci.yml's other preview steps +
          # proof-preview-reap.yml so the reaper's per-branch parent
          # (`alpenflight/proof-preview/<sanitized>`) recursively removes this
          # nested `.../profile` subdir on PR close.
          sanitized="$(printf '%s' "$HEAD_REF" | sed -E 's#[^A-Za-z0-9._-]#-#g')"
          subdir="alpenflight/proof-preview/${sanitized}/profile"
          url="https://elekktrisch.github.io/fls/${subdir}/"
          {
            echo "subdir=${subdir}"
            echo "url=${url}"
          } >> "$GITHUB_OUTPUT"
          echo "J-4 profile proof preview → ${url}"

      - name: Collect logs on failure
        if: failure()
        run: |
          echo "── backend log ─────────────────────────────" >&2
          tail -n 200 alpenflight/server/backend.log >&2 || true
          echo "── keycloak log ────────────────────────────" >&2
          docker compose -p alpenflight-dev -f docker-compose.yml logs --tail 200 keycloak >&2 || true

      - name: Upload profile proof artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpenflight-profile-proof-${{ github.run_id }}
          path: |
            alpenflight/web/playwright-report
            alpenflight/web/test-results
            alpenflight/web/screenshots
            alpenflight/server/backend.log
            public/alpenflight/proof
          retention-days: 14
          if-no-files-found: warn

      # Deploy the J-4 profile gallery to a DISJOINT per-branch preview subpath
      # (`alpenflight/proof-preview/<ref>/profile`). keep_files:true + the nested
      # per-branch destination mean it never clobbers the canonical
      # /alpenflight/proof/ (main), the `alpenflight-proof` preview, or the
      # `.../dashboard` preview.
      - name: Deploy J-4 profile gallery to gh-pages (PR preview)
        if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false && steps.gallery.outcome == 'success' && steps.preview.outputs.subdir != '' }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: public/alpenflight/proof
          destination_dir: ${{ steps.preview.outputs.subdir }}
          publish_branch: gh-pages
          keep_files: true
          enable_jekyll: false
          commit_message: "J-4 profile proof preview: ${{ steps.pw.outcome }} for ${{ github.head_ref }} (${{ github.sha }})"

      # J-4 T-24 — refresh the persistent previews index after the /profile
      # gallery lands at .../<branch>/profile/ so its "Showcase /profile self-edit"
      # link is per-push fresh (this is the required gate's own journey). Fail-soft.
      - name: Rebuild persistent previews index
        if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false && steps.gallery.outcome == 'success' && steps.preview.outputs.subdir != '' }}
        uses: ./.github/actions/rebuild-previews-index
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Surface J-4 profile preview URL (step summary)
        if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false && steps.gallery.outcome == 'success' && steps.preview.outputs.url != '' }}
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
        run: |
          {
            echo "### J-4 /profile proof gallery (showcase seed)"
            echo ""
            echo "4 self-edit tab screenshots (account · personal · pilot · notifications):"
            echo ""
            echo "[$PREVIEW_URL]($PREVIEW_URL)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Stop backend
        if: always()
        run: |
          if [ -f alpenflight/server/backend.pid ]; then
            kill "$(cat alpenflight/server/backend.pid)" 2>/dev/null || true
          fi

      - name: Tear down
        if: always()
        run: |
          docker compose -p alpenflight-dev   -f docker-compose.yml                   down -v --remove-orphans || true
          docker compose -p alpenflight-infra -f docker-compose.yml --profile infra   down -v --remove-orphans || true
          docker network rm alpenflight_shared || true

  # ---------------------------------------------------------------------------
  # alpenflight-mock-e2e — the mock-auth chromium Playwright suite, folded into
  # ci.yml so the `required` aggregator below can `needs:` it (J-3 T-12, operator
  # J-2-retro decision). Previously this ran ONLY in the standalone
  # `alpenflight-e2e.yml` workflow, invisible to `required` — so a red mock-auth
  # e2e could slip past do-ship's gate to a "done" claim (J-2 T-47: a broken
  # `proof-gallery.spec.ts` nobody watched). Now it gates exactly like
  # `alpenflight build`.
  #
  # Self-contained: Playwright's webServer config starts
  # `ng serve --configuration=mock-auth` (no Keycloak / no backend) — same as the
  # steps lifted from alpenflight-e2e.yml. Test-only here: NO gh-pages publish /
  # gallery (the proof galleries are owned by `alpenflight-proof` +
  # `alpenflight-dashboard-proof`; the `/alpenflight/` e2e DASHBOARD publish stays
  # in alpenflight-e2e.yml on main-push — see its header).
  #
  # TRIGGER SPLIT (no double-run of the suite, respecting the dedup comments in
  # both workflow headers): this job is the PR gate, so it runs on PR syncs
  # (integration/** + main) but is `if`-gated to SKIP on a `push` event —
  # alpenflight-e2e.yml owns the `push`-to-main run (where it also publishes the
  # dashboard). PR → here (gates `required`); main push (post-merge) →
  # alpenflight-e2e.yml. The two never run the chromium suite on the same commit.
  #
  # Path-filtered on the same `next == 'true' && docs_only != 'true'` gate as the
  # other heavy jobs: a docs-only push skips it, it reports `skipped`, and the
  # `required` aggregator's skipped-to-success path keeps the gate green.
  #
  # SPEC-SCOPING (J-6 T-02b — mirrors J-5 T-14's real-idp scoping for the mock
  # half). The per-push run is SCOPED to the JOURNEY-UNDER-WORK's own mock specs
  # via `changes.outputs.mock_filter` (derived from the journey file's
  # `mock_test:` frontmatter off the integration branch). So while a journey is
  # in flight, ONLY its own `tests/<feature>/` mock specs gate `required` here —
  # an unrelated flaky mock spec from a PRIOR journey can no longer red it
  # (the J-5 `articles-crud` hostage case). The FULL chromium suite (all
  # features) still runs NIGHTLY (`alpenflight-e2e.yml` on main-push, plus its
  # own cron if any) + once at the §4 do-ship gate (e2e-driver's full chain) —
  # the cross-journey mock regression is preserved, just not per-push.
  # FAIL-SAFE: a non-integration branch / no `mock_test:` frontmatter /
  # underivable filter → `mock_is_full=true` + empty filter → the WHOLE chromium
  # project runs (the pre-T-02b baseline), never a no-spec run.
  # ---------------------------------------------------------------------------
  # SHARDING (J-27 T-12). `workers` is a Playwright TOP-LEVEL option (the
  # per-project `workers:N` was a silent no-op), so a single job ran the whole
  # ~164-test suite on one runner and flaky-timed-out at the 5-min step cap even
  # with all 4 workers busy. The suite is green-but-slow (a 12-min serial control
  # run passed), so the fix is THROUGHPUT: split into a `--shard=i/4` matrix —
  # four runners, each running ~41 tests across the top-level 4 workers in well
  # under 5 min (a locally-measured single shard ran ~2 min on just 2 workers).
  # Each shard emits `reporter: blob`; the `alpenflight-mock-e2e-merge` job below
  # merges them and is the AUTHORITATIVE pass/fail (it is what `required` needs,
  # and the name branch protection must require — the per-shard jobs are NOT the
  # gate). The journey-scoped `mock_filter` (J-6 T-02b) passes through to every
  # shard unchanged: Playwright shards whatever the filter selects.
  alpenflight-mock-e2e:
    name: alpenflight mock-auth e2e shard ${{ matrix.shard }}/4
    needs: changes
    if: >-
      github.event_name != 'push'
      && needs.changes.outputs.next == 'true'
      && needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-22.04
    # A single shard (~41 tests / 4 workers) finishes in ~2-3 min; 6 min absorbs
    # a cold pnpm/playwright cache + ng-serve boot. The 5-min step cap on the run
    # below is the ceiling that keeps the gate fast.
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version-file: alpenflight/web/.nvmrc

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11
          run_install: false

      - name: Restore pnpm store cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('alpenflight/web/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install alpenflight/web deps
        working-directory: alpenflight/web
        env:
          CI: 'true'
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('alpenflight/web/pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright browser + deps
        working-directory: alpenflight/web
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = 'true' ]; then
            pnpm exec playwright install-deps chromium
          else
            pnpm exec playwright install --with-deps chromium
          fi

      # `--reporter=blob` overrides the config's html/json reporters for the
      # shard: each writes `blob-report/report-*.zip` for the merge job to stitch.
      # `--workers=4` is belt-and-suspenders over the top-level config so the
      # shard fans out to the runner's 4 vCPUs regardless of config drift (same
      # posture as alpenflight-e2e.yml).
      - name: Run Playwright (shard ${{ matrix.shard }}/4)
        working-directory: alpenflight/web
        timeout-minutes: 5
        env:
          MOCK_FILTER: ${{ needs.changes.outputs.mock_filter }}
          MOCK_IS_FULL: ${{ needs.changes.outputs.mock_is_full }}
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          if [ "${MOCK_IS_FULL}" = 'true' ] || [ -z "${MOCK_FILTER:-}" ]; then
            echo "running FULL chromium mock suite, shard ${SHARD}/4 (fail-safe / no journey scope)"
            pnpm exec playwright test --config=e2e/playwright.config.ts --project=chromium \
              --shard="${SHARD}/4" --workers=4 --reporter=blob
          else
            echo "running journey-scoped mock specs, shard ${SHARD}/4: ${MOCK_FILTER}"
            pnpm exec playwright test --config=e2e/playwright.config.ts --project=chromium \
              --shard="${SHARD}/4" --workers=4 --reporter=blob "${MOCK_FILTER}"
          fi

      # Blob + screenshots as SEPARATE artifacts (merge job merge-multiples each
      # pattern into its own flat dir). `if: always()` so a red shard still
      # uploads → the merge reflects the failure rather than ENOENT-ing.
      - name: Upload shard blob report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpenflight-mock-e2e-blob-${{ matrix.shard }}
          path: alpenflight/web/blob-report
          retention-days: 14
          if-no-files-found: warn

      - name: Upload shard screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpenflight-mock-e2e-screenshots-${{ matrix.shard }}
          path: alpenflight/web/screenshots
          retention-days: 14
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # alpenflight-mock-e2e-merge — the AUTHORITATIVE mock-suite pass/fail (J-27
  # T-12). `needs:` all four shards, downloads their blobs, and `merge-reports`
  # exits non-zero if ANY shard had a failure — so this single job is the gate
  # the `required` aggregator needs and the name branch protection must require
  # (replacing the old single-job `alpenflight mock-auth e2e (Run Playwright)`).
  # It runs even when a shard failed (`needs.result` is checked, not `success()`)
  # so a partial-red still merges into a diagnosable report. On a docs-only push
  # the shards skip → this is skipped → the aggregator's skipped-to-success path
  # keeps the gate green.
  # ---------------------------------------------------------------------------
  alpenflight-mock-e2e-merge:
    name: alpenflight mock-auth e2e (merge shards)
    needs: [changes, alpenflight-mock-e2e]
    if: >-
      always()
      && github.event_name != 'push'
      && needs.changes.outputs.next == 'true'
      && needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version-file: alpenflight/web/.nvmrc

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11
          run_install: false

      - name: Restore pnpm store cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('alpenflight/web/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install alpenflight/web deps
        working-directory: alpenflight/web
        env:
          CI: 'true'
        run: pnpm install --frozen-lockfile

      # Guard: a shard that CRASHED (infra, not a failed test) may upload no blob,
      # and merge-reports over the remaining blobs would silently go green minus
      # that shard's tests. Fail the gate if any shard job didn't succeed, so a
      # dropped shard can't false-green the suite.
      - name: Assert all shards ran
        env:
          SHARDS_RESULT: ${{ needs.alpenflight-mock-e2e.result }}
        run: |
          set -euo pipefail
          if [ "${SHARDS_RESULT}" != 'success' ]; then
            echo "shard matrix result is '${SHARDS_RESULT}' (not success) — a shard failed or crashed"
            exit 1
          fi

      # `merge-multiple: true` flattens every shard's blob into one dir, which is
      # what `merge-reports` reads from (it scans the dir's TOP LEVEL for
      # report-*.zip, not nested subdirs — verified locally). Screenshots come
      # down separately so the merged-report artifact carries them for diagnosis.
      - name: Download shard blobs
        uses: actions/download-artifact@v4
        with:
          path: alpenflight/web/all-blob-reports
          pattern: alpenflight-mock-e2e-blob-*
          merge-multiple: true

      - name: Download shard screenshots
        uses: actions/download-artifact@v4
        with:
          path: alpenflight/web/screenshots
          pattern: alpenflight-mock-e2e-screenshots-*
          merge-multiple: true

      # The merge exit code IS the gate: non-zero if any shard had a failed test.
      - name: Merge shard reports
        working-directory: alpenflight/web
        run: pnpm exec playwright merge-reports --reporter html ./all-blob-reports

      # Surface the merged report + the shards' diagnostic screenshots so a red is
      # debuggable from one artifact (preserves what the old single job uploaded).
      - name: Upload merged report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpenflight-mock-e2e-${{ github.sha }}
          path: |
            alpenflight/web/playwright-report
            alpenflight/web/screenshots
          retention-days: 14
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Aggregator — single check to wire into branch protection. Passes when
  # every upstream job either succeeded or was correctly skipped (e.g.
  # docs-only PRs skip the next lane, that job reports `skipped`, aggregator
  # is green).
  #
  # PROOF-SCOPING (J-4 T-21+T-22, operator decision 2026-06-05; J-5 T-14/T-19).
  # The per-push required proof is the CURRENT journey's real-idp spec, not the
  # old cross-journey J-0/J-1/J-2 regression:
  #   - `alpenflight-proof` GATES `required` (J-5 T-19, operator decision
  #     2026-06-06 — re-added after a 2026-06-05 drop). It used to run the J-1
  #     aircraft + J-2 flight parity specs, whose known aircraft flake red-ed
  #     `required` on unrelated journeys, so it was dropped from `needs` on
  #     2026-06-05. T-14 (the job now runs only the JOURNEY-UNDER-WORK's own
  #     real-idp spec, derived in `changes` → `proof_spec`) + T-15 (fixed the
  #     aircraft flake) removed that reason, so the real chain gates again: a red
  #     real-idp run for the journey in flight now BLOCKS merge. The full
  #     cross-journey regression stays nightly (`alpenflight-e2e-real-idp.yml`).
  #   - `alpenflight-profile-proof` (J-4's showcase `/profile` self-edit spec)
  #     also gates the merge. The J-3 dashboard display job
  #     (`alpenflight-dashboard-proof`) stays NON-blocking (the visual showcase +
  #     gallery), so the gate isn't coupled to `start-dashboard.spec.ts`.
  # `alpenflight-proof`'s `if:` guard is identical to next-build-server /
  # next-build-web / next-auth-realm-shape (`next == 'true' && docs_only !=
  # 'true'`), and
  # `alpenflight-profile-proof` `needs:` the (non-required) dashboard-proof for
  # runner serialisation only; on a docs-only push the whole heavy chain skips →
  # all three report `skipped` → the skipped-to-success path below keeps the gate
  # green (the `success|skipped)` case).
  # ---------------------------------------------------------------------------
  required:
    name: required
    needs: [changes, next-build-server, next-build-web, next-auth-realm-shape, alpenflight-proof, alpenflight-profile-proof, alpenflight-mock-e2e-merge]
    if: always()
    runs-on: ubuntu-22.04
    timeout-minutes: 3
    steps:
      - name: Check upstream job results
        env:
          R_CHANGES: ${{ needs.changes.result }}
          # J-7 T-13 — `next-build` was split into two parallel toolchain jobs
          # (server+migration-tool / web) so one run reports every build/lint/
          # test red at once; the aggregator gates on BOTH (a red in either reds
          # `required`; both `skipped` on a docs-only push → success path below).
          R_NEXT_SERVER: ${{ needs.next-build-server.result }}
          R_NEXT_WEB: ${{ needs.next-build-web.result }}
          R_AUTH: ${{ needs.next-auth-realm-shape.result }}
          R_PROOF: ${{ needs.alpenflight-proof.result }}
          R_PROFILE_PROOF: ${{ needs.alpenflight-profile-proof.result }}
          R_MOCK_E2E: ${{ needs.alpenflight-mock-e2e-merge.result }}
        run: |
          fail=0
          for pair in \
              "changes:$R_CHANGES" \
              "alpenflight-build-server:$R_NEXT_SERVER" \
              "alpenflight-build-web:$R_NEXT_WEB" \
              "alpenflight-auth-realm-shape:$R_AUTH" \
              "alpenflight-proof:$R_PROOF" \
              "alpenflight-profile-proof:$R_PROFILE_PROOF" \
              "alpenflight-mock-e2e-merge:$R_MOCK_E2E" ; do
            name="${pair%%:*}"
            result="${pair##*:}"
            case "$result" in
              success|skipped) printf "  %-28s %s\n" "$name" "$result" ;;
              *)               printf "  %-28s %s  <-- failing\n" "$name" "$result"; fail=1 ;;
            esac
          done
          [ "$fail" = "0" ]
