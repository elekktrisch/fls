name: alpenflight e2e real-idp

# Nightly + manual-dispatch home of the FULL cross-journey real-idp regression
# (globs `tests/real-idp/`) against a live local Keycloak + Mailpit + alpenflight
# backend. NOT a PR gate — the mock-auth suite (`alpenflight-e2e.yml`) + the
# per-push scoped `ci.yml` proofs stay the gates; real-idp's cross-process
# flakiness must not gate feature work. The per-push `ci.yml` `alpenflight-proof`
# job runs only the journey-under-work's single spec, so this run is the sole
# full-regression path (nightly + once at the §4 do-ship gate).
#
# Sharded across a 4-way matrix (`--shard=i/4`, `reporter: blob`) merged by the
# `real-idp-merge` job so the suite fans out across runners instead of serial-
# running past the step timeout; each shard stays `--workers=1` (serial real-idp).
#
# Stack on the runner:
#   alpenflight-infra (mailpit) + fls-e2e (mssql; not actually used by the
#   specs but seeded for parity with dev-up-full.sh's bring-up shape) +
#   alpenflight-dev (postgres + pgadmin + keycloak) + ng serve --port=4201.
#
# Each project attaches to the external `alpenflight_shared` network (S-172).

on:
  schedule:
    # 03:00 UTC nightly — well after PR merges land + before the morning
    # dev loop kicks in.
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: alpenflight-e2e-real-idp
  cancel-in-progress: false

jobs:
  # Sharded so the cross-journey real-idp regression fans out across runners
  # instead of serial-running the whole `tests/real-idp/` glob past the step
  # timeout. Mirrors ci.yml's `alpenflight-mock-e2e` shard matrix: each shard
  # emits `reporter: blob`; the `real-idp-merge` job is the authoritative
  # pass/fail. `--workers=1` is kept on every shard (real-idp must stay serial:
  # one realm + one Mailpit inbox); the matrix provides the parallelism.
  real-idp:
    name: real-idp Playwright shard ${{ matrix.shard }}/4
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      E2E_REAL_IDP: '1'
    steps:
      - uses: actions/checkout@v4

      # Cross-project shared network. The bring-up scripts inspect-first
      # but on a clean runner we create it explicitly first so the diag
      # message wouldn't be ambiguous.
      - name: Create alpenflight_shared network
        run: docker network create alpenflight_shared --driver bridge

      - name: Bring up alpenflight-infra (mailpit)
        run: bash alpenflight/ops/dev-up-infra.sh

      - name: Build pgAdmin + Keycloak images
        env:
          # The real-idp Playwright project serves the SPA on 4201, so the Keycloak
          # client baseUrl — the target of the login-theme back links (J-19 AC-4 /
          # AC-5) — must be that instance. The compose default is 4200, the `pnpm
          # start` port, and would send the member from Keycloak to a different
          # application than the one under test.
          ALPENFLIGHT_WEB_BASE_URL: http://localhost:4201/
        run: |
          docker compose -f docker-compose.yml --profile next build pgadmin keycloak

      - name: Bring up alpenflight-dev (postgres + pgadmin + keycloak)
        run: |
          docker compose -p alpenflight-dev -f docker-compose.yml \
            up -d --wait --wait-timeout 240 postgres pgadmin keycloak

      - name: Preflight — Keycloak delivers a verify-email into Mailpit
        env:
          # Mirrors the build-arg above: the probe asserts the theme back-link href
          # equals the client baseUrl the image was built with.
          EXPECTED_BASE_URL: http://localhost:4201/
        run: |
          set -euo pipefail
          if bash alpenflight/auth/scripts/check-keycloak-integration.sh; then
            echo "Keycloak created a user, sent the verify-email and Mailpit received it \
          with the realm action-token link. Every mail-layer part is proven: the realm \
          smtpServer substitution, alpenflight_shared DNS, mailpit:1025, and the email \
          template. A spec that later reports 'no message to:<address>' is a browser-form \
          or application fault, not a mail fault."
          else
            echo "::error::Keycloak could not deliver a verify-email into Mailpit. The \
          fault is in the mail layer — the realm smtpServer substitution, alpenflight_shared \
          DNS, the mailpit:1025 listener, or the email template. The script output above \
          names which one. Do NOT blame the register or recovery spec." >&2
            docker exec alpenflight-dev-keycloak-1 bash -c 'getent hosts mailpit || echo "DNS: mailpit unresolved"' >&2 || true
            exit 1
          fi

      # Required for the two ./gradlew call sites below (flywayMigrate +
      # bootJar): Gradle 9.4.1 needs JVM >= 17 and the runner default is 11.
      # Mirrors ci.yml's alpenflight-proof job setup.
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version-file: alpenflight/web/.nvmrc

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11
          run_install: false

      - name: Restore pnpm store cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('alpenflight/web/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install alpenflight/web deps
        working-directory: alpenflight/web
        env:
          CI: 'true'
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('alpenflight/web/pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright browser + deps
        working-directory: alpenflight/web
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = 'true' ]; then
            pnpm exec playwright install-deps chromium
          else
            pnpm exec playwright install --with-deps chromium
          fi

      # Apply Flyway migrations against the target Postgres so the
      # alpenflight backend has the schema it expects at boot. Reuses the
      # same env-driven block dev-up-alpenflight.sh runs locally.
      - name: Flyway migrate (alpenflight Postgres)
        working-directory: alpenflight/server
        run: |
          DATASOURCE_URL=jdbc:postgresql://localhost:5432/alpenflight \
          DATASOURCE_USER=alpenflight \
          DATASOURCE_PASSWORD=alpenflight \
          ./gradlew flywayMigrate --no-daemon --console=plain --quiet

      # The alpenflight backend boots itself for the real-idp probes. We
      # build the bootJar + run it in the background; the setup project's
      # `/actuator/health` probe blocks until the backend is ready.
      - name: Build alpenflight backend bootJar
        working-directory: alpenflight/server
        run: ./gradlew bootJar --no-daemon --console=plain --quiet

      - name: Start alpenflight backend
        working-directory: alpenflight/server
        env:
          DATASOURCE_URL: jdbc:postgresql://localhost:5432/alpenflight
          DATASOURCE_USER: alpenflight
          DATASOURCE_PASSWORD: alpenflight
          SPRING_PROFILES_ACTIVE: dev
          # Pin log level so request-body / payload logging can't leak the
          # canned dev password into the uploaded backend.log artifact. The
          # `dev` Spring profile must not log payloads at INFO either.
          LOGGING_LEVEL_ROOT: INFO
          # J-26 T-29 — env parity with ci.yml's alpenflight-proof job
          # (ci.yml:726-740). The backend runs as a HOST bootJar but Keycloak
          # is a container host-published at localhost:8090 (compose
          # `127.0.0.1:8090:8080`), so the compose-internal `http://keycloak:8080`
          # is unresolvable from a host process. The `dev` profile already
          # redirects JWKS + issuer to localhost:8090, but `keycloak.admin.base-url`
          # (application.yml) still defaults to `http://keycloak:8080` — this
          # nightly never got the override, so the migration-provisioning /
          # user-directory admin client failed at ingest with "I/O error on
          # POST http://keycloak:8080/...token" (bundle-ingest 500 ×3 + the
          # clubadmin1 GET /api/v1/users 400, run 27397268241). Point the
          # admin-base at the host port; the remaining four mirror
          # ci.yml:737-740 verbatim for full parity.
          ALPENFLIGHT_KC_ADMIN_BASE_URL: http://localhost:8090
          ALPENFLIGHT_KC_ADMIN_REALM: alpenflight
          ALPENFLIGHT_KC_ADMIN_CLIENT_ID: alpenflight-backend-admin
          ALPENFLIGHT_KC_ADMIN_CLIENT_SECRET: alpenflight-backend-admin-dev-secret
          ALPENFLIGHT_OIDC_ISSUER_URI: http://localhost:8090/realms/alpenflight
        run: |
          # bootJar archiveBaseName = rootProject.name ("alpenflight-server"),
          # not "server" — and the plain `jar` task also emits a non-executable
          # *-plain.jar. Resolve the executable boot jar by excluding -plain.
          JAR="$(ls build/libs/*.jar | grep -v -- '-plain.jar' | head -1)"
          echo "Starting backend from: $JAR"
          nohup java -jar "$JAR" > backend.log 2>&1 &
          echo "$!" > backend.pid

      - name: Wait for backend /actuator/health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/actuator/health >/dev/null 2>&1; then
              echo "backend ready (attempt $i)"
              exit 0
            fi
            sleep 2
          done
          echo "backend not ready after 120s" >&2
          tail -n 200 alpenflight/server/backend.log >&2 || true
          exit 1

      # DATASOURCE_* is exported so the parity specs' beforeAll Gradle seeder
      # shell-outs reach the same Postgres the backend uses (synth bundle mode).
      #
      # `--grep-invert` drops the one set the cross-journey clean-seed run must
      # not carry: `showcase seed` — `start-dashboard.spec.ts` asserts the
      # `@Profile("showcase")` counts this run never seeds; its gating job is
      # `alpenflight-dashboard-proof` in ci.yml. Filtering applies before sharding,
      # so the dropped tests leave the pool first; `--shard` then partitions the
      # remainder and `--reporter=blob` feeds the `real-idp-merge` job.
      # `--workers=1` keeps each shard serial (one realm + one Mailpit inbox).
      - name: Run Playwright real-idp project (cross-journey regression, shard ${{ matrix.shard }}/4)
        id: pw
        working-directory: alpenflight/web
        timeout-minutes: 15
        env:
          DATASOURCE_URL: jdbc:postgresql://localhost:5432/alpenflight
          DATASOURCE_USER: alpenflight
          DATASOURCE_PASSWORD: alpenflight
          SHARD: ${{ matrix.shard }}
        run: |
          pnpm exec playwright test \
            --config=e2e/playwright.config.ts \
            --project=real-idp \
            --workers=1 \
            --shard="${SHARD}/4" \
            --reporter=blob \
            --grep-invert 'showcase seed' \
            e2e/tests/real-idp/

      - name: Collect logs on failure
        if: failure()
        run: |
          echo "── backend log ─────────────────────────────" >&2
          tail -n 200 alpenflight/server/backend.log >&2 || true
          echo "── keycloak log ────────────────────────────" >&2
          docker compose -p alpenflight-dev -f docker-compose.yml logs --tail 200 keycloak >&2 || true
          echo "── mailpit log ─────────────────────────────" >&2
          docker compose -p alpenflight-infra -f docker-compose.yml --profile infra logs --tail 100 mailpit >&2 || true

      # Blob report → its own per-shard artifact for the merge job to stitch.
      - name: Upload shard blob report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpenflight-real-idp-blob-${{ matrix.shard }}
          path: alpenflight/web/blob-report
          retention-days: 14
          if-no-files-found: warn

      - name: Upload shard diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpenflight-real-idp-diag-${{ matrix.shard }}
          path: |
            alpenflight/web/screenshots
            alpenflight/server/backend.log
          retention-days: 14
          if-no-files-found: warn

      - name: Stop backend
        if: always()
        run: |
          if [ -f alpenflight/server/backend.pid ]; then
            kill "$(cat alpenflight/server/backend.pid)" 2>/dev/null || true
          fi

      - name: Tear down
        if: always()
        run: |
          docker compose -p alpenflight-dev   -f docker-compose.yml                   down -v --remove-orphans || true
          docker compose -p alpenflight-infra -f docker-compose.yml --profile infra   down -v --remove-orphans || true
          docker network rm alpenflight_shared || true

  # The authoritative cross-journey real-idp pass/fail. Mirrors ci.yml's
  # `alpenflight-mock-e2e-merge`: `needs:` every shard, asserts all four ran
  # (a crashed shard that uploaded no blob can't false-green the merged suite),
  # then `merge-reports` — its exit code is the gate (non-zero if any shard had
  # a failed test). Runs even when a shard failed (`needs.result`, not
  # `success()`) so a partial-red still merges into a diagnosable report.
  real-idp-merge:
    name: real-idp Playwright suite (merge shards)
    needs: real-idp
    if: always()
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version-file: alpenflight/web/.nvmrc

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11
          run_install: false

      - name: Restore pnpm store cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('alpenflight/web/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install alpenflight/web deps
        working-directory: alpenflight/web
        env:
          CI: 'true'
        run: pnpm install --frozen-lockfile

      - name: Assert all shards ran
        env:
          SHARDS_RESULT: ${{ needs.real-idp.result }}
        run: |
          set -euo pipefail
          if [ "${SHARDS_RESULT}" != 'success' ]; then
            echo "shard matrix result is '${SHARDS_RESULT}' (not success) — a shard failed or crashed"
            exit 1
          fi

      # always() so the tally can parse the blobs and list failing specs on the
      # ordinary test-failure path, where "Assert all shards ran" exit-1s first
      # and would otherwise skip this default-success() download.
      - name: Download shard blobs
        if: always()
        uses: actions/download-artifact@v4
        with:
          path: alpenflight/web/all-blob-reports
          pattern: alpenflight-real-idp-blob-*
          merge-multiple: true

      - name: Download shard diagnostics
        uses: actions/download-artifact@v4
        with:
          path: alpenflight/web/shard-diagnostics
          pattern: alpenflight-real-idp-diag-*
          merge-multiple: true

      - name: Merge shard reports
        working-directory: alpenflight/web
        run: pnpm exec playwright merge-reports --reporter html ./all-blob-reports

      # The HTML merge above owns the RED-on-failure conclusion (its non-zero
      # exit when any shard had a failed test is the gate). This step exists
      # only to render the tally LOUDLY into the run summary so a red is never
      # silently swallowed — so it re-merges to JSON `if: always()` and neutralizes
      # its own non-zero exit; the job's pass/fail stays the HTML merge's.
      - name: Nightly tally → step summary
        if: always()
        working-directory: alpenflight/web
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: merged-report.json
        run: |
          pnpm exec playwright merge-reports --reporter json ./all-blob-reports > /dev/null || true
          {
            if [ ! -f merged-report.json ]; then
              echo "### real-idp nightly — ⚠️ NO REPORT"
              echo ""
              echo "No merged JSON report was produced (all shards may have crashed pre-test)."
            else
              # stats.{expected,unexpected,flaky} are the run outcomes; skipped is
              # excluded from the total. Only unexpected>0 is the RED signal — a
              # flaky test recovered on retry (job conclusion stays green), so it
              # surfaces as a distinct ⚠️ PASS rather than contradicting the green
              # conclusion with ❌ FAIL.
              read -r passed failed flaky < <(jq -r '.stats | "\(.expected) \(.unexpected) \(.flaky)"' merged-report.json)
              total=$((passed + failed + flaky))
              # total==0 means no test executed (all shards crashed pre-test):
              # a report full of zeros is a no-run, never a pass.
              if [ "$total" -eq 0 ]; then verdict="❌ NO-RUN / FAIL"
              elif [ "$failed" -gt 0 ]; then verdict="❌ FAIL"
              elif [ "$flaky" -gt 0 ]; then verdict="⚠️ PASS (${flaky} flaky-recovered)"
              else verdict="✅ PASS"; fi
              echo "### real-idp nightly — ${verdict}"
              echo ""
              echo "| total | passed | failed | flaky |"
              echo "| ----: | -----: | -----: | ----: |"
              echo "| ${total} | ${passed} | ${failed} | ${flaky} |"
              if [ "$failed" -gt 0 ]; then
                echo ""
                echo "**Failing specs:**"
                echo ""
                # A spec with ok=false is a genuine failure; a flaky spec is ok=true
                # (passed on retry) and counted only in the table above.
                jq -r '[.. | objects | select(has("specs")) | .specs[] | select(.ok | not) | "- `\(.file)` › \(.title)"] | unique | .[]' merged-report.json
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload merged report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpenflight-real-idp-${{ github.run_id }}
          path: |
            alpenflight/web/playwright-report
            alpenflight/web/shard-diagnostics
          retention-days: 14
          if-no-files-found: warn
