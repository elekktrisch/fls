name: alpenflight e2e real-idp

# Nightly + manual-dispatch run of the FULL real-idp Playwright project: register
# + login + locale + Google-redirect smoke PLUS the cross-journey migration-parity
# regression — all against a live local Keycloak + Mailpit + alpenflight backend.
# NOT a PR gate — the mock-auth suite (`alpenflight-e2e.yml`) + the per-push
# scoped proofs in `ci.yml` stay the gates; real-idp's cross-process flakiness
# must not gate feature work.
#
# PROOF-SCOPING (J-4 T-21+T-22, operator decision 2026-06-05 Q1; reconfirmed by
# J-5 T-14, J-3 retro rider). This nightly suite is the HOME of the full
# cross-journey migration-parity regression. J-5 T-14 made the per-push
# `ci.yml` `alpenflight-proof` job run only the journey-under-work's single
# real-idp spec (derived off the integration branch) — so the FULL regression
# runs HERE nightly (globbing `tests/real-idp/`) + once at the §4 do-ship gate,
# never on every push. Nothing changed in THIS workflow; the per-push scoping
# made this nightly run the sole per-commit-independent full-regression path.
# `ci.yml`'s per-push `alpenflight-proof` job used to run the J-1
# `aircraft-migration-parity.spec.ts` + J-2 `flight-migration-parity.spec.ts`
# on every push and gate `required` — but the known aircraft-parity
# cross-process flake intermittently red-ed the gate on journeys touching no
# aircraft. Per the operator's rider ("per-push runs the current journey's spec,
# the full regression nightly") those specs are NO LONGER on the per-push path;
# they run here, in this full `--project=real-idp` run, which already globs
# `tests/real-idp/**/*.spec.ts` (so aircraft + flight + the J-0 Locations
# isolation spec are all covered without an explicit spec list). The DATASOURCE_*
# env on the Playwright step below carries the parity specs' Gradle seeder
# shell-outs to the backend's Postgres (they self-seed in their beforeAll).
#
# Stack on the runner:
#   alpenflight-infra (mailpit) + fls-e2e (mssql; not actually used by the
#   specs but seeded for parity with dev-up-full.sh's bring-up shape) +
#   alpenflight-dev (postgres + pgadmin + keycloak) + ng serve --port=4201.
#
# Each project attaches to the external `alpenflight_shared` network (S-172).

on:
  schedule:
    # 03:00 UTC nightly — well after PR merges land + before the morning
    # dev loop kicks in.
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: alpenflight-e2e-real-idp
  cancel-in-progress: false

jobs:
  real-idp:
    name: real-idp Playwright suite
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      E2E_REAL_IDP: '1'
    steps:
      - uses: actions/checkout@v4

      # Cross-project shared network. The bring-up scripts inspect-first
      # but on a clean runner we create it explicitly first so the diag
      # message wouldn't be ambiguous.
      - name: Create alpenflight_shared network
        run: docker network create alpenflight_shared --driver bridge

      - name: Bring up alpenflight-infra (mailpit)
        run: bash alpenflight/ops/dev-up-infra.sh

      - name: Build pgAdmin + Keycloak images
        run: |
          docker compose -f docker-compose.yml --profile next build pgadmin keycloak

      - name: Bring up alpenflight-dev (postgres + pgadmin + keycloak)
        run: |
          docker compose -p alpenflight-dev -f docker-compose.yml \
            up -d --wait --wait-timeout 240 postgres pgadmin keycloak

      # J-26 T-30d — fail-loud Keycloak→Mailpit SMTP preflight. register.spec's
      # verify-email path is the ONLY KC-sent-SMTP case in the suite and runs
      # ONLY here (ci.yml's per-push proof spec never registers), so a broken
      # KC→Mailpit hop surfaced as a silent mid-suite "no message within 15s"
      # 15 specs later. Assert the two structural prerequisites UP FRONT so a
      # gap reds the job early with a precise message (the T-29 host-vs-container
      # DNS class, now for the KC container reaching the cross-project `mailpit`
      # service over the external `alpenflight_shared` network):
      #   1. KC's container env carries KEYCLOAK_SMTP_HOST=mailpit — the realm
      #      import's ${KEYCLOAK_SMTP_HOST} placeholder is substituted from this
      #      (KC 26.x replaces realm-JSON env placeholders on import by default);
      #      a missing env leaves the literal `${...}` host → no delivery.
      #   2. KC can DNS-resolve + TCP-connect to mailpit:1025 — the SMTP listener
      #      the realm points at by service DNS. The image ships no nc/curl, so
      #      probe with bash `/dev/tcp` (the same technique KC's own healthcheck uses).
      - name: Preflight — Keycloak can reach Mailpit SMTP
        run: |
          set -euo pipefail
          KC=alpenflight-dev-keycloak-1
          echo "── KC SMTP env ─────────────────────────────"
          SMTP_HOST="$(docker exec "$KC" printenv KEYCLOAK_SMTP_HOST || true)"
          SMTP_PORT="$(docker exec "$KC" printenv KEYCLOAK_SMTP_PORT || true)"
          echo "KEYCLOAK_SMTP_HOST=${SMTP_HOST:-<unset>} KEYCLOAK_SMTP_PORT=${SMTP_PORT:-<unset>}"
          if [ "$SMTP_HOST" != "mailpit" ] || [ "$SMTP_PORT" != "1025" ]; then
            echo "::error::KC container SMTP env is not mailpit:1025 — the realm's \
          \${KEYCLOAK_SMTP_HOST}/\${KEYCLOAK_SMTP_PORT} placeholders won't resolve to the \
          Mailpit service (no verify-email delivery). Check alpenflight/auth/.env.example \
          is loaded as the keycloak env_file." >&2
            exit 1
          fi
          echo "── KC → mailpit:1025 TCP reachability ──────"
          # Probe from INSIDE the KC container with the same bash `/dev/tcp`
          # technique the KC healthcheck uses (the image ships no nc/curl, but
          # bash + /dev/tcp is present). A successful connect proves both the
          # cross-project DNS (mailpit resolves over alpenflight_shared) and the
          # SMTP listener — exactly the hop the verify-email send takes. Fails
          # the job on a DNS or network gap instead of a silent mid-suite "no
          # message" timeout.
          if docker exec "$KC" bash -c 'exec 3<>/dev/tcp/mailpit/1025' 2>/dev/null; then
            echo "OK: KC reached mailpit:1025 over alpenflight_shared"
          else
            echo "::error::KC cannot reach mailpit:1025 — cross-project DNS or SMTP \
          listener gap on alpenflight_shared. The realm's smtpServer points at \
          mailpit:1025 by service DNS; KC must join the shared network with mailpit \
          (docker-compose.yml networks: [alpenflight_shared] on both)." >&2
            docker exec "$KC" bash -c 'getent hosts mailpit || echo "DNS: mailpit unresolved"' >&2 || true
            exit 1
          fi

      # Required for the two ./gradlew call sites below (flywayMigrate +
      # bootJar): Gradle 9.4.1 needs JVM >= 17 and the runner default is 11.
      # Mirrors ci.yml's alpenflight-proof job setup.
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version-file: alpenflight/web/.nvmrc

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11
          run_install: false

      - name: Restore pnpm store cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('alpenflight/web/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install alpenflight/web deps
        working-directory: alpenflight/web
        env:
          CI: 'true'
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('alpenflight/web/pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright browser + deps
        working-directory: alpenflight/web
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = 'true' ]; then
            pnpm exec playwright install-deps chromium
          else
            pnpm exec playwright install --with-deps chromium
          fi

      # Apply Flyway migrations against the target Postgres so the
      # alpenflight backend has the schema it expects at boot. Reuses the
      # same env-driven block dev-up-alpenflight.sh runs locally.
      - name: Flyway migrate (alpenflight Postgres)
        working-directory: alpenflight/server
        run: |
          DATASOURCE_URL=jdbc:postgresql://localhost:5432/alpenflight \
          DATASOURCE_USER=alpenflight \
          DATASOURCE_PASSWORD=alpenflight \
          ./gradlew flywayMigrate --no-daemon --console=plain --quiet

      # The alpenflight backend boots itself for the real-idp probes. We
      # build the bootJar + run it in the background; the setup project's
      # `/actuator/health` probe blocks until the backend is ready.
      - name: Build alpenflight backend bootJar
        working-directory: alpenflight/server
        run: ./gradlew bootJar --no-daemon --console=plain --quiet

      - name: Start alpenflight backend
        working-directory: alpenflight/server
        env:
          DATASOURCE_URL: jdbc:postgresql://localhost:5432/alpenflight
          DATASOURCE_USER: alpenflight
          DATASOURCE_PASSWORD: alpenflight
          SPRING_PROFILES_ACTIVE: dev
          # Pin log level so request-body / payload logging can't leak the
          # canned dev password into the uploaded backend.log artifact. The
          # `dev` Spring profile must not log payloads at INFO either.
          LOGGING_LEVEL_ROOT: INFO
          # J-26 T-29 — env parity with ci.yml's alpenflight-proof job
          # (ci.yml:726-740). The backend runs as a HOST bootJar but Keycloak
          # is a container host-published at localhost:8090 (compose
          # `127.0.0.1:8090:8080`), so the compose-internal `http://keycloak:8080`
          # is unresolvable from a host process. The `dev` profile already
          # redirects JWKS + issuer to localhost:8090, but `keycloak.admin.base-url`
          # (application.yml) still defaults to `http://keycloak:8080` — this
          # nightly never got the override, so the migration-provisioning /
          # user-directory admin client failed at ingest with "I/O error on
          # POST http://keycloak:8080/...token" (bundle-ingest 500 ×3 + the
          # clubadmin1 GET /api/v1/users 400, run 27397268241). Point the
          # admin-base at the host port; the remaining four mirror
          # ci.yml:737-740 verbatim for full parity.
          ALPENFLIGHT_KC_ADMIN_BASE_URL: http://localhost:8090
          ALPENFLIGHT_KC_ADMIN_REALM: alpenflight
          ALPENFLIGHT_KC_ADMIN_CLIENT_ID: alpenflight-backend-admin
          ALPENFLIGHT_KC_ADMIN_CLIENT_SECRET: alpenflight-backend-admin-dev-secret
          ALPENFLIGHT_OIDC_ISSUER_URI: http://localhost:8090/realms/alpenflight
        run: |
          # bootJar archiveBaseName = rootProject.name ("alpenflight-server"),
          # not "server" — and the plain `jar` task also emits a non-executable
          # *-plain.jar. Resolve the executable boot jar by excluding -plain.
          JAR="$(ls build/libs/*.jar | grep -v -- '-plain.jar' | head -1)"
          echo "Starting backend from: $JAR"
          nohup java -jar "$JAR" > backend.log 2>&1 &
          echo "$!" > backend.pid

      - name: Wait for backend /actuator/health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/actuator/health >/dev/null 2>&1; then
              echo "backend ready (attempt $i)"
              exit 0
            fi
            sleep 2
          done
          echo "backend not ready after 120s" >&2
          tail -n 200 alpenflight/server/backend.log >&2 || true
          exit 1

      # Full real-idp project — globs tests/real-idp/**/*.spec.ts. This is where
      # the cross-journey migration-parity regression (J-1 aircraft + J-2 flight,
      # plus the J-0 Locations isolation spec) runs after J-4 T-21+T-22 moved it
      # off the per-push gate. DATASOURCE_* is exported so those specs' beforeAll
      # Gradle seeder shell-outs (seedAircraftParityBundle / seedFlightParityBundle)
      # reach the same Postgres the backend uses (synth bundle mode — J1/J2_REAL_*
      # unset → the full legacy→export half stays the fan-out workflow's job).
      #
      # SHOWCASE-SPEC SCOPE NOTE — this CLEAN-seeded nightly only runs `flywayMigrate`
      # (dev seeds V5..V39) and boots `SPRING_PROFILES_ACTIVE: dev`; it does NOT load
      # the `@Profile("showcase")` seed (`./gradlew seedShowcase` — the deterministic
      # 2-club / 14-flight / pilot1-PIC fixture). Two showcase-only specs must be
      # kept OFF this run, each with its OWN showcase-seeded gating job in ci.yml:
      #   1. J-4 `tests/profile/` self-edit spec → asserts the showcase pilot1 Person;
      #      EXCLUDED structurally — it lives OUTSIDE the `e2e/tests/real-idp/` path
      #      filter below (own job: `alpenflight-profile-proof`).
      #   2. J-3 `tests/real-idp/start-dashboard.spec.ts` → asserts the showcase
      #      club-1 dashboard counts (today=3 / pending=4) + the pilot last-flight
      #      card off pilot1's seeded PIC flights. It lives INSIDE `tests/real-idp/`,
      #      so the path filter alone can't drop it — without the showcase seed its
      #      counts read the bare dev-seed totals (pending≠4, total<14) + the pilot
      #      card is empty, reding 3 cases (J-26 T-30b, the cross-journey re-baseline
      #      finding). EXCLUDED here via `--grep-invert 'showcase seed'` (its describe
      #      title carries the unique `[showcase seed, real chain]` tag); its real
      #      gating job is `alpenflight-dashboard-proof` in ci.yml, which loads the
      #      showcase seed first and asserts these exact numbers green.
      - name: Run Playwright real-idp project (full cross-journey regression)
        id: pw
        working-directory: alpenflight/web
        timeout-minutes: 15
        env:
          DATASOURCE_URL: jdbc:postgresql://localhost:5432/alpenflight
          DATASOURCE_USER: alpenflight
          DATASOURCE_PASSWORD: alpenflight
        run: |
          # --workers=1: real-idp must run serial (one realm + one Mailpit inbox →
          # parallel registration races KC user-exists + Mailpit poll contention);
          # `workers` is top-level-only so the project's per-project value is a no-op.
          pnpm exec playwright test \
            --config=e2e/playwright.config.ts \
            --project=real-idp \
            --workers=1 \
            --grep-invert 'showcase seed' \
            e2e/tests/real-idp/

      - name: Collect logs on failure
        if: failure()
        run: |
          echo "── backend log ─────────────────────────────" >&2
          tail -n 200 alpenflight/server/backend.log >&2 || true
          echo "── keycloak log ────────────────────────────" >&2
          docker compose -p alpenflight-dev -f docker-compose.yml logs --tail 200 keycloak >&2 || true
          echo "── mailpit log ─────────────────────────────" >&2
          docker compose -p alpenflight-infra -f docker-compose.yml --profile infra logs --tail 100 mailpit >&2 || true

      - name: Upload Playwright artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpenflight-real-idp-${{ github.run_id }}
          path: |
            alpenflight/web/playwright-report
            alpenflight/web/screenshots
            alpenflight/server/backend.log
          retention-days: 14
          if-no-files-found: warn

      - name: Stop backend
        if: always()
        run: |
          if [ -f alpenflight/server/backend.pid ]; then
            kill "$(cat alpenflight/server/backend.pid)" 2>/dev/null || true
          fi

      - name: Tear down
        if: always()
        run: |
          docker compose -p alpenflight-dev   -f docker-compose.yml                   down -v --remove-orphans || true
          docker compose -p alpenflight-infra -f docker-compose.yml --profile infra   down -v --remove-orphans || true
          docker network rm alpenflight_shared || true
