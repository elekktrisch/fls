name: alpenflight e2e

# Runs the alpenflight/web Playwright suite (Angular under the `mock-auth`
# configuration — no Keycloak / no backend) on PUSH-TO-MAIN ONLY, and publishes
# the result to the gh-pages `/alpenflight/` e2e dashboard (linked from the root
# nav card in .github/pages/root-index.html).
#
# Scope split with ci.yml (J-3 T-12, operator J-2-retro decision):
#   - The PR GATE for this same chromium suite now lives in ci.yml as the
#     `alpenflight-mock-e2e` ("Run Playwright") job, wired into the `required`
#     aggregator — so a red mock-auth e2e BLOCKS merge. That job is `if`-gated to
#     run on `pull_request` only (skips `push`).
#   - This workflow keeps the DISTINCT post-merge purpose: the `main`-push run
#     that performs the `main`-ref-gated gh-pages publish of the `/alpenflight/`
#     e2e dashboard below. Its former `pull_request` trigger is REMOVED so the
#     chromium suite never runs twice on one commit (ci.yml owns PRs; this owns
#     main). The gallery-consolidation rider (J-3 T-13) may later retire this
#     dashboard publish in favor of the proof galleries; until then it stays.
#   - (J-25 T-05 dedup, retained: a branch under both `push` AND `pull_request`
#     ran this twice on one commit — the `alpenflight-e2e-${{ github.ref }}`
#     concurrency groups don't cancel across refs — so `push` is `main`-only.)
#
# SHARDING (the 5-min step ceiling is the operator's hard bar — parallelize, never
# buy wall time): the full chromium suite is 157+ tests; a single job — even at 4
# workers — exceeds 5 min, so the run is split across a `shard: [1,2,3]` matrix.
# Each shard runs ~1/3 of the tests at 4 workers (~2 min test wall + ~30s ng-serve
# boot, comfortably under the 5-min step `timeout-minutes`) and emits a `blob`
# report; the dependent `merge-reports` job stitches the blobs into one HTML report
# and owns the gh-pages publish. The workflow conclusion is red iff a SHARD's test
# step failed (each shard fails its own matrix job on a real test failure;
# `fail-fast: false` lets the others finish so the merged report is complete).
#
# gh-pages publication uses `keep_files: true` and namespaces under
# /alpenflight/. The legacy nightly workflow (`nightly.yml`) now publishes
# under /legacy/ with the same `keep_files: true` policy, so the two
# dashboards coexist without races. The root nav page (`/index.html`) is
# deployed by both workflows from `.github/pages/root-index.html`; the
# content is static and identical, so whichever workflow lands last wins
# harmlessly.

on:
  push:
    branches: [main]
    paths:
      - 'alpenflight/web/**'
      - '.github/workflows/alpenflight-e2e.yml'
  # NO `pull_request` trigger: the PR gate for this chromium suite is ci.yml's
  # `alpenflight-mock-e2e` job (wired into `required`). Keeping a PR trigger here
  # would double-run the suite on every integration PR (see header).
  workflow_dispatch:

concurrency:
  group: alpenflight-e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  # Single source of truth for the shard count: the matrix below and the
  # `--shard=i/N` denominator must agree, so N lives here.
  SHARD_TOTAL: 3

jobs:
  playwright:
    name: Run Playwright (shard ${{ matrix.shard }})
    runs-on: ubuntu-22.04
    strategy:
      # Run every shard even when one fails — a shard's red is the workflow's
      # red signal, but the others must still finish so `merge-reports` has the
      # full report and the failing shard is diagnosable alongside the rest.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version-file: alpenflight/web/.nvmrc

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11
          run_install: false

      - name: Restore pnpm store cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('alpenflight/web/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install alpenflight/web deps
        working-directory: alpenflight/web
        env:
          CI: 'true'
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('alpenflight/web/pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright browser + deps
        working-directory: alpenflight/web
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = 'true' ]; then
            pnpm exec playwright install-deps chromium
          else
            pnpm exec playwright install --with-deps chromium
          fi

      - name: Run Playwright
        id: pw
        working-directory: alpenflight/web
        # Per-shard step ceiling — the operator's hard bar. ~1/3 of the suite at
        # 4 workers (top-level `workers` in playwright.config.ts) + ~30s ng-serve
        # boot fits well inside 5 min. If a shard grows past it, add a shard or
        # prune low-value specs — NEVER raise this (the iteration loop is the
        # constraint worth optimizing for). Per-test timeout 30s; retries 0 in CI.
        #
        # `--reporter=blob` (overrides the config's html/json reporters for the
        # shard): each shard writes `blob-report/report-<shard>.zip`, which the
        # `merge-reports` job stitches into one HTML report. `--workers=4` is
        # belt-and-suspenders over the top-level config so the shard fans out to
        # the runner's 4 vCPUs regardless of config drift.
        #
        # `continue-on-error: false` (default): a shard's test failure fails this
        # matrix job — that IS the workflow's red signal. The report still
        # publishes because `merge-reports` is gated `!cancelled()`.
        timeout-minutes: 5
        run: >
          pnpm exec playwright test
          --config=e2e/playwright.config.ts
          --project=chromium
          --shard=${{ matrix.shard }}/${{ env.SHARD_TOTAL }}
          --workers=4
          --reporter=blob

      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: alpenflight-blob-report-${{ matrix.shard }}
          path: alpenflight/web/blob-report
          retention-days: 1
          if-no-files-found: error

      - name: Upload shard screenshots
        # Each shard runs a subset of specs, so it produces a PARTIAL
        # screenshots/ tree; merge-reports collects all shards' shots for the
        # dashboard gallery. `warn` (not `error`): a shard may legitimately run
        # only specs that take no screenshots.
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: alpenflight-screenshots-${{ matrix.shard }}
          path: alpenflight/web/screenshots
          retention-days: 1
          if-no-files-found: warn

  merge-reports:
    name: Merge reports + publish dashboard
    needs: [playwright]
    runs-on: ubuntu-22.04
    # `!cancelled()` keeps this alive when a shard's test step was red — the whole
    # point of publishing is reading the failing run's report. It does NOT run on
    # a genuine cancel (push-superseded).
    if: ${{ !cancelled() }}
    # `contents: write` lets the gh-pages deploy step push to the gh-pages branch.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version-file: alpenflight/web/.nvmrc

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11
          run_install: false

      - name: Restore pnpm store cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('alpenflight/web/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install alpenflight/web deps
        working-directory: alpenflight/web
        env:
          CI: 'true'
        run: pnpm install --frozen-lockfile

      - name: Download blob reports
        uses: actions/download-artifact@v4
        with:
          path: alpenflight/web/all-blob-reports
          pattern: alpenflight-blob-report-*
          merge-multiple: true

      - name: Download shard screenshots
        uses: actions/download-artifact@v4
        with:
          path: alpenflight/web/screenshots
          pattern: alpenflight-screenshots-*
          merge-multiple: true

      - name: Merge blob reports into HTML
        working-directory: alpenflight/web
        # Stitches the per-shard blobs into the single `playwright-report/` HTML
        # the dashboard publishes. `merge-reports` itself does NOT fail on test
        # failures — the red signal is the `playwright` matrix job; this job is
        # `!cancelled()` so the report publishes even when a shard was red.
        run: pnpm exec playwright merge-reports --reporter html ./all-blob-reports

      - name: Assemble publishable bundle
        if: always()
        env:
          # The dashboard headline reflects the suite outcome: red if ANY shard's
          # test job failed, success otherwise. `needs.playwright.result` is the
          # aggregate matrix result (success/failure/cancelled/skipped).
          PW_OUTCOME: ${{ needs.playwright.result == 'success' && 'success' || 'failure' }}
        run: |
          mkdir -p public/alpenflight
          if [ -d alpenflight/web/playwright-report ]; then
            cp -r alpenflight/web/playwright-report public/alpenflight/report
          fi
          if [ -d alpenflight/web/screenshots ]; then
            cp -r alpenflight/web/screenshots public/alpenflight/screenshots
          fi

          SCREENSHOTS=""
          if [ -d public/alpenflight/screenshots ]; then
            for catdir in public/alpenflight/screenshots/*/; do
              [ -d "$catdir" ] || continue
              compgen -G "${catdir}*.png" > /dev/null || continue
              cat=$(basename "$catdir")
              if [ -z "$SCREENSHOTS" ]; then
                SCREENSHOTS='<section><h2>Full-page screenshots</h2>'
              fi
              SCREENSHOTS="${SCREENSHOTS}<h3 class=\"cat\">${cat}</h3><div class=\"gallery\">"
              for f in "${catdir}"*.png; do
                name=$(basename "$f")
                rel="screenshots/${cat}/${name}"
                SCREENSHOTS="${SCREENSHOTS}<a class=\"shot\" href=\"${rel}\"><img src=\"${rel}\" loading=\"lazy\" alt=\"${cat}/${name}\"><span>${name}</span></a>"
              done
              SCREENSHOTS="${SCREENSHOTS}</div>"
            done
            [ -n "$SCREENSHOTS" ] && SCREENSHOTS="${SCREENSHOTS}</section>"
          fi

          export TIMESTAMP="$(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          export COMMIT_SHORT="${GITHUB_SHA:0:7}"
          export BRANCH="${GITHUB_REF_NAME}"
          export PW_OUTCOME SCREENSHOTS

          envsubst '${TIMESTAMP} ${COMMIT_SHORT} ${BRANCH} ${PW_OUTCOME} ${SCREENSHOTS}' \
            < .github/pages/alpenflight-index.html > public/alpenflight/index.html

          # Root nav page picks between /legacy/ and /alpenflight/. Deployed by
          # both workflows; content is static and identical.
          cp .github/pages/root-index.html public/index.html

      - name: Upload workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpenflight-playwright-${{ github.sha }}
          path: public/alpenflight
          retention-days: 14
          if-no-files-found: warn

      - name: Deploy to gh-pages
        # `always()` keeps this step alive when a shard was red — the whole point
        # of publishing is that you can read the failing run's report. Convention
        # is `always()` first so it's clear the implicit `success()` gate is
        # intentionally lifted.
        if: ${{ always() && github.ref == 'refs/heads/main' }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: public
          publish_branch: gh-pages
          keep_files: true
          enable_jekyll: false
          commit_message: "alpenflight e2e: ${{ needs.playwright.result }} for ${{ github.sha }}"
