name: Rebuild proof-previews index
description: >-
  J-5 T-13b — regenerate the persistent, bookmarkable proof-previews landing page
  (alpenflight/previews/index.html) from the CURRENT gh-pages tree, then deploy
  ONLY that one file. The index is now a persistent JOURNEY directory: it lists
  every roadmap journey J-0…J-N (in _ORDER.md order) and links each one's
  per-journey page, probing — in priority order — the active branch preview
  (alpenflight/proof-preview/<branch>/J-<n>/, ephemeral), the canonical main
  deploy (alpenflight/proof/J-<n>/), and the fan-out archive
  (alpenflight/proof/legacy-parity/J-<n>/). The latter two SURVIVE PR close (the
  reaper only rm's proof-preview/<branch>/), so the index shows J-0…J-N even after
  every PR merges. Pending journeys render a no-link "pending" row. Because the
  index is rebuilt from a fresh scan every time, it is correct under
  last-writer-wins even when concurrent per-branch deploys race (disjoint dirs).

  Call this AFTER each gallery deploy step (per-branch or main). Fail-soft: a
  missing gh-pages branch or a push race is a warning, never a job-failing error —
  the index is a convenience entry point, not a proof gate.

inputs:
  github_token:
    description: Token with contents:write to push the rebuilt index to gh-pages.
    required: true
  branch:
    description: >-
      Optional active branch ref to surface its freshly-built per-journey preview
      pages (alpenflight/proof-preview/<sanitized>/J-<n>/). Defaults to the
      sanitized github.head_ref (PR) / github.ref_name (push). Sanitized with the
      SAME rule as ci.yml's preview subpath so the branch-preview source matches.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Rebuild + deploy previews index
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}
        BRANCH_INPUT: ${{ inputs.branch }}
        HEAD_REF: ${{ github.head_ref }}
        REF_NAME: ${{ github.ref_name }}
      run: |
        set -uo pipefail
        WORK="$(mktemp -d)"
        # --- check out the CURRENT gh-pages tree (shallow) -------------------
        git init -q "$WORK/gh-pages"
        (
          cd "$WORK/gh-pages"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if ! git fetch -q --depth 50 origin gh-pages; then
            echo "::warning::gh-pages branch not found — no previews to index yet (skipping rebuild)."
            exit 7
          fi
          git checkout -q -b gh-pages FETCH_HEAD
        ) || { code=$?; [ "$code" = "7" ] && exit 0 || exit 0; }

        # T-13b — the index is now a persistent JOURNEY directory driven off the
        # per-journey pages under alpenflight/proof/ (canonical) +
        # alpenflight/proof/legacy-parity/ (fan-out archive) — both SURVIVE PR
        # close. It must rebuild even when no active branch preview exists (the
        # PR-closed world). So the gate is: SOME proof content exists (either the
        # persistent journey pages or an active preview). Only skip when neither.
        if [ ! -d "$WORK/gh-pages/alpenflight/proof" ] \
           && [ ! -d "$WORK/gh-pages/alpenflight/proof-preview" ]; then
          echo "::warning::no alpenflight/proof[-preview]/ on gh-pages yet — nothing to index."
          exit 0
        fi

        # Sanitized active branch (SAME rule as ci.yml's preview subpath) so the
        # branch-preview source (proof-preview/<sanitized>/J-<n>/) matches. The
        # head_ref is set on PRs; ref_name on push. Empty branch simply skips the
        # branch-preview source (canonical + archive still drive the listing).
        RAW_BRANCH="${BRANCH_INPUT:-${HEAD_REF:-$REF_NAME}}"
        BRANCH="$(printf '%s' "$RAW_BRANCH" | sed -E 's#[^A-Za-z0-9._-]#-#g')"
        echo "indexing journeys (active branch: '${BRANCH}')"

        # --- regenerate the index from the on-disk scan (git-mtime mode) -----
        # The generator is dependency-free Node core; the runner already has Node.
        node "${GITHUB_ACTION_PATH}/../../../alpenflight/web/e2e/proof-gallery/generate-previews-index.mjs" \
          --gh-pages-root "$WORK/gh-pages" --git ${BRANCH:+--branch "$BRANCH"} \
          || { echo "::warning::previews-index generation failed — leaving existing index untouched."; exit 0; }

        # --- deploy ONLY alpenflight/previews/ back to gh-pages -------------
        # Stage the single generated file into a clean publish dir so peaceiris
        # (destination_dir + keep_files:true) writes ONLY alpenflight/previews/
        # and never touches the per-branch galleries or the canonical proof.
        STAGE="$WORK/publish"
        mkdir -p "$STAGE"
        cp "$WORK/gh-pages/alpenflight/previews/index.html" "$STAGE/index.html"
        echo "staged previews index for deploy:"
        ls -l "$STAGE"
        # Export the staging dir for the deploy step below.
        echo "PREVIEWS_PUBLISH_DIR=$STAGE" >> "$GITHUB_ENV"

    - name: Deploy previews index to gh-pages
      if: ${{ env.PREVIEWS_PUBLISH_DIR != '' }}
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ inputs.github_token }}
        publish_dir: ${{ env.PREVIEWS_PUBLISH_DIR }}
        destination_dir: alpenflight/previews
        publish_branch: gh-pages
        keep_files: true
        enable_jekyll: false
        commit_message: "rebuild proof-previews index (${{ github.ref_name }} ${{ github.sha }})"
